<title>Savanturier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout : application de révision pour enfants (CP → CM2), sur tablette d'abord.
   Style « Monde vivant » : un paysage illustré en plein écran (couleurs propres à chaque univers),
   des panneaux en verre dépoli par-dessus, la police Lexend pour l'interface et Andika pour tout
   ce que l'enfant lit. Accueil en tuiles, menu flottant ; écran de leçon : consigne du guide, puis
   un panneau qui réunit l'illustration et, juste dessous, l'exercice. Thème clair unique, voulu. */
:root {
  --ink: #17302A; --ink-soft: #4A6159;
  --glass: rgba(255,255,255,.66); --glass-strong: rgba(255,255,255,.86); --glass-line: rgba(255,255,255,.92);
  --shadow: 0 22px 44px -24px rgba(23,48,42,.55); --shadow-s: 0 10px 22px -12px rgba(23,48,42,.5);
  --accent: #E8604C; --accent-deep: #C24432;
  --gold: #FFC93C; --gold-deep: #E88A00;
  --ok: #2E8656; --ok-soft: #DDF3E5; --ko: #C2410C; --ko-soft: #FFE6D8;
  --u: #2F6FD1; --u-sky: #BFDDFF; --d: #D2477A; --d-sky: #FFD0DF; --c: #2E8656; --c-sky: #C8EDD5;
  --font-ui: "Lexend", "Segoe UI", system-ui, sans-serif;
  --font-read: "Andika", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #CDEBFF; }
body { background: #CDEBFF; color: var(--ink); font-family: var(--font-ui); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-ui); font-weight: 700; margin: 0; line-height: 1.12; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.scenery { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.scenery svg { width: 100%; height: 100%; display: block; }
.app { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 110px; display: grid; gap: 18px; }

/* Verre dépoli */
.glass, .parch, .topbar .pill, .tab, .profile, .lesson, .scene-head, .speech, .arena, .card, .kpi {
  background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.parch { border-radius: 28px; padding: 18px 20px; min-width: 0; background: var(--glass-strong); }

/* Barre du haut */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 16px 6px 6px; cursor: pointer; box-shadow: var(--shadow-s); }
.brand .logo { width: 36px; height: 36px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 15px; font-weight: 500; color: var(--ink); box-shadow: var(--shadow-s) !important; }
.pill svg { width: 20px; height: 20px; }
.pill.who { cursor: default; font-weight: 600; }
.pill[aria-pressed="false"] { opacity: .7; }
select.pill { border: 1px solid var(--glass-line); background: var(--glass-strong); }

/* Boutons */
.btn { cursor: pointer; border-radius: 20px; min-height: 52px; padding: 12px 24px; font-weight: 600; font-size: 18px; border: 0;
  background: var(--accent); color: #FFFFFF; box-shadow: 0 14px 24px -12px var(--accent-deep); transition: transform .12s; }
.btn:active { transform: translateY(2px) scale(.99); }
.btn.ghost { background: var(--glass-strong); color: var(--ink); box-shadow: var(--shadow-s); border: 1px solid var(--glass-line); }
.btn.small { min-height: 44px; padding: 8px 16px; font-size: 16px; border-radius: 16px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 20px; height: 20px; vertical-align: -4px; }
.panel { display: grid; gap: 16px; }
.h-title { font-size: clamp(32px, 6vw, 48px); text-align: center; }
.sub { color: var(--ink-soft); text-align: center; }
.note { font-size: 14px; color: var(--ink-soft); }
.on-scene { padding: 10px 18px; border-radius: 22px; background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); justify-self: center; }

/* Formulaires */
.form { display: grid; gap: 12px; }
.form label { font-size: 15px; font-weight: 600; color: var(--ink-soft); display: grid; gap: 6px; }
.form input, .form select, .form textarea { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 16px; border: 1px solid #D5E2DC; background: #FFFFFF; color: var(--ink); }
.form textarea { min-height: 160px; resize: vertical; line-height: 1.4; font-family: var(--font-read); font-size: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > label { flex: 1 1 180px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; flex-direction: row; align-items: center; gap: 6px; font-weight: 500; color: var(--ink); padding: 6px 12px; border-radius: 999px; border: 1px solid #D5E2DC; background: #FFFFFF; }

/* Qui joue ? */
.profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.profile { display: grid; justify-items: center; gap: 6px; padding: 18px 14px; border-radius: 30px; cursor: pointer; text-align: center; color: var(--ink); }
.profile .lumi { width: 92px; }
.profile b { font-weight: 700; font-size: 22px; }
.profile small { color: var(--ink-soft); }
.profile.add { border: 2px dashed rgba(23,48,42,.35); align-content: center; min-height: 190px; }
.profile.add b { font-size: 40px; color: var(--accent); }

/* Accueil de l'enfant : tuiles */
.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.hello .date { font-size: 15px; color: var(--ink-soft); font-weight: 500; }
.hello h1 { font-size: clamp(30px, 5vw, 42px); }
.bento { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 760px) { .bento { grid-template-columns: minmax(0, 1fr); } .bento .hero { grid-column: auto !important; } }
.hero { grid-column: span 2; border-radius: 34px; padding: 26px 28px; color: #FFFFFF; background: var(--accent); position: relative; overflow: hidden;
  display: flex; justify-content: space-between; gap: 12px; box-shadow: 0 30px 50px -26px var(--accent-deep), inset 0 2px 0 rgba(255,255,255,.25); min-height: 260px; }
.hero::before { content: ""; position: absolute; right: -70px; top: -70px; width: 300px; height: 300px; border-radius: 50%; background: rgba(255,255,255,.13); }
.hero .txt { position: relative; display: flex; flex-direction: column; gap: 12px; max-width: 420px; }
.hero .tag { align-self: flex-start; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.22); font-weight: 600; font-size: 14px; }
.hero h2 { font-size: clamp(28px, 4vw, 38px); line-height: 1.05; }
.hero .go { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 58px; padding: 0 28px; border-radius: 20px; border: 0; background: #FFFFFF; color: var(--accent-deep);
  font-weight: 700; font-size: 20px; box-shadow: 0 12px 22px -10px rgba(0,0,0,.35); cursor: pointer; }
.hero .lumi { position: relative; width: 200px; align-self: flex-end; margin-bottom: -26px; flex: none; }
@media (max-width: 520px) { .hero .lumi { width: 120px; } }
.tile { border-radius: 30px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; text-align: left; color: var(--ink); cursor: pointer; min-height: 170px;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.tile .ico { width: 62px; height: 62px; border-radius: 20px; display: grid; place-items: center; font-weight: 700; font-size: 24px; color: #FFFFFF; }
.tile .ico svg { width: 32px; height: 32px; }
.tile b { font-size: 22px; font-weight: 700; display: block; }
.tile span.sm { color: var(--ink-soft); font-weight: 500; font-size: 15px; }
.tile.goal { cursor: default; }
.bar { height: 14px; border-radius: 999px; background: rgba(23,48,42,.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--gold); }
.dock { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; padding: 7px; border-radius: 999px;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); max-width: calc(100vw - 24px); }
.dock button { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; background: transparent; font-weight: 600; cursor: pointer; color: var(--ink); white-space: nowrap; }
.dock button[aria-current="page"] { background: var(--ink); color: #FFFFFF; }
.dock svg { width: 20px; height: 20px; }
@media (max-width: 520px) { .dock button span { display: none; } .dock button { padding: 0 16px; } }

/* Parcours : un chemin d'étapes par matière */
.subject { display: grid; gap: 10px; padding: 18px 20px; border-radius: 30px; }
.subject h3 { font-size: 24px; display: flex; align-items: center; gap: 12px; }
.subject h3 .ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #FFFFFF; font-size: 18px; }
.subject h3 .ico svg { width: 24px; height: 24px; }
.subj-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.subj-tab { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 5px 14px 5px 5px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); font-weight: 600; color: var(--ink); cursor: pointer; box-shadow: var(--shadow-s); }
.subj-tab .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; font-size: 13px; font-weight: 700; }
.subj-tab .ico svg { width: 20px; height: 20px; }
.subj-tab[aria-selected="true"] { background: var(--ink); color: #FFFFFF; }
.path-progress { display: grid; gap: 6px; }
.path-progress .sm { color: var(--ink-soft); font-size: 15px; }
.path { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; padding: 4px 0; }
.step { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 22px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.75); cursor: pointer; color: var(--ink); text-align: left; min-height: 76px; }
.step .dot { width: 52px; height: 52px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 4px solid #FFFFFF; box-shadow: var(--shadow-s); background: var(--glass-strong); }
.step .dot svg { width: 24px; height: 24px; }
.step.done .dot { background: radial-gradient(circle at 35% 30%, #FFF0A8, var(--gold) 55%, var(--gold-deep)); }
.step.next { box-shadow: 0 0 0 3px var(--accent), var(--shadow-s); background: #FFFFFF; }
.step.next .dot { background: var(--accent); }
.step.locked { opacity: .6; cursor: not-allowed; }
.step .txt { display: grid; gap: 2px; min-width: 0; }
.step .num { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
.step .t { font-size: 16px; font-weight: 700; line-height: 1.2; }
.step .stat { font-size: 13px; color: var(--ink-soft); }
.step.next .stat { color: var(--accent-deep); font-weight: 700; }
.step .mine { font-size: 11px; font-weight: 700; color: var(--d); text-transform: uppercase; letter-spacing: .06em; }
.revisions { border-top: 1px solid rgba(23,48,42,.1); padding-top: 10px; display: grid; gap: 10px; }
.revisions > summary { cursor: pointer; font-weight: 600; color: var(--ink-soft); min-height: 44px; display: flex; align-items: center; }
@media (max-width: 520px) { .path { grid-template-columns: minmax(0, 1fr); } .subj-tabs { gap: 6px; } .subj-tab { min-height: 44px; padding: 4px 12px 4px 4px; font-size: 15px; } .subj-tab .ico { width: 32px; height: 32px; } }

/* Toutes les leçons */
.grid-lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.lesson { display: grid; gap: 8px; padding: 16px 18px; border-radius: 26px; cursor: pointer; text-align: left; color: var(--ink); position: relative; background: var(--glass-strong); }
.lesson .lv { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--ink-soft); }
.lesson .t { font-weight: 700; font-size: 18px; line-height: 1.2; }
.lesson .st { font-size: 14px; color: var(--ink-soft); }
.lesson .stars { display: flex; gap: 3px; }
.lesson .stars svg { width: 20px; height: 20px; fill: rgba(23,48,42,.15); }
.lesson .stars svg.on { fill: var(--gold); }
.lesson.next { box-shadow: 0 0 0 4px var(--accent), var(--shadow); }
.lesson[disabled] { opacity: .6; cursor: not-allowed; }
.lesson .mine { position: absolute; top: 12px; right: 14px; font-size: 11px; font-weight: 700; color: var(--d); text-transform: uppercase; letter-spacing: .06em; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { min-height: 46px; padding: 8px 18px; border-radius: 999px; cursor: pointer; color: var(--ink); font-weight: 600; box-shadow: var(--shadow-s); }
.tab[aria-selected="true"] { background: var(--ink); color: #FFFFFF; }

/* Écran de leçon */
.scene { display: grid; gap: 14px; }
.scene-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; border-radius: 24px; padding: 12px 20px; }
.scene-head h2 { font-size: clamp(22px, 4vw, 30px); }
.scene-head .lv { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.dialog { display: flex; gap: 12px; align-items: flex-end; }
.dialog .lumi { width: 96px; flex: none; }
.speech { flex: 1; border-radius: 26px 26px 26px 8px; display: grid; gap: 8px; padding: 16px 20px; background: var(--glass-strong); }
.speech .txt { font-family: var(--font-read); font-size: 22px; line-height: 1.35; font-weight: 700; }
.speech .txt b { color: var(--accent-deep); }
.speech .acts { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.listen { border: 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 15px; font-weight: 600; min-height: 44px; padding: 0 14px; border-radius: 999px; background: rgba(23,48,42,.07); color: var(--ink); }
.listen svg { width: 20px; height: 20px; }
.arena { display: grid; gap: 16px; padding: 18px; border-radius: 32px; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.board { min-width: 0; display: grid; justify-items: center; gap: 12px; }
.side { display: grid; justify-items: center; gap: 8px; }
@media (max-width: 620px) { .stage { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } .side .vessel { display: none; } }
.play { border-top: 1px solid rgba(23,48,42,.12); padding-top: 16px; min-height: 90px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; }
.play:empty { display: none; }
.lumi { overflow: visible; animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.lumi .m-think, .lumi .m-cheer { display: none; }
.lumi.think .m-happy, .lumi.cheer .m-happy { display: none; }
.lumi.think .m-think, .lumi.cheer .m-cheer { display: inline; }
.lumi.think { animation: tilt 1.2s ease-in-out; } .lumi.cheer { animation: hop .5s ease-in-out 3; }
@keyframes tilt { 30% { transform: rotate(-8deg); } 70% { transform: rotate(6deg); } }
@keyframes hop { 50% { transform: translateY(-16px); } }

/* Contenus du plateau */
.card { border-radius: 22px; padding: 14px 20px; font-family: var(--font-read); font-size: 22px; max-width: 100%; background: var(--glass-strong); color: var(--ink); }
.card.big { font-size: 28px; text-align: center; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.chip { background: #FFFFFF; color: var(--ink); border-radius: 999px; padding: 8px 18px; font-family: var(--font-read); font-size: 21px; font-weight: 700; box-shadow: var(--shadow-s); }
.text-gaps { line-height: 2.2; }
.gap { display: inline-block; min-width: 76px; border-bottom: 3px solid rgba(23,48,42,.35); text-align: center; padding: 0 6px; font-weight: 700; color: var(--accent-deep); }
.gap.now { border-color: var(--accent); background: rgba(255,255,255,.9); border-radius: 8px 8px 0 0; }
.verses { display: grid; gap: 4px; font-size: 22px; }
.verses .v { padding: 3px 12px; border-radius: 10px; transition: background .3s; }
.verses .v.now { background: #FFF1C2; }
.slots-list { display: grid; gap: 8px; width: min(100%, 560px); counter-reset: s; }
.slots-list .s { min-height: 50px; border-radius: 16px; border: 2px dashed rgba(23,48,42,.25); background: rgba(255,255,255,.7); padding: 10px 14px 10px 46px; position: relative; font-family: var(--font-read); font-size: 20px; font-weight: 700; }
.slots-list .s::before { counter-increment: s; content: counter(s); position: absolute; left: 14px; top: 10px; font-family: var(--font-ui); font-weight: 700; color: var(--ink-soft); }
.slots-list .s.filled { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.conj { display: grid; grid-template-columns: auto auto; gap: 10px 16px; font-size: 24px; align-items: center; }
.conj .p { text-align: right; color: var(--ink-soft); }
.conj .f { min-width: 130px; border-bottom: 3px solid rgba(23,48,42,.35); font-weight: 700; color: var(--accent-deep); padding: 0 6px; }
.conj .f.now { border-color: var(--accent); background: rgba(255,255,255,.9); border-radius: 8px 8px 0 0; }
.word-slots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.word-slots .l { width: 48px; height: 58px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-read); font-size: 32px; font-weight: 700; background: #FFFFFF; box-shadow: var(--shadow-s); }
.word-slots .l.space { width: 18px; background: transparent; box-shadow: none; }
.word-slots .l.fixed { background: transparent; box-shadow: none; }
.word-slots .l.bad { background: var(--ko-soft); color: var(--ko); }
.word-slots .l.good { background: var(--ok-soft); color: var(--ok); }
.hear { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.houses { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; width: 100%; min-width: 0; max-width: 760px; align-items: end; }
.house { display: grid; justify-items: center; border-radius: 26px; }
.house .cottage { width: 100%; max-width: 200px; height: auto; margin-bottom: -4px; display: block; }
.house .hbody { width: 100%; border-radius: 24px; padding: 12px; background: var(--glass-strong); border: 1px solid var(--glass-line); box-shadow: var(--shadow-s); min-height: 120px; display: grid; gap: 8px; align-content: start; transition: box-shadow .2s; }
.house .name { text-align: center; font-weight: 700; font-size: 18px; }
.house .in { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.house .in span { background: #FFFFFF; border-radius: 999px; padding: 4px 12px; font-family: var(--font-read); font-weight: 700; font-size: 17px; box-shadow: 0 6px 12px -8px rgba(23,48,42,.5); animation: dgin .4s both; }
.house.drop .hbody { box-shadow: 0 0 0 3px rgba(23,48,42,.15), var(--shadow-s); cursor: pointer; }
.house.drop.hover .hbody { box-shadow: 0 0 0 4px var(--accent), var(--shadow-s); }
@media (max-width: 520px) { .houses { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } .house .name { font-size: 14px; } .house .in span { font-size: 13px; padding: 2px 8px; } .house .hbody { min-height: 90px; padding: 8px; } }

/* Éléments à manipuler */
.tray { display: grid; gap: 10px; justify-items: center; }
.tray-label { color: var(--ink-soft); font-size: 15px; font-weight: 500; }
.tray-label b { color: var(--ink); font-size: 24px; }
.stones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.stone { min-width: 64px; min-height: 64px; padding: 0 20px; border-radius: 999px; cursor: grab; touch-action: none; user-select: none; border: 0;
  color: var(--ink); font-family: var(--font-read); font-size: 30px; font-weight: 700; background: #FFFFFF; box-shadow: 0 14px 22px -12px rgba(23,48,42,.55); }
.stone.tag { font-size: 22px; min-height: 56px; }
.stone.held { box-shadow: 0 0 0 4px var(--accent), 0 24px 32px -12px rgba(23,48,42,.6); transform: translateY(-6px) rotate(-3deg) scale(1.05); }
.stone.lifted { opacity: .3; }
