<title>L'École d'Additia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Berkshire+Swash&display=swap">
<style>
/* Layout : application de révision pour enfants (CP → CM2), univers de conte au choix.
   Accueil « Qui joue ? » -> carte de l'enfant (parcours par matière / libre) -> leçon jouée :
   consigne du guide, puis un cadre qui réunit l'illustration et, juste dessous, l'exercice.
   Thème volontairement unique (nuit étoilée) : toutes les couleurs sont fixées ci-dessous. */
:root {
  --night: #16123c; --night-2: #2c2468;
  --gold: #f7cc4f; --gold-deep: #c99a1c; --star: #fff6d6;
  --ink: #fbf6ea; --muted: #cfc8ef;
  --parchment: #fbf2dd; --parchment-edge: #e6d3a6; --brown: #3d2b1c; --brown-soft: #7a6347;
  --u: #2a63d4; --u-sky: #9ccfff; --d: #c8245e; --d-sky: #ffa5c2; --c: #1f8a4c; --c-sky: #9de6b5;
  --ok: #1d7f52; --ok-soft: #dcf3e4; --ko: #b34a0c; --ko-soft: #fde6d4;
  --font-tale: "Berkshire Swash", Georgia, serif;
  --font-body: "Andika", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body { background: radial-gradient(120% 70% at 50% 0%, var(--night-2), var(--night) 70%) fixed, var(--night);
  color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-tale); font-weight: 400; margin: 0; line-height: 1.12; text-wrap: balance; }
p { margin: 0; }
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--star); opacity: .5; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .1; transform: scale(.6); } }
.app { position: relative; z-index: 1; max-width: 880px; margin: 0 auto;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px 56px; display: grid; gap: 16px; }

/* Barre du haut */
.topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.brand { font-family: var(--font-tale); font-size: 24px; color: var(--gold); background: none; border: 0; cursor: pointer; padding: 0; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 15px;
  border: 1.5px solid color-mix(in srgb, var(--muted) 45%, transparent); background: color-mix(in srgb, var(--night) 60%, transparent); color: var(--ink); }
.pill svg { width: 18px; height: 18px; }
.pill.who { cursor: default; color: var(--gold); border-color: var(--gold); font-weight: 700; }
.pill[aria-pressed="false"] { opacity: .6; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Boutons et parchemins */
.btn { cursor: pointer; border-radius: 999px; padding: 10px 20px; font-weight: 700; border: 2px solid var(--gold);
  background: linear-gradient(180deg, #ffe17e, var(--gold)); color: var(--brown); box-shadow: 0 4px 0 var(--gold-deep); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-deep); }
.btn.ghost { background: transparent; color: var(--gold); box-shadow: none; }
.btn.small { padding: 6px 14px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 20px; height: 20px; vertical-align: -4px; }
.parch { background: var(--parchment); color: var(--brown); border-radius: 18px; border: 2px solid var(--parchment-edge); padding: 14px 16px; min-width: 0; }
.panel { display: grid; gap: 14px; }
.h-title { font-size: clamp(30px, 7vw, 46px); color: var(--gold); text-align: center; text-shadow: 0 2px 18px color-mix(in srgb, var(--gold) 40%, transparent); }
.sub { color: var(--muted); text-align: center; }
.note { font-size: 14px; color: var(--muted); }
.parch .note { color: var(--brown-soft); }

/* Formulaires */
.form { display: grid; gap: 12px; }
.form label { font-size: 15px; font-weight: 700; color: var(--brown-soft); display: grid; gap: 4px; }
.form input, .form select, .form textarea { width: 100%; padding: 9px 14px; border-radius: 14px; border: 2px solid var(--parchment-edge); background: #fffdf6; color: var(--brown); }
.form textarea { min-height: 160px; resize: vertical; line-height: 1.4; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > label { flex: 1 1 180px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; flex-direction: row; align-items: center; gap: 6px; font-weight: 400; color: var(--brown); padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--parchment-edge); background: #fffdf6; }

/* Profils */
.profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.profile { display: grid; justify-items: center; gap: 6px; padding: 14px; border-radius: 20px; cursor: pointer; text-align: center;
  background: var(--parchment); color: var(--brown); border: 2px solid var(--parchment-edge); }
.profile .lumi { width: 76px; }
.profile b { font-family: var(--font-tale); font-size: 22px; font-weight: 400; }
.profile small { color: var(--brown-soft); }
.profile.add { background: transparent; color: var(--gold); border: 2px dashed var(--gold); align-content: center; min-height: 170px; }

/* Carte de l'enfant */
.welcome { display: flex; gap: 12px; align-items: flex-end; }
.welcome .lumi { width: 86px; flex: none; }
.welcome .parch { border-radius: 18px 18px 18px 4px; flex: 1; font-size: 18px; display: grid; gap: 8px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tab { padding: 8px 18px; border-radius: 999px; cursor: pointer; border: 2px solid color-mix(in srgb, var(--gold) 55%, transparent); background: transparent; color: var(--ink); font-weight: 700; }
.tab[aria-selected="true"] { background: var(--gold); color: var(--brown); }
.subject { display: grid; gap: 10px; }
.subject h3 { font-size: 26px; color: var(--gold); display: flex; align-items: center; gap: 10px; }
.trail { display: flex; gap: 12px; overflow-x: auto; padding: 6px 4px 12px; scroll-snap-type: x proximity; }
.lesson { flex: 0 0 210px; scroll-snap-align: start; display: grid; gap: 6px; padding: 12px 14px; border-radius: 18px; cursor: pointer; text-align: left;
  background: var(--parchment); color: var(--brown); border: 2px solid var(--parchment-edge); position: relative; }
.lesson .lv { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--brown-soft); }
.lesson .t { font-weight: 700; font-size: 17px; line-height: 1.25; }
.lesson .st { font-size: 14px; color: var(--brown-soft); }
.lesson .stars { display: flex; gap: 2px; }
.lesson .stars svg { width: 18px; height: 18px; fill: rgba(61,43,28,.18); }
.lesson .stars svg.on { fill: var(--gold-deep); }
.lesson.next { box-shadow: 0 0 0 3px var(--gold), 0 0 24px color-mix(in srgb, var(--gold) 45%, transparent); }
.lesson[disabled] { opacity: .5; cursor: not-allowed; filter: grayscale(.4); }
.lesson .mine { position: absolute; top: 8px; right: 10px; font-size: 11px; font-weight: 700; color: var(--d); text-transform: uppercase; letter-spacing: .06em; }
.grid-lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.grid-lessons .lesson { flex: none; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* Écran de leçon */
.scene { display: grid; gap: 14px; border-radius: 22px; padding: 16px; border: 2px solid color-mix(in srgb, var(--gold) 40%, transparent); background: var(--scene-bg, var(--night-2)); }
.scene-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.scene-head h2 { font-size: clamp(24px, 5vw, 32px); color: var(--gold); }
.scene-head .lv { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.dialog { display: flex; gap: 10px; align-items: flex-end; }
.dialog .lumi { width: 72px; flex: none; }
.speech { flex: 1; border-radius: 18px 18px 18px 4px; display: grid; gap: 8px; font-size: 19px; }
.speech .txt b { color: var(--d); }
.speech .acts { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.listen { border: 0; background: none; color: var(--brown-soft); cursor: pointer; display: inline-flex; gap: 4px; align-items: center; font-size: 14px; }
.listen svg { width: 20px; height: 20px; }
.arena { display: grid; gap: 14px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.12); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.board { min-width: 0; display: grid; justify-items: center; gap: 10px; }
.side { display: grid; justify-items: center; gap: 8px; }
@media (max-width: 620px) { .stage { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } .side .vessel { display: none; } .house { min-height: 120px; } .house .in span { font-size: 13px; padding: 2px 7px; } }
.play { border-top: 2px dashed rgba(247, 204, 79, .35); padding-top: 14px; min-height: 90px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
.play:empty { display: none; }
.lumi { overflow: visible; animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.lumi .m-think, .lumi .m-cheer { display: none; }
.lumi.think .m-happy, .lumi.cheer .m-happy { display: none; }
.lumi.think .m-think, .lumi.cheer .m-cheer { display: inline; }
.lumi.think { animation: tilt 1.2s ease-in-out; } .lumi.cheer { animation: hop .5s ease-in-out 3; }
@keyframes tilt { 30% { transform: rotate(-8deg); } 70% { transform: rotate(6deg); } }
@keyframes hop { 50% { transform: translateY(-16px); } }

/* Contenus du plateau */
.card { background: var(--parchment); color: var(--brown); border-radius: 16px; padding: 14px 18px; font-size: 20px; max-width: 100%; border: 2px solid var(--parchment-edge); }
.card.big { font-size: 26px; text-align: center; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { background: var(--parchment); color: var(--brown); border-radius: 999px; padding: 6px 14px; font-size: 18px; font-weight: 700; border: 2px solid var(--parchment-edge); }
.text-gaps { line-height: 2.1; }
.gap { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--brown-soft); text-align: center; padding: 0 6px; font-weight: 700; color: var(--d); }
.gap.now { border-color: var(--gold-deep); background: color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 6px 6px 0 0; }
.verses { display: grid; gap: 4px; font-size: 20px; }
.verses .v { padding: 2px 10px; border-radius: 8px; transition: background .3s; }
.verses .v.now { background: color-mix(in srgb, var(--gold) 40%, transparent); }
.slots-list { display: grid; gap: 8px; width: min(100%, 520px); counter-reset: s; }
.slots-list .s { min-height: 44px; border-radius: 12px; border: 2px dashed var(--brown-soft); background: rgba(255,255,255,.5); padding: 8px 12px 8px 40px; position: relative; color: var(--brown); font-size: 18px; }
.slots-list .s::before { counter-increment: s; content: counter(s); position: absolute; left: 12px; top: 8px; font-weight: 700; color: var(--brown-soft); }
.slots-list .s.filled { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.conj { display: grid; grid-template-columns: auto auto; gap: 8px 14px; font-size: 22px; align-items: center; }
.conj .p { text-align: right; color: var(--brown-soft); }
.conj .f { min-width: 120px; border-bottom: 3px solid var(--brown-soft); font-weight: 700; color: var(--d); padding: 0 6px; }
.conj .f.now { border-color: var(--gold-deep); background: color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 6px 6px 0 0; }
.word-slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.word-slots .l { width: 42px; height: 52px; border-radius: 10px; display: grid; place-items: center; font-size: 30px; font-weight: 700; background: #fffdf6; color: var(--brown); border: 2px solid var(--parchment-edge); }
.word-slots .l.space { width: 18px; background: transparent; border: 0; }
.word-slots .l.fixed { background: transparent; border: 0; }
.word-slots .l.bad { background: var(--ko-soft); border-color: var(--ko); }
.word-slots .l.good { background: var(--ok-soft); border-color: var(--ok); }
.hear { display: inline-flex; gap: 8px; align-items: center; }
.houses { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; width: 100%; max-width: 640px; }
.house { display: grid; grid-template-rows: 36px auto 1fr; border-radius: 6px 6px 12px 12px; min-height: 150px; }
.house .roof { clip-path: polygon(50% 0, 100% 100%, 0 100%); margin-inline: -8px; }
.house .name { text-align: center; font-weight: 700; padding: 6px; color: var(--brown); }
.house .in { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; justify-content: center; padding: 8px; }
.house .in span { background: #fff; color: var(--brown); border-radius: 999px; padding: 3px 10px; font-size: 15px; animation: dgin .4s both; }
.house.drop { outline: 3px dashed var(--brown-soft); outline-offset: -3px; cursor: pointer; }
.house.drop.hover { outline: 3px solid var(--gold); }

/* Éléments à manipuler */
.tray { display: grid; gap: 8px; justify-items: center; }
.tray-label { color: var(--muted); font-size: 15px; }
.tray-label b { color: var(--gold); font-size: 22px; }
.stones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.stone { min-width: 62px; height: 62px; padding: 0 16px; border-radius: 999px; cursor: grab; touch-action: none; user-select: none;
  border: 3px solid #fff7d0; color: var(--brown); font-size: 28px; font-weight: 700;
  background: radial-gradient(circle at 35% 30%, #fffbe6, var(--gold) 60%, var(--gold-deep)); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.stone.tag { font-size: 18px; height: 50px; }
.stone.held { box-shadow: 0 0 0 4px var(--ink), 0 0 26px var(--gold); transform: scale(1.06); }
.stone.lifted { opacity: .3; }
.stone.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%) scale(1.1); margin: 0; }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.bubble { min-width: 78px; height: 78px; padding: 0 18px; border-radius: 999px; cursor: pointer; font-size: 26px; font-weight: 700; color: var(--brown);
  border: 2px solid rgba(255,255,255,.8); background: radial-gradient(circle at 32% 28%, #fff 0 12%, #e9f6ff 30%, #b9d9ff 70%, #8fb8f3);
  box-shadow: inset -6px -8px 14px rgba(42, 99, 212, .25), 0 8px 18px rgba(0,0,0,.3); animation: bob 2.4s ease-in-out infinite; }
.bubble.long { font-size: 19px; height: auto; min-height: 64px; padding: 10px 20px; }
.bubble:nth-child(2) { animation-delay: .4s; } .bubble:nth-child(3) { animation-delay: .8s; } .bubble:nth-child(4) { animation-delay: 1.2s; }
.bubble.wrong { animation: shake .45s; opacity: .35; cursor: default; }
.bubble.popped { animation: popout .4s forwards; }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes popout { 40% { transform: scale(1.25); } to { transform: scale(0); opacity: 0; } }
.letters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; }
.letter { width: 52px; height: 56px; border-radius: 12px; cursor: pointer; font-size: 28px; font-weight: 700; color: var(--brown); border: 2px solid #fff;
  background: linear-gradient(160deg, #f0e6ff, #c9b3ff 60%, #a58bf0); box-shadow: 0 4px 0 #6e55c4; }
.letter:disabled { opacity: .25; cursor: default; }
.keypad { display: grid; gap: 10px; justify-items: center; }
.kp-display { min-width: 120px; padding: 6px 18px; border-radius: 14px; background: var(--parchment); color: var(--brown); font-size: 34px; font-weight: 700; text-align: center; min-height: 58px; }
.kp-keys { display: grid; grid-template-columns: repeat(6, 50px); gap: 8px; }
@media (max-width: 420px) { .kp-keys { grid-template-columns: repeat(4, 54px); } }
.crystal { height: 50px; border-radius: 12px; cursor: pointer; font-size: 24px; font-weight: 700; color: var(--brown); border: 2px solid #fff;
  background: linear-gradient(160deg, #f0e6ff, #c9b3ff 60%, #a58bf0); box-shadow: 0 4px 0 #6e55c4; }
.crystal.ok { background: linear-gradient(160deg, #fff4c4, var(--gold)); box-shadow: 0 4px 0 var(--gold-deep); grid-column: span 2; font-size: 17px; }
.crystal.del { font-size: 15px; }

/* Les maisons de l'addition */
.towers { --cw: 60px; display: grid; grid-template-columns: 34px repeat(var(--n), var(--cw)); column-gap: 8px;
  grid-template-rows: 44px 26px 40px repeat(var(--ops), var(--cw)) var(--cw); font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .towers { --cw: 54px; column-gap: 5px; } .towers .lbl { font-size: 10.5px; } }
.towers .body { border-radius: 6px 6px 0 0; transition: box-shadow .3s, filter .3s; }
.towers .body.c { background: color-mix(in srgb, var(--c-sky) 85%, white); }
.towers .body.d { background: color-mix(in srgb, var(--d-sky) 85%, white); }
.towers .body.u { background: color-mix(in srgb, var(--u-sky) 85%, white); }
.towers .roof { align-self: end; height: 44px; clip-path: polygon(50% 0, 100% 100%, 0 100%); margin-inline: -6px; }
.roof.c { background: var(--c); } .roof.d { background: var(--d); } .roof.u { background: var(--u); }
.towers .lbl { z-index: 1; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--brown); }
.towers .body.glow { box-shadow: 0 0 0 4px var(--gold), 0 0 28px var(--gold); }
.towers.dim .body:not(.glow) { filter: saturate(.45) brightness(.8); }
.slot { z-index: 1; margin: 5px; border-radius: 999px 999px 8px 8px; display: grid; place-items: center; background: rgba(61,43,28,.14); color: var(--brown); font-size: calc(var(--cw) * .58); font-weight: 700; }
.slot.carry { margin: 4px 12px; border-radius: 50%; font-size: 20px; color: var(--d); background: rgba(255,255,255,.55); border: 2px dashed var(--d); }
.slot.carry.filled { background: #fff; border-style: solid; box-shadow: 0 0 12px var(--gold); }
.slot.res { background: rgba(255,255,255,.55); }
.slot.drop { background: rgba(255,255,255,.8); outline: 3px dashed var(--brown-soft); outline-offset: -3px; cursor: pointer; }
.slot.drop.hover { outline: 3px solid var(--gold); background: #fffbe6; }
.slot .dg, .dg { animation: dgin .45s cubic-bezier(.3,1.6,.5,1) both; display: inline-block; }
@keyframes dgin { from { transform: scale(.2) rotate(-20deg); opacity: 0; } }
.towers .plus { z-index: 1; display: grid; place-items: center; font-size: 34px; font-weight: 700; }
.towers .goldline { z-index: 2; border-top: 5px solid var(--gold); align-self: start; box-shadow: 0 0 12px var(--gold); border-radius: 3px; }

/* Décor : le récipient se remplit au fil des réussites */
.vessel { width: 150px; }
.vessel .liquid { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); transition: transform .8s ease; }
.progress-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 160px; }
.progress-dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.18); }
.progress-dots i.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.flyer { position: fixed; z-index: 60; width: 44px; height: 44px; margin: -22px 0 0 -22px; display: grid; place-items: center; pointer-events: none;
  transition: transform .7s cubic-bezier(.5,-0.3,.4,1.3); font-size: 26px; font-weight: 700; color: var(--d); }
.spark { position: fixed; pointer-events: none; z-index: 70; width: 16px; height: 16px; background: var(--gold);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: burst .9s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(160deg) scale(.3); opacity: 0; } }
.medal { display: grid; justify-items: center; gap: 10px; text-align: center; }
.medal .big-stars { display: flex; gap: 8px; }
.medal .big-stars svg { width: 58px; height: 58px; fill: rgba(255,255,255,.15); }
.medal .big-stars svg.on { fill: var(--gold); filter: drop-shadow(0 0 12px var(--gold)); animation: hop .6s ease-in-out 2; }
.toast { position: fixed; z-index: 80; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 520px);
  background: var(--parchment); color: var(--brown); border: 2px solid var(--gold); border-radius: 14px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }

/* Espace adulte */
.adult { display: grid; gap: 14px; }
.adult .parch { display: grid; gap: 12px; }
.adult h2 { color: var(--gold); font-size: 30px; }
.adult h3 { font-size: 22px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
