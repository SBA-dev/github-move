<svg xmlns="http://www.w3.org/2000/svg" width="120" height="110" viewBox="0 0 120 110">
<defs><linearGradient id="w-police" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6F8BE6"/><stop offset="1" stop-color="#5470DA"/></linearGradient></defs>
<!-- roues (dans les coins du bas) -->
<circle cx="20" cy="98" r="11" fill="#3A2F45" stroke="#F4EFE6" stroke-width="2.5"/><circle cx="20" cy="98" r="4.4" fill="#D9DDEA"/><circle cx="100" cy="98" r="11" fill="#3A2F45" stroke="#F4EFE6" stroke-width="2.5"/><circle cx="100" cy="98" r="4.4" fill="#D9DDEA"/>
<!-- corps : dégradé vertical, identique sur toute la largeur -->
<rect x="4" y="20" width="112" height="66" rx="8" fill="url(#w-police)" stroke="#1F2F82" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<!-- châssis et attelages -->
<rect x="4" y="86" width="112" height="6" fill="#F3F6FF" stroke="#1F2F82" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="0" y="87.5" width="6" height="4" rx="2" fill="#1F2F82"/><rect x="114" y="87.5" width="6" height="4" rx="2" fill="#1F2F82"/>
<!-- toit -->
<rect x="2" y="12" width="116" height="10" rx="5" fill="#2B43A8" stroke="#1F2F82" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<!-- liseré blanc sur le toit, aux deux bouts ; ni lampe ni gyrophare -->
<path d="M8 17 H32 M88 17 H112" fill="none" stroke="#F3F6FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<!-- plaque claire : le texte de l'étiquette (HTML) se pose dessus ; elle déborde de 4 px sur les bords de la case centrale -->
<rect x="30" y="24" width="60" height="60" rx="4" fill="#F3F6FF" stroke="#1F2F82" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
