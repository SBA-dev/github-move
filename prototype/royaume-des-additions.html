<title>Le Royaume d'Additia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Berkshire+Swash&display=swap">
<style>
/* Layout : une application de conte, dans l'univers choisi par l'enfant. Carte -> scènes.
   Chaque scène = consigne du guide, puis un cadre qui réunit l'illustration (les colonnes de l'addition
   + le décor) et, juste en dessous, l'exercice à manipuler. */
:root {
  --night: #16123c;
  --night-2: #2c2468;
  --gold: #f7cc4f;
  --gold-deep: #c99a1c;
  --star: #fff6d6;
  --ink: #fbf6ea;
  --muted: #cfc8ef;
  --parchment: #fbf2dd;
  --parchment-edge: #e6d3a6;
  --brown: #3d2b1c;
  --brown-soft: #7a6347;
  --u: #2a63d4;  --u-sky: #9ccfff;
  --d: #c8245e;  --d-sky: #ffa5c2;
  --c: #1f8a4c;  --c-sky: #9de6b5;
  --ok: #1d7f52; --ko: #b34a0c;
  --font-tale: "Berkshire Swash", Georgia, serif;
  --font-body: "Andika", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body {
  background: radial-gradient(120% 70% at 50% 0%, var(--night-2), var(--night) 70%) fixed, var(--night);
  color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--star); opacity: .5; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .1; transform: scale(.6); } }

.app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px 48px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-tale); font-weight: 400; margin: 0; line-height: 1.12; text-wrap: balance; }
p { margin: 0; }

/* ---------- Barre du haut ---------- */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.brand { font-family: var(--font-tale); font-size: 24px; color: var(--gold); }
.tools { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  border: 1.5px solid color-mix(in srgb, var(--muted) 45%, transparent); background: color-mix(in srgb, var(--night) 60%, transparent); color: var(--ink); cursor: pointer; font-size: 15px; }
.pill svg { width: 18px; height: 18px; }
.pill.stars { cursor: default; color: var(--gold); border-color: var(--gold); font-weight: 700; }
.pill.stars svg { fill: var(--gold); }
.pill[aria-pressed="false"] { opacity: .6; }
.pill:focus-visible, .btn:focus-visible, .place:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- Boutons ---------- */
.btn { cursor: pointer; border-radius: 999px; padding: 10px 20px; font-weight: 700; border: 2px solid var(--gold);
  background: linear-gradient(180deg, #ffe17e, var(--gold)); color: var(--brown); box-shadow: 0 4px 0 var(--gold-deep); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-deep); }
.btn.ghost { background: transparent; color: var(--gold); box-shadow: none; }

/* ---------- Carte ---------- */
.welcome { display: flex; gap: 14px; align-items: flex-end; }
.welcome .lumi { width: 96px; }
.parch { background: var(--parchment); color: var(--brown); border-radius: 18px; border: 2px solid var(--parchment-edge); padding: 14px 16px; min-width: 0; }
.welcome .parch { border-radius: 18px 18px 18px 4px; flex: 1; display: grid; gap: 10px; font-size: 18px; }
.name-form { display: flex; gap: 8px; flex-wrap: wrap; }
.name-form input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 9px 14px; border-radius: 999px; border: 2px solid var(--parchment-edge); background: #fffdf6; color: var(--brown); }
.name-form input:focus-visible { outline: 3px solid var(--gold); }

.map-title { text-align: center; display: grid; gap: 4px; }
.map-title h1 { font-size: clamp(34px, 8vw, 52px); color: var(--gold); text-shadow: 0 2px 18px color-mix(in srgb, var(--gold) 40%, transparent); }
.map-title p { color: var(--muted); }
.trail { display: grid; gap: 0; position: relative; padding-block: 8px; }
.trail::before { content: ""; position: absolute; left: 50%; top: 40px; bottom: 40px; border-left: 4px dotted color-mix(in srgb, var(--gold) 55%, transparent); transform: translateX(-2px); }
.place { position: relative; display: flex; align-items: center; gap: 14px; width: min(100%, 420px); padding: 12px 16px 12px 12px; margin-block: 10px;
  border-radius: 999px; border: 2px solid var(--parchment-edge); background: var(--parchment); color: var(--brown); cursor: pointer; text-align: left; }
.place:nth-child(odd) { justify-self: start; } .place:nth-child(even) { justify-self: end; }
.place .emb { width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--night-2); }
.place .emb svg { width: 46px; height: 46px; }
.place .txt { display: grid; min-width: 0; }
.place .nm { font-family: var(--font-tale); font-size: 21px; }
.place .st { font-size: 14px; color: var(--brown-soft); }
.place.done { border-color: var(--gold); box-shadow: 0 0 22px color-mix(in srgb, var(--gold) 35%, transparent); }
.place.next { animation: beckon 1.6s ease-in-out infinite; }
.place[disabled] { opacity: .5; cursor: not-allowed; filter: grayscale(.5); }
.place .medal { position: absolute; right: -6px; top: -8px; width: 30px; height: 30px; fill: var(--gold); filter: drop-shadow(0 0 6px var(--gold)); }
@keyframes beckon { 50% { transform: scale(1.03); box-shadow: 0 0 26px color-mix(in srgb, var(--gold) 50%, transparent); } }
.crown-card { text-align: center; display: grid; gap: 8px; justify-items: center; padding: 22px; border-radius: 20px; border: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
.crown-card h2 { color: var(--gold); font-size: 30px; }
.foot { display: grid; gap: 10px; justify-items: center; color: var(--muted); font-size: 14px; }
.foot details { max-width: 640px; }
.foot summary { cursor: pointer; color: var(--gold); }
.foot blockquote { margin: 8px 0 0; display: grid; gap: 6px; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 14px; }

/* ---------- Scène ---------- */
.scene { display: grid; gap: 14px; border-radius: 22px; padding: 16px; border: 2px solid color-mix(in srgb, var(--gold) 40%, transparent);
  background: var(--scene-bg, var(--night-2)); }
.scene-garden { --scene-bg: linear-gradient(180deg, #1f3d4a, #17283f); }
.scene-bridge { --scene-bg: linear-gradient(180deg, #23336e, #182454); }
.scene-cauldron { --scene-bg: linear-gradient(180deg, #3b2263, #22174a); }
.scene-cave { --scene-bg: linear-gradient(180deg, #3d2a1f, #1d1630); }
.scene-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.scene-head h2 { font-size: clamp(24px, 5vw, 32px); color: var(--gold); }
.scene-head .lv { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.arena { display: grid; gap: 14px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.12); }
.stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; justify-items: center; }
@media (max-width: 620px) {
  .stage { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .stage .side { order: -1; }
  .side .cauldron { width: 130px; } .side .dragon { width: 190px; } .side .bridge { width: 220px; }
}
.play { border-top: 2px dashed rgba(247, 204, 79, .35); padding-top: 14px; }
.play:empty { display: none; }
.toast { position: fixed; z-index: 80; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 520px);
  background: var(--parchment); color: var(--brown); border: 2px solid var(--gold); border-radius: 14px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.side { min-width: 0; width: 100%; display: grid; justify-items: center; gap: 8px; }

/* ---------- Les tours (grille d'addition) ---------- */
.towers { --cw: 62px; display: grid; grid-template-columns: 34px repeat(var(--n), var(--cw)); column-gap: 8px;
  grid-template-rows: 46px 26px 40px repeat(var(--ops), var(--cw)) var(--cw); font-variant-numeric: tabular-nums; position: relative; }
@media (max-width: 480px) { .towers { --cw: 54px; column-gap: 5px; } .towers .lbl { font-size: 10.5px; letter-spacing: -.02em; } }
.towers .body { border-radius: 6px 6px 0 0; z-index: 0; transition: box-shadow .3s, filter .3s; }
.towers .body.c { background: color-mix(in srgb, var(--c-sky) 85%, white); }
.towers .body.d { background: color-mix(in srgb, var(--d-sky) 85%, white); }
.towers .body.u { background: color-mix(in srgb, var(--u-sky) 85%, white); }
.towers .roof { align-self: end; height: 46px; clip-path: polygon(50% 0, 100% 100%, 0 100%); margin-inline: -6px; }
.towers .roof.c { background: var(--c); } .towers .roof.d { background: var(--d); } .towers .roof.u { background: var(--u); }
.towers .lbl { z-index: 1; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--brown); letter-spacing: .02em; }
.towers .body.glow { box-shadow: 0 0 0 4px var(--gold), 0 0 28px var(--gold); }
.towers.dim .body:not(.glow) { filter: saturate(.45) brightness(.8); }
.slot { z-index: 1; margin: 5px; border-radius: 999px 999px 8px 8px; display: grid; place-items: center;
  background: rgba(61, 43, 28, .14); color: var(--brown); font-size: calc(var(--cw) * .58); font-weight: 700; position: relative; }
.slot.carry { margin: 4px 12px; border-radius: 50%; font-size: 20px; color: var(--d); background: rgba(255,255,255,.55); border: 2px dashed var(--d); }
.slot.carry.filled { background: #fff; border-style: solid; box-shadow: 0 0 12px var(--gold); }
.slot.res { background: rgba(255,255,255,.55); }
.slot.drop { background: rgba(255,255,255,.75); outline: 3px dashed var(--brown-soft); outline-offset: -3px; cursor: pointer; animation: slotpulse 1.4s ease-in-out infinite; }
.slot.drop.hover, .slot.drop:focus-visible { outline: 3px solid var(--gold); background: #fffbe6; }
@keyframes slotpulse { 50% { background: rgba(255,255,255,.95); } }
.slot .dg { animation: dgin .45s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes dgin { from { transform: scale(.2) rotate(-20deg); opacity: 0; } }
.towers .plus { z-index: 1; display: grid; place-items: center; font-size: 34px; font-weight: 700; color: var(--ink); }
.towers .goldline { z-index: 2; border-top: 5px solid var(--gold); align-self: start; box-shadow: 0 0 12px var(--gold); border-radius: 3px; }

/* ---------- Dialogue de Lumi ---------- */
.dialog { display: flex; gap: 10px; align-items: flex-end; }
.lumi { width: 74px; flex: none; animation: float 4s ease-in-out infinite; overflow: visible; }
@keyframes float { 50% { transform: translateY(-6px); } }
.lumi .m-think, .lumi .m-cheer { display: none; }
.lumi.think .m-happy, .lumi.cheer .m-happy { display: none; }
.lumi.think .m-think { display: inline; } .lumi.cheer .m-cheer { display: inline; }
.lumi.think { animation: tilt 1.2s ease-in-out; }
.lumi.cheer { animation: hop .5s ease-in-out 3; }
@keyframes tilt { 30% { transform: rotate(-8deg); } 70% { transform: rotate(6deg); } }
@keyframes hop { 50% { transform: translateY(-16px); } }
.speech { flex: 1; min-width: 0; border-radius: 18px 18px 18px 4px; display: grid; gap: 8px; font-size: 19px; }
.speech .txt b { color: var(--d); }
.speech .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.listen { border: 0; background: none; color: var(--brown-soft); cursor: pointer; display: inline-flex; gap: 4px; align-items: center; font-size: 14px; }
.listen svg { width: 20px; height: 20px; }

/* ---------- Zone de jeu ---------- */
.play { min-height: 96px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; }
.tray { display: grid; gap: 8px; justify-items: center; }
.tray-label { color: var(--muted); font-size: 15px; }
.tray-label b { color: var(--gold); font-size: 22px; }
.stones { display: flex; gap: 14px; }
.stone { width: 62px; height: 62px; border-radius: 50%; cursor: grab; touch-action: none; user-select: none;
  border: 3px solid #fff7d0; color: var(--brown); font-size: 32px; font-weight: 700;
  background: radial-gradient(circle at 35% 30%, #fffbe6, var(--gold) 60%, var(--gold-deep)); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.stone.held { box-shadow: 0 0 0 4px var(--ink), 0 0 26px var(--gold); transform: scale(1.08); }
.stone.lifted { opacity: .3; }
.stone.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%) scale(1.12); margin: 0; }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

.bubble { width: 78px; height: 78px; border-radius: 50%; cursor: pointer; font-size: 30px; font-weight: 700; color: var(--brown);
  border: 2px solid rgba(255,255,255,.8); background: radial-gradient(circle at 32% 28%, #fff 0 12%, #e9f6ff 30%, #b9d9ff 70%, #8fb8f3);
  box-shadow: inset -6px -8px 14px rgba(42, 99, 212, .25), 0 8px 18px rgba(0,0,0,.3); animation: bob 2.4s ease-in-out infinite; }
.bubble:nth-child(2) { animation-delay: .4s; } .bubble:nth-child(3) { animation-delay: .8s; } .bubble:nth-child(4) { animation-delay: 1.2s; }
.bubble.wrong { animation: shake .45s; opacity: .35; cursor: default; }
.bubble.popped { animation: popout .4s forwards; }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes popout { 40% { transform: scale(1.3); } to { transform: scale(0); opacity: 0; } }

.keypad { display: grid; gap: 10px; justify-items: center; }
.kp-display { min-width: 120px; padding: 6px 18px; border-radius: 14px; background: var(--parchment); color: var(--brown); font-size: 34px; font-weight: 700; text-align: center; min-height: 58px; font-variant-numeric: tabular-nums; }
.kp-keys { display: grid; grid-template-columns: repeat(6, 50px); gap: 8px; }
@media (max-width: 420px) { .kp-keys { grid-template-columns: repeat(4, 54px); } }
.crystal { height: 50px; border-radius: 12px; cursor: pointer; font-size: 24px; font-weight: 700; color: var(--brown); border: 2px solid #fff;
  background: linear-gradient(160deg, #f0e6ff, #c9b3ff 60%, #a58bf0); box-shadow: 0 4px 0 #6e55c4; }
.crystal:active { transform: translateY(2px); box-shadow: 0 2px 0 #6e55c4; }
.crystal.ok { background: linear-gradient(160deg, #fff4c4, var(--gold)); box-shadow: 0 4px 0 var(--gold-deep); grid-column: span 2; font-size: 17px; }
.crystal.del { font-size: 17px; }
.crystal:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Perles, colliers, couronnes */
.field { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 330px; }
.pearl-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: none; padding: 0; cursor: pointer; position: relative; display: grid; place-items: center; }
.pearl-btn:focus-visible { outline: 3px solid var(--gold); }
.pearl { display: block; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 16%, var(--u-sky) 42%, var(--u) 100%); box-shadow: 0 3px 6px rgba(0,0,0,.3); transition: transform .2s; }
.pearl-btn.b .pearl { background: radial-gradient(circle at 35% 30%, #fff 0 16%, #c7e3ff 42%, #4d82e6 100%); }
.pearl-btn.counted .pearl { transform: scale(.8); box-shadow: 0 0 0 3px var(--gold), 0 0 14px var(--gold); }
.pearl-btn .n { position: absolute; top: -8px; right: -6px; font-size: 13px; font-weight: 700; color: var(--brown); background: var(--gold); border-radius: 999px; padding: 0 5px; }
.thread { min-height: 46px; min-width: 260px; max-width: 100%; border-radius: 999px; border: 2px dashed var(--gold); display: flex; align-items: center; justify-content: center; gap: 2px; padding: 6px 12px; color: var(--muted); font-size: 14px; }
.thread .pearl { width: 20px; height: 20px; }
.necklace-btn { border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 16px; }
.necklace-btn:focus-visible { outline: 3px solid var(--gold); }
.necklace { display: block; width: 16px; height: 92px; border-radius: 8px;
  background: radial-gradient(circle at 50% 50%, #fff 0 15%, var(--d-sky) 38%, var(--d) 70%, transparent 72%) 0 0 / 16px 9.2px repeat-y; }
.necklace.h { width: 160px; height: 18px; background-size: 16px 18px; background-repeat: repeat-x; }
.beckon { animation: beckonb 1s ease-in-out infinite; filter: drop-shadow(0 0 10px var(--gold)); }
@keyframes beckonb { 50% { transform: scale(1.12); } }
.piles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 360px; }
.pile { background: rgba(255,255,255,.08); border-radius: 14px; padding: 8px; display: grid; gap: 6px; justify-items: center; }
.pile b { color: var(--gold); font-size: 22px; }
.pile .row { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
.pile .necklace { width: 10px; height: 58px; background-size: 10px 5.8px; }
.pile .pearl { width: 14px; height: 14px; }
.pile small { color: var(--muted); }

.flyer { position: fixed; z-index: 60; width: 44px; height: 44px; margin: -22px 0 0 -22px; display: grid; place-items: center; pointer-events: none;
  transition: transform .7s cubic-bezier(.5,-0.3,.4,1.3); font-size: 26px; font-weight: 700; color: var(--d); }
.flyer .necklace { width: 10px; height: 44px; background-size: 10px 4.4px; filter: drop-shadow(0 0 8px var(--gold)); }
.spark { position: fixed; pointer-events: none; z-index: 70; width: 16px; height: 16px; background: var(--gold);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: burst .9s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(160deg) scale(.3); opacity: 0; } }

/* Décors magiques */
.cauldron { width: 200px; max-width: 100%; cursor: default; }
.cauldron.beckon { cursor: pointer; }
.cauldron .liquid { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); transition: transform .8s ease, fill .5s; }
.cauldron .fumes circle { animation: rise 2.4s ease-in infinite; opacity: 0; }
.cauldron.boil .fumes circle { opacity: 1; }
.cauldron .fumes circle:nth-child(2) { animation-delay: .8s; } .cauldron .fumes circle:nth-child(3) { animation-delay: 1.6s; }
@keyframes rise { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-60px); opacity: 0; } }
.shelf { display: flex; gap: 14px; }
.shelf svg { width: 34px; height: 48px; }
.shelf .fill { fill: rgba(255,255,255,.12); transition: fill .6s; }
.bridge { width: 280px; max-width: 100%; }
.bridge .arch { stroke: #5b6aa8; transition: stroke .6s, filter .6s; }
.bridge .arch.lit { stroke: var(--gold); filter: drop-shadow(0 0 8px var(--gold)); }
.dragon { width: 260px; max-width: 100%; }
.dragon .eye-open { display: none; } .dragon.awake .eye-open { display: inline; } .dragon.awake .eye-closed { display: none; }
.dragon .zz { animation: zz 2s ease-in-out infinite; } .dragon.awake .zz { display: none; }
@keyframes zz { 50% { transform: translate(6px, -6px); opacity: .4; } }
.dragon .lid { transform-box: fill-box; transform-origin: 0% 100%; transition: transform .8s cubic-bezier(.3,1.5,.5,1); }
.dragon.open .lid { transform: rotate(-35deg); }
.dragon .coins { opacity: 0; transition: opacity .6s; } .dragon.open .coins { opacity: 1; }
.medal { display: grid; justify-items: center; gap: 10px; text-align: center; }
.medal svg { width: 74px; height: 74px; fill: var(--gold); filter: drop-shadow(0 0 16px var(--gold)); animation: hop .6s ease-in-out 2; }
.medal .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

@media (prefers-reduced-motion: reduce) {
  .sky i, .lumi, .bubble, .place.next, .slot.drop, .beckon, .cauldron .fumes circle, .dragon .zz, .medal svg { animation: none !important; }
  .spark { display: none; }
  .flyer { transition: none; }
}
</style>

<style>
/* Compléments : univers au choix, illustrations génériques pilotées par l'univers. */
.welcome .lumi { width: 96px; }
.setup { display: grid; gap: 10px; }
.setup label { font-size: 15px; font-weight: 700; color: var(--brown-soft); }
.setup select, .setup input { width: 100%; font: inherit; padding: 9px 14px; border-radius: 14px; border: 2px solid var(--parchment-edge); background: #fffdf6; color: var(--brown); }
.setup select:focus-visible, .setup input:focus-visible { outline: 3px solid var(--gold); }
.setup .field-row { display: grid; gap: 4px; }
.lights { width: 280px; max-width: 100%; }
.lights .light { transition: fill .6s, stroke .6s, filter .6s; }
.lights .light.lit { filter: drop-shadow(0 0 8px var(--gold)); }

  if (!state.sound) return;
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + t;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + .05);
}
const sfx = {
  ok() { [784, 988, 1319].forEach((f, i) => tone(f, i * .08, .35)); },
  no() { tone(240, 0, .25, 'triangle', .1); tone(190, .12, .3, 'triangle', .1); },
  pop() { tone(1046, 0, .12, 'sine', .08); },
  count(i) { tone(392 * Math.pow(2, i / 12), 0, .25, 'sine', .1); },
  magic() { [523, 659, 784, 1046, 1319, 1568].forEach((f, i) => tone(f, i * .06, .4, 'sine', .07)); },
  star() { [523, 659, 784, 1046, 784, 1046, 1319].forEach((f, i) => tone(f, i * .1, .45, 'triangle', .09)); },
};
let frVoice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); frVoice = vs.find(v => /^fr(-|_)FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
const toSpeech = html => html.replace(/<[^>]+>/g, '').replace(/\+/g, ' plus ').replace(/=/g, ' égale ').replace(/\s+/g, ' ').trim();
/* Lecture phrase par phrase : certains navigateurs coupent les textes longs. */
let speakTimer = null, voiceWarned = false;
function speak(html) {
  if (!state.sound || !('speechSynthesis' in window)) return;
  clearTimeout(speakTimer);
  try { speechSynthesis.cancel(); } catch (e) {}
  const parts = toSpeech(html).split(/(?<=[.!?…:])\s+/).filter(Boolean);
  speakTimer = setTimeout(() => {
    try {
      if (!frVoice) pickVoice();
      parts.forEach(t => {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'fr-FR'; if (frVoice) u.voice = frVoice; u.rate = .95; u.pitch = 1.15; u.volume = 1;
        u.onerror = e => {
          if (!voiceWarned && e.error && e.error !== 'interrupted' && e.error !== 'canceled') {
            voiceWarned = true;
            toast(`La voix de ${W.guide.name} est bloquée par ce navigateur. Touche « Réécouter » pour réessayer, ou lis les bulles avec un adulte.`);
          }
        };
        speechSynthesis.speak(u);
      });
      speechSynthesis.resume();
    } catch (e) {}
  }, 60);
}
function hush() { clearTimeout(speakTimer); try { speechSynthesis.cancel(); } catch (e) {} }
function toast(msg) { const t = el('div', 'toast', msg); t.setAttribute('role', 'status'); document.body.append(t); setTimeout(() => t.remove(), 6000); }
function testSound() {
  unlocked = false; unlockAudio(); sfx.magic();
  if (!('speechSynthesis' in window)) { toast(`Les sons marchent, mais ce navigateur ne sait pas faire parler ${W.guide.name}. Lis les bulles avec un adulte.`); return; }
  speak(`Bonjour${state.name ? ' ' + state.name : ''} ! Je suis ${W.guide.name}. Tu m'entends bien ?`);
}

/* ================= Effets ================= */
function sparkle(target, n = 16) {
  if (REDUCED || !target) return;
  const r = target.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const s = el('i', 'spark');
    const a = (i / n) * Math.PI * 2, d = 50 + Math.random() * 80;
    s.style.left = r.left + r.width / 2 + 'px'; s.style.top = r.top + r.height / 2 + 'px';
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.append(s); setTimeout(() => s.remove(), 1000);
  }
}

/* ================= Moteur de scène =================
   Chaque scène est une suite d'étapes asynchrones. Quitter la scène incrémente `run` :
   les promesses de l'ancienne scène ne se résolvent plus, et son script s'arrête. */
let run = 0;
const gated = p => { const t = run; return p.then(v => (t === run ? v : new Promise(() => {}))); };
const wait = ms => gated(new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 200) : ms)));
let S = null;

function say(html, mood = 'happy') {
  if (!S) return;
  S.txt.innerHTML = html;
  S.lumi.classList.remove('think', 'cheer');
  try { void S.lumi.getBBox(); } catch (e) {}
  if (mood !== 'happy') S.lumi.classList.add(mood);
  speak(html);
}
function cont(label = 'Continuer') {
  return gated(new Promise(res => {
    const b = el('button', 'btn', label); b.type = 'button';
    S.row.append(b); b.focus({ preventScroll: true });
    b.onclick = () => { b.remove(); sfx.pop(); res(); };
  }));
}
function tapItem(item) {
  return gated(new Promise(res => {
    item.classList.add('beckon');
    if (item.tabIndex < 0) item.tabIndex = 0;
    item.focus({ preventScroll: true });
    const go = () => { item.classList.remove('beckon'); item.onclick = null; item.onkeydown = null; sfx.pop(); res(); };
    item.onclick = go;
    item.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  }));
}
function fly(fromEl, toEl, html) {
  return gated(new Promise(res => {
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const f = el('div', 'flyer', html);

    f.style.left = ax + 'px'; f.style.top = ay + 'px';
    document.body.append(f);
    requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transform = `translate(${b.left + b.width / 2 - ax}px, ${b.top + b.height / 2 - ay}px)`; }));
    setTimeout(() => { f.remove(); res(); }, REDUCED ? 30 : 760);

}

/* ---------- Les colonnes : des tours ou des maisons qui portent l'addition ---------- */
function buildTowers(host, ncols, nOps) {
  host.innerHTML = '';
  host.className = 'towers';
  host.style.setProperty('--n', ncols); host.style.setProperty('--ops', nOps);
  const ranks = RANKS.slice(3 - ncols);
  const resRow = 4 + nOps;
  const T = { ranks, bodies: [], carry: [], ops: [...Array(nOps)].map(() => []), res: [], host };
  const put = (e, col, row, rowEnd) => { e.style.gridColumn = col; e.style.gridRow = rowEnd ? `${row} / ${rowEnd}` : row; host.append(e); return e; };
  ranks.forEach((r, c) => {
    const col = c + 2;
    put(el('div', 'roof ' + r), col, 1);
    T.bodies[c] = put(el('div', 'body ' + r), col, 2, resRow + 1);
    put(el('div', 'lbl', RNC[r]), col, 2);
    if (c < ncols - 1) T.carry[c] = put(el('div', 'slot carry'), col, 3);
    for (let i = 0; i < nOps; i++) T.ops[i][c] = put(el('div', 'slot'), col, 4 + i);
    T.res[c] = put(el('div', 'slot res'), col, resRow);
  });
  put(el('div', 'plus', '+'), 1, 3 + nOps);
  const line = el('div', 'goldline'); line.style.gridColumn = '1 / -1'; line.style.gridRow = resRow; host.append(line);
  return T;
}
function setSlot(slot, d) { slot.innerHTML = `<span class="dg">${d}</span>`; slot.classList.add('filled'); }
function focusCol(T, c) { T.bodies.forEach((b, i) => b.classList.toggle('glow', i === c)); T.host.classList.toggle('dim', c != null); }
function fillNumber(T, row, n) { const ds = String(n).split(''), off = T.ranks.length - ds.length; ds.forEach((d, k) => setSlot(T.ops[row][off + k], d)); }
const colName = r => `la ${W.col} ${COLOR[r]} des ${RNC[r]}`;

/* ---------- Glisser (ou toucher) une pierre dans une fenêtre ---------- */
function dragify(st, onTap, onDrop) {
  st.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY; let ghost = null, hover = null;
    try { st.setPointerCapture(e.pointerId); } catch (_) {}
    const under = ev => { const t = document.elementFromPoint(ev.clientX, ev.clientY); return t && t.closest('.slot.drop'); };
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
        ghost = st.cloneNode(true); ghost.classList.remove('held'); ghost.classList.add('ghost'); document.body.append(ghost); st.classList.add('lifted');
      }
      if (ghost) {
        ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
        const t = under(ev); if (hover !== t) { hover && hover.classList.remove('hover'); hover = t; hover && hover.classList.add('hover'); }
      }
    };
    const up = ev => {
      st.removeEventListener('pointermove', move); st.removeEventListener('pointerup', up); st.removeEventListener('pointercancel', up);
      hover && hover.classList.remove('hover');
      if (ghost) { ghost.remove(); st.classList.remove('lifted'); const t = ev.type === 'pointerup' && under(ev); if (t) onDrop(t); }
      else if (ev.type === 'pointerup') onTap();
    };
    st.addEventListener('pointermove', move); st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
  });
  st.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(); } });
}

/* Poser un nombre : l'enfant range chaque chiffre dans la fenêtre de sa colonne. */
function placeDigits(T, row, n) {
  return gated(new Promise(res => {
    const digits = String(n).split(''), ncols = T.ranks.length, off = ncols - digits.length;
    S.play.innerHTML = '';
    const tray = el('div', 'tray', `<span class="tray-label">Range le nombre <b>${n}</b></span>`);
    const stones = el('div', 'stones'); tray.append(stones); S.play.append(tray);
    const slots = T.ops[row];
    let selected = null, left = digits.length;
    const select = st => { selected && selected.classList.remove('held'); selected = selected === st ? null : st; if (selected) { selected.classList.add('held'); sfx.pop(); } };
    slots.forEach((s, c) => {
      s.classList.add('drop'); s.tabIndex = 0; s.setAttribute('role', 'button');
      s.setAttribute('aria-label', `fenêtre de ${colName(T.ranks[c])}`);
      s.onclick = () => selected && tryPlace(selected, c);
      s.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && selected) { e.preventDefault(); tryPlace(selected, c); } };
    });
    digits.forEach(d => {
      const st = el('button', 'stone', d); st.type = 'button'; st.setAttribute('aria-label', 'pierre ' + d);
      stones.append(st);
      dragify(st, () => select(st), t => { const c = slots.indexOf(t); if (c >= 0) tryPlace(st, c); });
    });
    stones.firstChild.focus({ preventScroll: true });
    revealPlay();
    function tryPlace(st, c) {
      const d = st.textContent;
      if (!slots[c].classList.contains('filled') && digits[c - off] === d) {
        setSlot(slots[c], d); slots[c].classList.remove('drop'); st.remove(); selected = null; sfx.ok(); left--;
        if (!left) { cleanup(); res(); } else stones.firstChild.focus({ preventScroll: true });
        return;
      }
      sfx.no(); selected && selected.classList.remove('held'); selected = null;
      st.classList.add('shake'); setTimeout(() => st.classList.remove('shake'), 500);
      const want = T.ranks[digits.indexOf(d) + off];
      if (slots[c].classList.contains('filled')) say('Cette fenêtre est déjà occupée ! Chaque fenêtre ne garde qu\'un seul chiffre.', 'think');
      else if (digits.length === 1) say(`Le ${d} est tout seul : c'est un chiffre des unités ! Il va dans ${colName('u')}, tout à droite.`, 'think');
      else say(`Dans ${n}, le ${d} est le chiffre des ${RN[want]}. Il va dans ${colName(want)}.`, 'think');
    }
    function cleanup() {
      slots.forEach(s => { s.classList.remove('drop'); s.onclick = s.onkeydown = null; s.removeAttribute('tabindex'); s.removeAttribute('role'); s.removeAttribute('aria-label'); });
      S.play.innerHTML = '';
    }
  }));
}

/* Bulles-réponses : on éclate la bonne. */
function choose(values, correct, onWrong) {
  return gated(new Promise(res => {
    S.play.innerHTML = '';
    shuffle([...new Set(values)].filter(v => v >= 0)).forEach(v => {
      const b = el('button', 'bubble', String(v)); b.type = 'button'; b.dataset.v = v;
      b.onclick = () => {
        if (b.classList.contains('wrong')) return;
        if (v === correct) {
          b.classList.add('popped'); sfx.ok(); sparkle(b, 10);
          S.play.querySelectorAll('.bubble').forEach(x => x.onclick = null);
          setTimeout(() => { S.play.innerHTML = ''; res(v); }, REDUCED ? 50 : 420);
        } else { b.classList.add('wrong'); sfx.no(); onWrong && onWrong(v); }
      };
      S.play.append(b);
    });
    S.play.querySelector('.bubble').focus({ preventScroll: true });
    revealPlay();
  }));
}

/* Clavier de cristaux (CE1) */
function keypad(correct, onWrong) {
  return gated(new Promise(res => {
    S.play.innerHTML = '';
    const box = el('div', 'keypad');
    const disp = el('div', 'kp-display'); disp.setAttribute('aria-live', 'polite');
    const keys = el('div', 'kp-keys');
    let val = '';
    const show = () => { disp.textContent = val || ' '; };
    const press = k => {
      if (k === 'del') { val = val.slice(0, -1); sfx.pop(); }
      else if (k === 'ok') {
        if (!val) return;
        if (+val === correct) { sfx.ok(); sparkle(disp, 10); S.play.innerHTML = ''; res(+val); return; }
        sfx.no(); disp.classList.add('shake'); setTimeout(() => disp.classList.remove('shake'), 500); onWrong && onWrong(+val); val = '';
      } else if (val.length < 2) { val += k; sfx.count(+k); }
      show();
    };
    [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].forEach(k => { const b = el('button', 'crystal', k); b.type = 'button'; b.onclick = () => press(String(k)); keys.append(b); });
    const del = el('button', 'crystal del', 'Effacer'); del.type = 'button'; del.onclick = () => press('del');
    const ok = el('button', 'crystal ok', 'Valider'); ok.type = 'button'; ok.onclick = () => press('ok');
    keys.append(del, ok);
    box.append(disp, keys); S.play.append(box); show();
    keys.firstChild.focus({ preventScroll: true });
    revealPlay();
  }));
}

/* ================= Lieu 1 : la leçon guidée (45 + 37) ================= */
async function scene1() {
  const { U, D } = W;
  sceneShell(0, W.p1, 'Leçon · CP');
  const T = buildTowers(S.board, 2, 2);
  const pile = n => `<div class="pile"><b>${n}</b><div class="row">${'<i class="necklace"></i>'.repeat(Math.floor(n / 10))}${'<i class="pearl"></i>'.repeat(n % 10)}</div><small>${Math.floor(n / 10)} ${D.many} et ${n % 10} ${U.many}</small></div>`;
  S.side.innerHTML = `<div class="piles">${pile(45)}${pile(37)}</div>`;
  say(`Bonjour ${hello()}je suis ${W.guide.name}, ${W.guide.title} ! Ici, ${U.art} <b>${U.one}</b> vaut 1. Quand on en regroupe 10, on obtient ${D.art} <b>${D.one}</b>, qui vaut 10. Voici deux tas : 45 ${U.many} et 37 ${U.many}. Aide-moi à calculer 45 + 37 !`);
  await cont();
  say(`Regarde les ${W.cols} : chaque chiffre habite dans sa ${W.col}. Les ${D.many} vont dans ${colName('d')}, les ${U.many} dans ${colName('u')}. Fais glisser les pierres de 45 dans les bonnes fenêtres, juste en dessous. Tu peux aussi toucher une pierre, puis une fenêtre.`);
  await placeDigits(T, 0, 45);
  say(`Bravo ! Le 4 compte les ${D.many}, le 5 compte les ${U.many}. À toi pour 37.`, 'cheer');
  await placeDigits(T, 1, 37);
  say(`L'addition est posée ! Le secret : on commence <b>toujours</b> par la ${W.col} des Unités. Touche chaque ${U.one} pour les compter.`);
  focusCol(T, 1);
  const field = pearlField(S.play, 12, 5);
  revealPlay();
  await tapCount(field);
  say(`12 ${U.many} ! Mais attention : dans une fenêtre, on ne peut écrire qu'<b>un seul chiffre</b>. ${W.bundle} : touche 10 ${U.many}.`, 'think');
  field.items.forEach(b => { b.classList.remove('counted'); const n = b.querySelector('.n'); n && n.remove(); });
  const bundle = await stringTen(S.play, field);
  say(`${cap(D.art)} ${D.one} ! Touche-${D.fem ? 'la' : 'le'} pour l'envoyer tout en haut de ${colName('d')}.`, 'cheer');
  await tapItem(bundle);
  await fly(bundle, T.carry[0], '<i class="necklace"></i>');
  bundle.remove(); setSlot(T.carry[0], '1'); sfx.magic();
  say(`Voilà la <b>retenue</b> : le petit 1 en haut de la ${W.col} des Dizaines, c'est ${D.art} ${D.one} ! Combien de ${U.many} reste-t-il pour la ${W.col} des Unités ?`);
  await choose([2, 12, 10], 2, v => say(v === 12
    ? `Une fenêtre ne garde qu'un seul chiffre ! 10 ${U.many} sont parties dans ${D.art} ${D.one}. Compte celles qui restent.`.replace('parties', U.art === 'un' ? 'partis' : 'parties').replace('celles', U.art === 'un' ? 'ceux' : 'celles')
    : `Regarde les ${U.many} qui restent, et compte-les.`, 'think'));
  S.play.innerHTML = '';
  setSlot(T.res[1], '2');
  focusCol(T, 0);
  say(`Maintenant, la ${W.col} des Dizaines. On compte tous les ${D.many}, sans oublier celui de la retenue ! Combien font 1 + 4 + 3 ?`.replace('celui', D.fem ? 'celle' : 'celui'));
  await choose([7, 8, 9], 8, v => say(v === 7 ? `Tu as oublié la retenue, tout en haut de la ${W.col} !` : 'Compte doucement : 1 + 4 = 5, puis 5 + 3…', 'think'));
  setSlot(T.res[0], '8'); focusCol(T, null);
  say(`Magnifique ${hello()}45 + 37 = 82 : 8 ${D.many} et 2 ${U.many} ! Tu connais le secret de l'addition posée. Voici ta première étoile !`, 'cheer');
  award(0, scene1);
}

/* ================= Lieu 2 : poser (CP) ================= */
async function scene2() {
  const P = W.p2;
  sceneShell(1, P.name, 'Quête 1 · CP');
  S.side.innerHTML = lightsSVG(P.kind);
  const lights = S.side.querySelectorAll('.light');
  const rounds = [[rnd(21, 69), rnd(12, 29)], [rnd(23, 78), rnd(3, 9)], [rnd(12, 29), rnd(2, 9), rnd(21, 49)]];
  const label = r => `${P.art === 'l\'' ? 'L\'' : cap(P.art)}${P.item} ${r}`;
  say(`${cap(hello())}${P.intro} Chaque chiffre doit entrer dans la bonne ${W.col}. Petit secret : le chiffre des unités va <b>toujours</b> dans ${colName('u')}, tout à droite.`);
  await cont('C\'est parti !');
  for (let r = 0; r < rounds.length; r++) {
    const nums = rounds[r];
    const T = buildTowers(S.board, 2, nums.length);
    say(r === 1
      ? `${cap(P.item)} ${r + 1} : pose ${nums.join(' + ')}. Attention, le ${nums[1]} est un petit nombre tout seul…`
      : `${cap(P.item)} ${r + 1} : pose ${nums.join(' + ')}. Range chaque nombre, chiffre par chiffre.`);
    for (let i = 0; i < nums.length; i++) await placeDigits(T, i, nums[i]);
    lights[r].classList.add('lit'); sfx.magic(); sparkle(lights[r]);
    const sum = nums.reduce((a, b) => a + b, 0);
    T.res.forEach((s, c) => setSlot(s, String(sum).padStart(2, ' ')[c].trim()));
    say(`${label(r + 1)} s'allume ! Chaque chiffre est dans sa ${W.col}. Et le total fait ${sum}.`, 'cheer');
    await (r < rounds.length - 1 ? cont('Suivant') : wait(900));
  }
  say(`Tout brille ! ${hello()}tu sais poser une addition. Une nouvelle étoile pour toi !`, 'cheer');
  award(1, scene2);
}

/* ================= Lieu 3 : la retenue (CP) ================= */
const LIQUIDS = ['#7cf0c9', '#ff9de0', '#ffd36b'];
async function scene3() {
  const P = W.p3, { U, D } = W;
  sceneShell(2, P.name, 'Quête 2 · CP');
  S.side.innerHTML = vesselSVG(P.kind) + `<div class="tokens">${'<svg viewBox="0 0 34 34" aria-hidden="true"><circle class="fill" cx="17" cy="17" r="14"/></svg>'.repeat(3)}</div>`;
  const vessel = S.side.querySelector('.vessel'), liquid = vessel.querySelector('.liquid');
  const level = (k, color) => { liquid.style.transform = `scaleY(${k})`; if (color) liquid.setAttribute('fill', color); };
  say(`${cap(hello())}${P.intro} Quand la ${W.col} des Unités <b>déborde</b>, une retenue monte dans la ${W.col} des Dizaines. On en fait trois !`);
  await cont('C\'est parti !');
  for (let p = 0; p < 3; p++) {
    let a, b;
    do { a = rnd(15, 68); b = rnd(14, 59); } while ((a % 10) + (b % 10) < 10 || a + b > 99);
    const ua = a % 10, ub = b % 10, us = ua + ub, da = Math.floor(a / 10), db = Math.floor(b / 10), sum = a + b;
    const T = buildTowers(S.board, 2, 2);
    fillNumber(T, 0, a); fillNumber(T, 1, b);
    level(0, LIQUIDS[p]); vessel.classList.remove('boil');
    focusCol(T, 1);
    say(`${P.round} ${p + 1} : ${a} + ${b}. On commence par la ${W.col} des Unités. Combien font ${ua} + ${ub} ?`);
    await choose([us, us - 10, us + 1, us - 1], us, v => say(v === us - 10
      ? `Presque ! Ça, c'est ce qui restera dans la ${W.col}. Mais d'abord, ${ua} + ${ub}, ça fait combien en tout ?`
      : `Compte sur tes doigts : ${ua}, puis encore ${ub}…`, 'think'));
    level(.35); vessel.classList.add('boil'); sfx.magic();
    if (p === 0) {
      say(`${us} ! Ça déborde : une fenêtre ne garde qu'un seul chiffre. ${W.bundle} : touche 10 ${U.many}.`, 'think');
      const field = pearlField(S.play, us);
      revealPlay();
      const nb = await stringTen(S.play, field);
      say(`${cap(D.art)} ${D.one} ! Touche-${D.fem ? 'la' : 'le'} pour l'envoyer en haut de la ${W.col} des Dizaines.`, 'cheer');
      await tapItem(nb);
      await fly(nb, T.carry[0], '<i class="necklace"></i>');
      S.play.innerHTML = '';
    } else {
      say(`${us}, ça déborde encore ! Touche ${P.vessel} : 10 ${U.many} se regroupent toutes seules et montent en retenue.`.replace('toutes seules', U.art === 'un' ? 'tout seuls' : 'toutes seules'), 'think');
      await tapItem(vessel);
      await fly(vessel, T.carry[0], '<i class="necklace"></i>');
    }
    setSlot(T.carry[0], '1'); sfx.magic();
    say(`La retenue est en haut de la ${W.col} des Dizaines. Quel chiffre reste dans la ${W.col} des Unités ?`);
    await choose([us - 10, us, 1], us - 10, v => say(v === us
      ? `Une fenêtre ne garde qu'un seul chiffre ! ${us}, c'est 1 ${D.one} et combien de ${U.many} ?`
      : `Le 1 est parti en retenue. Combien de ${U.many} restent ?`, 'think'));
    setSlot(T.res[1], String(us - 10)); level(.7);
    focusCol(T, 0);
    const t = 1 + da + db;
    say(`${cap(W.col)} des Dizaines : n'oublie pas la retenue ! Combien font 1 + ${da} + ${db} ?`);
    await choose([t, t - 1, t + 1], t, v => say(v === t - 1 ? 'Tu as oublié le petit 1 de la retenue, tout en haut !' : `Recompte : 1 + ${da} = ${1 + da}, puis encore ${db}.`, 'think'));
    setSlot(T.res[0], String(t)); focusCol(T, null);
    level(1); sfx.magic(); sparkle(vessel, 20);
    S.side.querySelectorAll('.tokens .fill')[p].style.fill = LIQUIDS[p];
    say(`${P.done} : ${a} + ${b} = ${sum} !`, 'cheer');
    await (p < 2 ? cont('Suivant') : wait(1000));
  }
  say(`Trois sur trois ! ${hello()}tu maîtrises la retenue. Voici ton étoile !`, 'cheer');
  award(2, scene3);
}

/* ================= Lieu 4 : poser et calculer un problème (CE1) ================= */
async function scene4() {
  const P = W.p4, { U, D, C } = W;
  sceneShell(3, P.name, 'Quête 3 · CE1');
  S.side.innerHTML = sleeperSVG(P.look);
  const sleeper = S.side.querySelector('.sleeper');
  let a, b;
  do { a = rnd(105, 489); b = rnd(13, 89); } while ((a % 10) + (b % 10) < 10);
  const [q, r] = P.stories[rnd(0, P.stories.length - 1)];
  say(`Chut ${hello()}${P.who} dort près de ${P.chest}. ${q(a, b)} Si tu trouves la réponse, il se réveillera tout content !`);
  await cont();
  const T = buildTowers(S.board, 3, 2);
  say(`Ici, il y a une troisième ${W.col} : ${colName('c')}. 10 ${D.many} font ${C.art} ${C.one}, qui vaut 100. Pose d'abord ${a}.`);
  await placeDigits(T, 0, a);
  say(`Maintenant ${b}. Il n'a pas de centaines : ${colName('c')} restera vide sur cette ligne.`);
  await placeDigits(T, 1, b);
  sleeper.classList.add('awake'); sfx.pop();
  const ua = a % 10, ub = b % 10, us = ua + ub;
  const da = Math.floor(a / 10) % 10, db = Math.floor(b / 10), ca = Math.floor(a / 100);
  focusCol(T, 2);
  say(`${P.short} ouvre un œil… Calcule ${W.col} par ${W.col} avec les cristaux. ${cap(W.col)} des Unités : combien font ${ua} + ${ub} ?`);
  await keypad(us, () => say(`Compte bien : ${ua} + ${ub}. Tu peux t'aider de tes doigts.`, 'think'));
  say(`${us} ${U.many}, c'est 1 ${D.one} et ${us - 10} ${U.many} ! J'écris ${us - 10}, et ${D.art} ${D.one} monte en retenue.`, 'cheer');
  setSlot(T.res[2], String(us - 10));
  await fly(T.res[2], T.carry[1], '<i class="necklace"></i>');
  setSlot(T.carry[1], '1'); sfx.magic();
  await cont();
  const ts = 1 + da + db;
  focusCol(T, 1);
  say(`${cap(W.col)} des Dizaines, avec la retenue : combien font 1 + ${da} + ${db} ?`);
  await keypad(ts, v => say(v === ts - 1 ? `Tu as oublié la retenue ! Regarde le petit 1 en haut de ${colName('d')}.` : `Recompte : 1 + ${da} + ${db}.`, 'think'));
  let carryC = 0;
  if (ts >= 10) {
    carryC = 1;
    say(`${ts} ${D.many} ! 10 ${D.many} font ${C.art} ${C.one}. J'écris ${ts - 10}, et la retenue monte dans ${colName('c')}.`, 'cheer');
    setSlot(T.res[1], String(ts - 10));
    await fly(T.res[1], T.carry[0], '<span>1</span>');
    setSlot(T.carry[0], '1'); sfx.magic();
    await cont();
  } else setSlot(T.res[1], String(ts));
  const hs = carryC + ca;
  focusCol(T, 0);
  say(carryC ? `Dernière ${W.col}, les Centaines : combien font 1 + ${ca} ?` : `Dernière ${W.col}, les Centaines : ${b} n'en a pas. Combien de centaines en tout ?`);
  await keypad(hs, () => say(carryC ? 'N\'oublie pas la retenue !' : `Seul ${a} a des centaines : regarde son premier chiffre.`, 'think'));
  setSlot(T.res[0], String(hs)); focusCol(T, null);
  sleeper.classList.add('open'); sfx.magic(); sparkle(sleeper, 24);
  say(`${a} + ${b} = ${a + b}. ${r(a + b)} ${P.short} est si content qu'il t'offre une étoile !`, 'cheer');
  award(3, scene4);
}

    if (state.name) { showMap(); sfx.magic(); speak(`Bienvenue dans ${W.realm} ! Je suis ${W.guide.name}.`); }
    else {
      /* Avant de valider le prénom : on change seulement le guide et le titre, sans perdre la saisie. */
      wrap.querySelector('.map-title h1').textContent = W.realm;
      welcome.querySelector('.lumi').replaceWith(guideEl());
      bub.querySelector('p').innerHTML = `Bonjour, je suis <b>${W.guide.name}</b>, ${W.guide.title} ! J'ai besoin de ton aide pour une grande aventure.`;
      trail.querySelectorAll('.place .nm').forEach((n, i) => n.textContent = PLACE_INFO()[i].name);
    }
  };
  const form = $('#name-form');
  if (form) form.onsubmit = e => {
    e.preventDefault();
    state.name = $('#name-input').value.trim().replace(/[<>&"]/g, '').slice(0, 20);
    state.world = $('#world-select').value; W = WORLDS[state.world];
    save(); audio(); sfx.magic(); showMap();
    speak(`Bienvenue ${state.name} ! Commence par ${W.p1}.`);
  };
  window.scrollTo({ top: 0 });
}

/* Ciel étoilé */
(() => {
  const sky = $('#sky');
  for (let i = 0; i < 70; i++) {
    const s = el('i'); s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's'; if (Math.random() < .2) s.style.width = s.style.height = '4px';
    sky.append(s);
  }
})();
renderStars(); renderSound(); showMap();
</script>
