<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savanturier : Agent Max, dessin animé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3450C8; --foncee: #253B9C; --or: #FFC93C; --encre: #1F2A4A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0e1630; }
  body { font-family: "Andika", system-ui, sans-serif; color: var(--encre); display: flex; justify-content: center; padding: 10px 0; }
  .telephone { width: 100%; max-width: 370px; height: 680px; border-radius: 28px; overflow: hidden; background: linear-gradient(#C9D6FF, #EEF2FF); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .scene { position: relative; width: 100%; aspect-ratio: 360 / 450; flex: none; touch-action: manipulation; cursor: pointer; outline: none; }
  .scene:focus-visible { box-shadow: inset 0 0 0 4px var(--or); }
  .scene svg, .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { pointer-events: none; }
  .bandeau { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 6px 14px 10px; text-align: center; }
  .titre { margin: 0; min-height: 36px; font-family: "Baloo 2", "Andika", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--foncee); opacity: 0; transform: translateY(12px); }
  .sous { margin: 0; min-height: 20px; font-size: 14px; line-height: 1.3; color: #3C4C6B; opacity: 0; transform: translateY(8px); }
  .boutons { display: flex; gap: 10px; margin-top: 6px; }
  .btn { min-height: 48px; padding: 8px 20px; border: 0; border-radius: 999px; font: 700 17px "Baloo 2", "Andika", sans-serif; cursor: pointer; transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .btn:active { transform: translateY(3px); }
  .btn:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  .principal { background: var(--principale); color: #fff; box-shadow: 0 4px 0 var(--foncee); }
  .principal:active { box-shadow: 0 1px 0 var(--foncee); }
  .secondaire { background: #fff; color: var(--foncee); box-shadow: 0 4px 0 #BFD0EA; }
  .secondaire:active { box-shadow: 0 1px 0 #BFD0EA; }
  .petits { display: flex; gap: 8px; margin-top: 6px; }
  .petit { min-height: 44px; min-width: 44px; padding: 6px 12px; border: 2px solid #BFD0EA; border-radius: 12px; background: #fff; color: #3C4C6B; font: 700 13px "Andika", sans-serif; cursor: pointer; }
  .petit[aria-pressed="true"] { border-color: var(--principale); color: var(--principale); background: #E7F0FF; }
  .petit:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .nuage { animation: derive 90s linear infinite; }
  .nuage.lent { animation-duration: 130s; }
  @keyframes derive { from { transform: translateX(0); } to { transform: translateX(-440px); } }
  @media (prefers-reduced-motion: reduce) { .nuage { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<div class="telephone">
  <div class="scene" id="scene" tabindex="0" role="img" aria-label="Agent Max suit des traces de pattes à la loupe. Touche la scène pour passer l'animation.">
    <svg viewBox="0 0 360 450" aria-hidden="true" id="svg">
      <defs>
        <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D6FF"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
        <linearGradient id="trottoir" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4E9F5"/><stop offset="1" stop-color="#CDD6EA"/></linearGradient>
        <linearGradient id="route" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9AA7C7"/><stop offset="1" stop-color="#7E8CB0"/></linearGradient>
        <radialGradient id="verre" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".5" stop-color="#D8ECFF" stop-opacity=".45"/><stop offset="1" stop-color="#9FC8FF" stop-opacity=".35"/></radialGradient>
        <clipPath id="clip-oeil"><ellipse rx="7.4" ry="9.6"/></clipPath>
        <clipPath id="clip-bouche"><path d="M-11 11 Q0 27 11 11 Z"/></clipPath>
      </defs>

      <rect width="360" height="450" fill="url(#ciel)"/>
      <circle cx="304" cy="56" r="22" fill="#FFE98A" stroke="#F7D86A" stroke-width="3"/>
      <g fill="#FFFFFF" stroke="#DDE4F7" stroke-width="2.5" stroke-linejoin="round">
        <path class="nuage" d="M60 92 q-6 -18 14 -18 q6 -14 22 -8 q16 -6 20 10 q14 2 8 16 Z"/>
        <path class="nuage lent" d="M430 70 q-4 -12 10 -12 q5 -9 15 -5 q11 -4 14 7 q9 2 5 10 Z" opacity=".85"/>
      </g>
      <path d="M0 250 C60 224 130 236 200 230 C260 224 310 214 360 232 V450 H0 Z" fill="#B9C9EC"/>
      <path d="M0 276 C70 258 150 266 220 262 C290 258 330 250 360 262 V450 H0 Z" fill="#8AA2DA"/>
      <g id="commissariat" transform="translate(180 198)" stroke="#33304A" stroke-width="2.6" stroke-linejoin="round">
        <rect x="-96" y="-10" width="192" height="104" fill="#5A75BF"/><rect x="-96" y="-10" width="192" height="12" fill="#3450C8"/>
        <rect x="-102" y="-22" width="204" height="14" rx="3" fill="#253B9C"/>
        <g fill="#FFF3B0"><rect x="-80" y="14" width="24" height="26" rx="3"/><rect x="-44" y="14" width="24" height="26" rx="3"/><rect x="20" y="14" width="24" height="26" rx="3"/><rect x="56" y="14" width="24" height="26" rx="3"/></g>
        <g fill="none" stroke="#33304A" stroke-width="1.6" opacity=".6"><path d="M-68 14 V40 M-80 27 H-56 M-32 14 V40 M-44 27 H-20 M32 14 V40 M20 27 H44 M68 14 V40 M56 27 H80"/></g>
        <path d="M-16 94 V52 Q0 38 16 52 V94 Z" fill="#253B9C"/><circle cx="8" cy="76" r="2.4" fill="#FFC93C"/>
        <rect x="-50" y="-4" width="100" height="18" rx="4" fill="#FFFFFF"/><text x="0" y="9" text-anchor="middle" font-family="Andika" font-weight="700" font-size="11" fill="#253B9C" stroke="none">COMMISSARIAT</text>
        <g transform="translate(-30 60)"><rect x="-3" y="-28" width="6" height="30" fill="#33304A"/><rect x="-9" y="-40" width="18" height="16" rx="3" fill="#3450C8"/><circle cy="-32" r="4.5" fill="#FFF3B0"/></g>
        <g transform="translate(30 60)"><rect x="-3" y="-28" width="6" height="30" fill="#33304A"/><rect x="-9" y="-40" width="18" height="16" rx="3" fill="#3450C8"/><circle cy="-32" r="4.5" fill="#FFF3B0"/></g>
      </g>
      <g stroke="#33304A" stroke-width="2.5" stroke-linejoin="round">
        <rect x="26" y="262" width="8" height="34" rx="3" fill="#6B4A2B"/><g fill="#41589E"><circle cx="30" cy="248" r="26"/><circle cx="14" cy="262" r="16"/><circle cx="48" cy="262" r="17"/></g>
        <rect x="326" y="266" width="8" height="30" rx="3" fill="#6B4A2B"/><g fill="#41589E"><circle cx="330" cy="252" r="24"/><circle cx="314" cy="266" r="15"/><circle cx="346" cy="266" r="15"/></g>
      </g>
      <path d="M0 296 H360 V384 H0 Z" fill="url(#trottoir)"/>
      <path d="M0 296 H360" stroke="#A9B6D4" stroke-width="2.4"/><path d="M0 384 H360" stroke="#8E9BBE" stroke-width="3"/>
      <g stroke="#B7C2DB" stroke-width="1.4" opacity=".7"><path d="M60 296 V384 M120 296 V384 M180 296 V384 M240 296 V384 M300 296 V384 M0 340 H360"/></g>
      <path d="M0 386 H360 V450 H0 Z" fill="url(#route)"/>
      <g id="passage" fill="#F1F4FA" opacity=".9"><rect x="12" y="398" width="26" height="44" rx="3"/><rect x="58" y="398" width="26" height="44" rx="3"/><rect x="104" y="398" width="26" height="44" rx="3"/><rect x="150" y="398" width="26" height="44" rx="3"/><rect x="196" y="398" width="26" height="44" rx="3"/><rect x="242" y="398" width="26" height="44" rx="3"/><rect x="288" y="398" width="26" height="44" rx="3"/><rect x="334" y="398" width="26" height="44" rx="3"/></g>
      <g id="banc" transform="translate(60 340)" stroke="#33304A" stroke-width="2.4" stroke-linejoin="round"><rect x="-30" y="-22" width="60" height="7" rx="3" fill="#8E5A2B"/><rect x="-30" y="-12" width="60" height="7" rx="3" fill="#8E5A2B"/><rect x="-30" y="4" width="60" height="7" rx="3" fill="#A86E3A"/><rect x="-26" y="-6" width="5" height="26" fill="#41589E"/><rect x="21" y="-6" width="5" height="26" fill="#41589E"/></g>
      <g id="traces"></g>
      <ellipse id="ombre-sol" cx="150" cy="384" rx="34" ry="8" fill="#253B9C" opacity=".2"/>
      <ellipse id="ombre-chiot" cx="150" cy="384" rx="22" ry="5" fill="#253B9C" opacity="0"/>
      <g id="loupe-sol" opacity="0"></g>
      <g id="chiot-monde"></g>
      <g id="leo"></g>
      <g id="chiot-devant"></g>
      <g id="buisson"></g>
      <g id="voitures"></g>
      <g id="casquette-vol" opacity="0"></g>
      <g id="bulle" opacity="0"><rect x="-30" y="-16" width="60" height="30" rx="14" fill="#FFFFFF" stroke="#33304A" stroke-width="2.6"/><text y="6" text-anchor="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="17" fill="#253B9C"></text></g>
      <g id="etoiles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.8" stroke-linejoin="round"></g>
      <g id="etincelles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.5" stroke-linejoin="round"></g>
      <g transform="translate(180 60)">
        <g id="rayons" opacity="0"></g>
        <g id="cri" opacity="0">
          <text x="3" y="4" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="40" fill="#FFC93C" stroke="#33304A" stroke-width="10" stroke-linejoin="round" paint-order="stroke">Enquête résolue !</text>
          <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="40" fill="#3450C8" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Enquête résolue !</text>
        </g>
      </g>
      <g id="planche" opacity="0"></g>
    </svg>
    <canvas id="confettis" aria-hidden="true"></canvas>
  </div>
  <div class="bandeau">
    <p class="titre" id="titre"></p>
    <p class="sous" id="sous"></p>
    <div class="boutons">
      <button class="btn principal" id="marquer" type="button">Réussir</button>
      <button class="btn secondaire" id="rater" type="button">Rater</button>
    </div>
    <div class="petits" role="group" aria-label="Choisir la célébration">
      <button class="petit" type="button" data-celebration="orchestre" aria-pressed="false">A · Orchestre</button>
      <button class="petit" type="button" data-celebration="trottinette" aria-pressed="false">B · Trottinette</button>
      <button class="petit" type="button" data-celebration="danse" aria-pressed="false">C · Danse</button>
    </div>
  </div>
  <p class="sr-only" id="annonce" aria-live="polite"></p>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const mouvementsReduits = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CONTOUR = "#33304A", PEAU = "#f2cba5", PEAU_OMBRE = "#E3AE85", PEAU_LUMIERE = "#FFE9D2", CHEVEUX = "#4a2f1d", CHEVEUX_OMBRE = "#3A2314", CHEVEUX_LUMIERE = "#70492E",
    CHEMISE = "#4C78E8", CHEMISE_OMBRE = "#3450C8", CHEMISE_LUMIERE = "#86A5F2", PANTALON = "#253B9C", PANTALON_OMBRE = "#1B2C78", PANTALON_LUMIERE = "#3F56B8",
    CASQ = "#3450C8", CASQ_OMBRE = "#253B9C", CASQ_LUMIERE = "#6484EA", VISIERE = "#2B2B3A", CHAUSSURE = "#2B2B3A", CHAUSSURE_OMBRE = "#1B1B28", OR = "#FFC93C",
    GANT = "#FFFFFF", GANT_OMBRE = "#D5DEEE", CHIEN = "#F6E6C8", CHIEN_OMBRE = "#E4CBA0", CHIEN_BRUN = "#C58B55";
  const DEG = Math.PI / 180;

  // ---------- Courbes (moteur de Coach Léo) ----------
  const E = {
    lineaire: (u) => u,
    sortie: (u) => 1 - Math.pow(1 - u, 3),
    entree: (u) => u * u * u,
    douce: (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
    retour: (u) => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
    rebond: (u) => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  };
  const lerp = (a, b, u) => a + (b - a) * u, clamp01 = (u) => Math.max(0, Math.min(1, u));
  const fenetre = (t, debut, duree, e = E.sortie) => e(clamp01((t - debut) / duree));
  const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
  const tr = (el, v) => el.setAttribute("transform", v);
  const att = (el, a, v) => el.setAttribute(a, v);
  const BASE = 1.15, SOL = 382, Y_SOL = SOL - 58 * BASE;   // origine du personnage aux hanches, pieds 58 unités plus bas (comme Léo)

  // ---------- Géométrie des membres : une seule courbe souple par membre (Léo) ----------
  const quad = (S, C, W, t) => ({ x: (1 - t) ** 2 * S.x + 2 * t * (1 - t) * C.x + t * t * W.x, y: (1 - t) ** 2 * S.y + 2 * t * (1 - t) * C.y + t * t * W.y });
  function membre(S, a1, a2, L1, L2) {
    const E1 = { x: S.x - Math.sin(a1 * DEG) * L1, y: S.y + Math.cos(a1 * DEG) * L1 };
    const W = { x: E1.x - Math.sin((a1 + a2) * DEG) * L2, y: E1.y + Math.cos((a1 + a2) * DEG) * L2 };
    const C = { x: 2 * E1.x - (S.x + W.x) / 2, y: 2 * E1.y - (S.y + W.y) / 2 };
    const dir = Math.atan2(W.x - E1.x, -(W.y - E1.y)) / DEG;
    return { S, E: E1, W, C, dir };
  }
  function trace(m, t0, t1, pas = 8) { let d = ""; for (let i = 0; i <= pas; i++) { const p = quad(m.S, m.C, m.W, lerp(t0, t1, i / pas)); d += `${i ? "L" : "M"}${r1(p.x)} ${r1(p.y)}`; } return d; }
  const decale = (m, nx, ny) => ({ ...m, S: { x: m.S.x + nx, y: m.S.y + ny }, C: { x: m.C.x + nx, y: m.C.y + ny }, W: { x: m.W.x + nx, y: m.W.y + ny } });
  const ligne = (classe, couleur, largeur, extra = "") => `<path class="${classe}" fill="none" stroke="${couleur}" stroke-width="${largeur}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  // angles de Léo (a1, a2) qui amènent l'extrémité d'un membre à une cible : sert aux pédales, au guidon et à quelques gestes précis
  function anglesVers(S, T, L1, L2, cote) {
    const dx = T.x - S.x, dy = T.y - S.y, D = Math.hypot(dx, dy) || .001, Dc = Math.max(Math.abs(L1 - L2) + 1, Math.min((L1 + L2) * .985, D)), ux = dx / D, uy = dy / D;
    const a = (L1 * L1 - L2 * L2 + Dc * Dc) / (2 * Dc), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const Ex = S.x + ux * a + uy * h * cote, Ey = S.y + uy * a - ux * h * cote, Wx = S.x + ux * Dc, Wy = S.y + uy * Dc;
    const a1 = Math.atan2(-(Ex - S.x), Ey - S.y) / DEG; let a2 = Math.atan2(-(Wx - Ex), Wy - Ey) / DEG - a1;
    while (a2 > 180) a2 -= 360; while (a2 < -180) a2 += 360;
    return { a1, a2 };
  }
  const EPAULE = (c) => ({ x: c === "g" ? -18 : 18, y: -38 }), HANCHE = (c) => ({ x: c === "g" ? -10 : 10, y: 4 });
  // bras vers une cible (repère du buste) : coude vers l'extérieur et le bas
  function brasVers(c, T) {
    const S = EPAULE(c), side = c === "g" ? -1 : 1, dx = T.x - S.x, dy = T.y - S.y, D = Math.hypot(dx, dy) || 1, nx = dy / D, ny = -dx / D;
    const cote = Math.sign(nx * side + ny * .55) || side, r = anglesVers(S, T, 24, 22, cote);
    return c === "g" ? { aGu: r.a1, aGl: r.a2 } : { aDu: r.a1, aDl: r.a2 };
  }
  const mains = (g, d) => ({ ...(g ? brasVers("g", { x: g[0], y: g[1] }) : {}), ...(d ? brasVers("d", { x: d[0], y: d[1] }) : {}) });

  // ---------- Mains à cinq doigts (Léo), peau ou gant blanc ----------
  function doigtForme(x, y0, a, L, b = 2.7, tp = 1.9) {
    const dx = Math.sin(a * DEG), dy = -Math.cos(a * DEG), nx = -dy, ny = dx;
    const tx = x + dx * L, ty = y0 + dy * L, mx = (x + tx) / 2 + nx * .7, my = (y0 + ty) / 2 + ny * .7, mw = (b + tp) / 2;
    return `M${r1(x + nx * b)} ${r1(y0 + ny * b)} Q${r1(mx + nx * mw)} ${r1(my + ny * mw)} ${r1(tx + nx * tp)} ${r1(ty + ny * tp)} A${tp} ${tp} 0 0 0 ${r1(tx - nx * tp)} ${r1(ty - ny * tp)} Q${r1(mx - nx * mw)} ${r1(my - ny * mw)} ${r1(x - nx * b)} ${r1(y0 - ny * b)} Z`;
  }
  function main(pose, miroir, peau = PEAU, ombre = PEAU_OMBRE) {
    const m = miroir ? -1 : 1, doigts = [-6.3, -2.1, 2.1, 6.3], angles = pose === 3 ? [-26, -9, 9, 26] : [-9, -3, 3, 9];
    const paume = `M-8 9 V-3 Q-8 -8 -3 -8 H3 Q8 -8 8 -3 V9 Q0 12 -8 9 Z`, paumePoing = `M-8 8 V-2 Q-8 -9 0 -9 Q8 -9 8 -2 V8 Q0 12 -8 8 Z`;
    const forme = (d, w) => `<path d="${d}" fill="none" stroke="${CONTOUR}" stroke-width="${w}" stroke-linejoin="round"/>`;
    let contours = "", remplissages = "";
    if (pose === 0 || pose === 3) {
      const formes = doigts.map((x, i) => doigtForme(x, -6, angles[i] * m, 10.5 - Math.abs(i - 1.5) * .8)), pouce = doigtForme(-7 * m, 0, -52 * m, 9, 2.6, 1.9);
      formes.concat(pouce).forEach((d) => (contours += forme(d, 5.2)));
      remplissages += formes.concat(pouce).map((d) => `<path d="${d}" fill="${peau}"/>`).join("");
      remplissages += doigts.map((x, i) => { const a = angles[i] * m * DEG; return `<path d="M${r1(x + Math.sin(a) * 3)} ${r1(-6 - Math.cos(a) * 3)} l${r1(Math.sin(a) * 4)} ${r1(-Math.cos(a) * 4)}" fill="none" stroke="${ombre}" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>`; }).join("");
      return `${contours}${forme(paume, 5.6)}<path d="${paume}" fill="${peau}"/>${remplissages}<path d="M3 8 Q7 4 7 -1" fill="none" stroke="${ombre}" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    const pouce = pose === 2 ? doigtForme(-5 * m, -4, -10 * m, 13, 2.8, 2.1) : null;
    if (pouce) contours += forme(pouce, 5.4);
    doigts.forEach((x) => { contours += `<circle cx="${x}" cy="-8" r="5.4" fill="${CONTOUR}"/>`; });
    let dessus = doigts.map((x) => `<circle cx="${x}" cy="-8" r="3.6" fill="${peau}"/>`).join("") + `<rect x="-8" y="-8" width="16" height="6" fill="${peau}"/>`;
    dessus += doigts.map((x) => `<path d="M${x - 2.2} -6.5 q2.2 -1.8 4.4 0" fill="none" stroke="${ombre}" stroke-width="1.4" stroke-linecap="round"/>`).join("");
    if (pouce) dessus += `<path d="${pouce}" fill="${peau}"/><path d="M${r1(-6 * m)} -3 l${r1(-1.5 * m)} -6" fill="none" stroke="${ombre}" stroke-width="1.6" stroke-linecap="round"/>`;
    else dessus += `<path d="M${-7 * m} 2 q${r1(5 * m)} 3 ${r1(10 * m)} 1" fill="none" stroke="${ombre}" stroke-width="1.8" stroke-linecap="round"/>`;
    return `${contours}${forme(paumePoing, 5.6)}<path d="${paumePoing}" fill="${peau}"/>${dessus}<path d="M3 7 Q7 3 7 -2" fill="none" stroke="${ombre}" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  const MAINS = {
    peau: { droit: [0, 1, 2, 3].map((p) => main(p, false)), miroir: [0, 1, 2, 3].map((p) => main(p, true)) },
    gant: { droit: [0, 1, 2, 3].map((p) => main(p, false, GANT, GANT_OMBRE)), miroir: [0, 1, 2, 3].map((p) => main(p, true, GANT, GANT_OMBRE)) },
