<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savanturier : Noisette, écureuil savant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #C9452F; --foncee: #9E3322; --or: #FFC93C; --encre: #3A2A1A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0f1b2d; }
  body { font-family: "Andika", system-ui, sans-serif; color: var(--encre); display: flex; justify-content: center; padding: 10px 0; }
  .telephone { width: 100%; max-width: 370px; height: 680px; border-radius: 28px; overflow: hidden; background: linear-gradient(#BFE5FF, #FFF3DF); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .scene { position: relative; width: 100%; aspect-ratio: 360 / 450; flex: none; touch-action: manipulation; cursor: pointer; outline: none; }
  .scene:focus-visible { box-shadow: inset 0 0 0 4px var(--or); }
  .scene svg, .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { pointer-events: none; }
  .bandeau { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 6px 14px 10px; text-align: center; }
  .titre { margin: 0; min-height: 36px; font-family: "Baloo 2", "Andika", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--foncee); opacity: 0; transform: translateY(12px); }
  .sous { margin: 0; min-height: 20px; font-size: 14px; line-height: 1.3; color: #5A4634; opacity: 0; transform: translateY(8px); }
  .boutons { display: flex; gap: 10px; margin-top: 6px; }
  .btn { min-height: 48px; padding: 8px 20px; border: 0; border-radius: 999px; font: 700 17px "Baloo 2", "Andika", sans-serif; cursor: pointer; transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .btn:active { transform: translateY(3px); }
  .btn:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  .principal { background: var(--principale); color: #fff; box-shadow: 0 4px 0 var(--foncee); }
  .principal:active { box-shadow: 0 1px 0 var(--foncee); }
  .secondaire { background: #fff; color: var(--foncee); box-shadow: 0 4px 0 #E8CDB8; }
  .secondaire:active { box-shadow: 0 1px 0 #E8CDB8; }
  .petits { display: flex; gap: 8px; margin-top: 6px; }
  .petit { min-height: 44px; min-width: 44px; padding: 6px 12px; border: 2px solid #E8CDB8; border-radius: 12px; background: #fff; color: #5A4634; font: 700 13px "Andika", sans-serif; cursor: pointer; }
  .petit[aria-pressed="true"] { border-color: var(--principale); color: var(--principale); background: #FFF0E6; }
  .petit:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .herbe-avant path { transform-box: fill-box; transform-origin: 50% 100%; animation: ondule 3.2s ease-in-out infinite; }
  .herbe-avant path:nth-child(2n) { animation-delay: -1.1s; } .herbe-avant path:nth-child(3n) { animation-delay: -2.1s; animation-duration: 3.9s; }
  @keyframes ondule { 0%, 100% { transform: skewX(-4deg); } 50% { transform: skewX(5deg); } }
  .nuage { animation: derive 90s linear infinite; } .nuage.lent { animation-duration: 130s; }
  @keyframes derive { from { transform: translateX(0); } to { transform: translateX(-440px); } }
  @media (prefers-reduced-motion: reduce) { .herbe-avant path, .nuage { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<div class="telephone">
  <div class="scene" id="scene" tabindex="0" role="img" aria-label="Noisette attrape une noisette dorée qui tombe de l'arbre, dans la Forêt des Savanturiers. Touche la scène pour passer l'animation.">
    <svg viewBox="0 0 360 450" aria-hidden="true" id="svg">
      <defs>
        <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9DAFF"/><stop offset=".6" stop-color="#BFE5FF"/><stop offset="1" stop-color="#FFF3DF"/></linearGradient>
        <linearGradient id="prairie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8D9A4"/><stop offset="1" stop-color="#6CBF84"/></linearGradient>
        <radialGradient id="noisette-or" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FFF1A8"/><stop offset=".5" stop-color="#FFC93C"/><stop offset="1" stop-color="#D99A12"/></radialGradient>
        <radialGradient id="lueur" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF1A8" stop-opacity=".75"/><stop offset="1" stop-color="#FFF1A8" stop-opacity="0"/></radialGradient>
        <clipPath id="clip-oeil"><ellipse rx="9" ry="11"/></clipPath>
        <clipPath id="clip-bouche"><path d="M-12 0 Q0 22 12 0 Z"/></clipPath>
      </defs>
      <!-- Prairie : ciel, nuages, collines, arbre, herbe -->
      <rect width="360" height="450" fill="url(#ciel)"/>
      <circle cx="68" cy="66" r="24" fill="#FFE38A" stroke="#F5C84A" stroke-width="3"/>
      <g fill="#FFFFFF" stroke="#D9ECFA" stroke-width="2.5" stroke-linejoin="round">
        <path class="nuage" d="M150 86 q-6 -18 14 -18 q6 -14 22 -8 q16 -6 20 10 q14 2 8 16 Z"/>
        <path class="nuage lent" d="M440 130 q-4 -12 10 -12 q5 -9 15 -5 q11 -4 14 7 q9 2 5 10 Z" opacity=".85"/>
      </g>
      <path d="M0 280 C70 250 140 268 200 262 C260 256 310 238 360 256 V450 H0 Z" fill="#A8D9A4"/>
      <path d="M0 310 C60 296 120 312 180 304 C250 294 310 302 360 296 V450 H0 Z" fill="#8FD08E"/>
      <!-- l'arbre, sur la gauche -->
      <g id="arbre">
        <path d="M46 400 Q52 300 54 230 H86 Q92 300 100 400 Z" fill="#8E5A2B" stroke="#33304A" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M62 250 Q60 320 64 390 M78 240 Q80 320 86 392" fill="none" stroke="#6B4226" stroke-width="3" opacity=".55"/>
        <g stroke="#33304A" stroke-width="3.5" stroke-linejoin="round">
          <circle cx="70" cy="190" r="62" fill="#2E7E52"/><circle cx="24" cy="222" r="38" fill="#3F9A63"/><circle cx="118" cy="214" r="42" fill="#3F9A63"/><circle cx="52" cy="140" r="36" fill="#4FAE6E"/><circle cx="100" cy="156" r="34" fill="#4FAE6E"/>
        </g>
        <circle cx="42" cy="150" r="13" fill="#8FD98A" opacity=".8"/><circle cx="96" cy="174" r="9" fill="#8FD98A" opacity=".7"/>
        <g id="noisettes-arbre"></g>
      </g>
      <path d="M0 384 Q180 372 360 384 V450 H0 Z" fill="url(#prairie)"/>
      <path d="M0 386 Q90 376 180 382 Q270 388 360 380" fill="none" stroke="#3F9A63" stroke-width="3"/>
      <g id="noisettes-herbe"></g>
      <g id="fleurs" stroke="#33304A" stroke-width="1.4"><g transform="translate(300 404)"><path d="M0 0 V14" stroke="#2E7E52" stroke-width="2"/><circle r="5" fill="#FF8FA8"/><circle r="2" fill="#FFC93C"/></g><g transform="translate(335 426)"><path d="M0 0 V12" stroke="#2E7E52" stroke-width="2"/><circle r="4.5" fill="#9FD3FF"/><circle r="1.8" fill="#FFC93C"/></g><g transform="translate(26 420)"><path d="M0 0 V12" stroke="#2E7E52" stroke-width="2"/><circle r="4.5" fill="#FFFFFF"/><circle r="1.8" fill="#FFC93C"/></g></g>
      <ellipse id="ombre-sol" cx="190" cy="398" rx="46" ry="9" fill="#2E7E52" opacity=".28"/>
      <g id="noisette-vol"></g>
      <g id="leo"></g>
      <g id="noisette-devant"></g>
      <g id="jonglage"></g>
      <g id="miettes" fill="#D99A12" stroke="#33304A" stroke-width="1"></g>
      <g id="crunch" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0"></g>
      <g id="toc" opacity="0"><text text-anchor="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="26" fill="#FFC93C" stroke="#33304A" stroke-width="5" stroke-linejoin="round" paint-order="stroke">toc !</text></g>
      <g id="etourdi" opacity="0"></g>
      <g id="surprise" opacity="0"><circle r="11" fill="#FFF7C2" stroke="#33304A" stroke-width="3"/><path d="M0 -5 V2 M0 5.5 V6" stroke="#33304A" stroke-width="3.2" stroke-linecap="round"/></g>
      <g id="etoiles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.8" stroke-linejoin="round"></g>
      <g id="etincelles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.5" stroke-linejoin="round"></g>
      <g class="herbe-avant" fill="#6CBF84" stroke="#2E7E52" stroke-width="1.5">
        <path d="M14 450 q2 -30 10 -44 q2 24 -4 44 Z"/><path d="M40 450 q-4 -26 4 -40 q6 18 2 40 Z"/><path d="M120 450 q2 -24 10 -36 q0 20 -4 36 Z"/><path d="M250 450 q-4 -28 6 -42 q6 22 0 42 Z"/><path d="M296 450 q2 -22 10 -34 q0 18 -4 34 Z"/><path d="M340 450 q-4 -26 4 -40 q6 18 2 40 Z"/><path d="M190 450 q2 -18 8 -28 q0 16 -3 28 Z"/>
      </g>
      <g id="cri-ancre" transform="translate(180 60)">
        <g id="rayons" opacity="0"></g>
        <g id="cri" opacity="0">
          <text x="3" y="4" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="56" fill="#FFC93C" stroke="#33304A" stroke-width="12" stroke-linejoin="round" paint-order="stroke">Hourra !</text>
          <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="56" fill="#C9452F" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Hourra !</text>
        </g>
      </g>
      <g id="planche" opacity="0"></g>
    </svg>
    <canvas id="confettis" aria-hidden="true"></canvas>
  </div>
  <div class="bandeau">
    <p class="titre" id="titre"></p>
    <p class="sous" id="sous"></p>
    <div class="boutons">
      <button class="btn principal" id="marquer" type="button">Réussir</button>
      <button class="btn secondaire" id="rater" type="button">Rater</button>
    </div>
    <div class="petits" role="group" aria-label="Choisir la célébration">
      <button class="petit" type="button" data-celebration="jongle" aria-pressed="false">A · Jonglage</button>
      <button class="petit" type="button" data-celebration="mange" aria-pressed="false">B · Croque</button>
      <button class="petit" type="button" data-celebration="joues" aria-pressed="false">C · Joues pleines</button>
    </div>
  </div>
  <p class="sr-only" id="annonce" aria-live="polite"></p>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const mouvementsReduits = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CONTOUR = "#33304A", FOURRURE = "#F48C3C", OMBRE = "#C9601C", LUMIERE = "#FFC28A", BANDE = "#D9772A", VENTRE = "#FFE0BF", VENTRE_LUM = "#FFFFFF", OREILLE = "#FFB3C7", TRUFFE = "#8B4A1E", PEAU = "#FFC28A", PEAU_OMBRE = "#E09A5A";
  const DEG = Math.PI / 180;

  // ---------- Courbes ----------
  const E = {
    lineaire: (u) => u, sortie: (u) => 1 - Math.pow(1 - u, 3), entree: (u) => u * u * u,
    douce: (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
    retour: (u) => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
    rebond: (u) => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  };
  const lerp = (a, b, u) => a + (b - a) * u, clamp01 = (u) => Math.max(0, Math.min(1, u));
  const fenetre = (t, debut, duree, e = E.sortie) => e(clamp01((t - debut) / duree));
  const r1 = (v) => Math.round(v * 10) / 10;
  const tr = (el, v) => el.setAttribute("transform", v), att = (el, a, v) => el.setAttribute(a, v);
  const BASE = 1.35;

  // ---------- Membres : une courbe souple ----------
  const quad = (S, C, W, t) => ({ x: (1 - t) ** 2 * S.x + 2 * t * (1 - t) * C.x + t * t * W.x, y: (1 - t) ** 2 * S.y + 2 * t * (1 - t) * C.y + t * t * W.y });
  function membre(S, a1, a2, L1, L2) {
    const E1 = { x: S.x - Math.sin(a1 * DEG) * L1, y: S.y + Math.cos(a1 * DEG) * L1 };
    const W = { x: E1.x - Math.sin((a1 + a2) * DEG) * L2, y: E1.y + Math.cos((a1 + a2) * DEG) * L2 };
    const C = { x: 2 * E1.x - (S.x + W.x) / 2, y: 2 * E1.y - (S.y + W.y) / 2 };
    return { S, E: E1, W, C, dir: Math.atan2(W.x - E1.x, -(W.y - E1.y)) / DEG };
  }
  function trace(m, t0, t1, pas = 8) { let d = ""; for (let i = 0; i <= pas; i++) { const p = quad(m.S, m.C, m.W, lerp(t0, t1, i / pas)); d += `${i ? "L" : "M"}${r1(p.x)} ${r1(p.y)}`; } return d; }
  const ligne = (classe, couleur, largeur) => `<path class="${classe}" fill="none" stroke="${couleur}" stroke-width="${largeur}" stroke-linecap="round" stroke-linejoin="round"/>`;

  // ---------- Petites mains à cinq doigts ----------
  function doigtForme(x, y0, a, L, b = 2.7, tp = 1.9) {
    const dx = Math.sin(a * DEG), dy = -Math.cos(a * DEG), nx = -dy, ny = dx;
    const tx = x + dx * L, ty = y0 + dy * L, mx = (x + tx) / 2 + nx * .7, my = (y0 + ty) / 2 + ny * .7, mw = (b + tp) / 2;
    return `M${r1(x + nx * b)} ${r1(y0 + ny * b)} Q${r1(mx + nx * mw)} ${r1(my + ny * mw)} ${r1(tx + nx * tp)} ${r1(ty + ny * tp)} A${tp} ${tp} 0 0 0 ${r1(tx - nx * tp)} ${r1(ty - ny * tp)} Q${r1(mx - nx * mw)} ${r1(my - ny * mw)} ${r1(x - nx * b)} ${r1(y0 - ny * b)} Z`;
  }
  function main(pose, miroir) {
    const m = miroir ? -1 : 1, doigts = [-6.3, -2.1, 2.1, 6.3], angles = pose === 3 ? [-26, -9, 9, 26] : [-9, -3, 3, 9];
    const paume = `M-8 9 V-3 Q-8 -8 -3 -8 H3 Q8 -8 8 -3 V9 Q0 12 -8 9 Z`, paumePoing = `M-8 8 V-2 Q-8 -9 0 -9 Q8 -9 8 -2 V8 Q0 12 -8 8 Z`;
    const forme = (d, w) => `<path d="${d}" fill="none" stroke="${CONTOUR}" stroke-width="${w}" stroke-linejoin="round"/>`;
    let contours = "", remplissages = "";
    if (pose === 0 || pose === 3) {
      const formes = doigts.map((x, i) => doigtForme(x, -6, angles[i] * m, 9.5 - Math.abs(i - 1.5) * .7)), pouce = doigtForme(-7 * m, 0, -52 * m, 8, 2.6, 1.9);
      formes.concat(pouce).forEach((d) => (contours += forme(d, 5.2)));
      remplissages += formes.concat(pouce).map((d) => `<path d="${d}" fill="${PEAU}"/>`).join("");
      return `${contours}${forme(paume, 5.6)}<path d="${paume}" fill="${PEAU}"/>${remplissages}<path d="M3 8 Q7 4 7 -1" fill="none" stroke="${PEAU_OMBRE}" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    const pouce = pose === 2 ? doigtForme(-5 * m, -4, -10 * m, 12, 2.8, 2.1) : null;
    if (pouce) contours += forme(pouce, 5.4);
    doigts.forEach((x) => { contours += `<circle cx="${x}" cy="-8" r="5.4" fill="${CONTOUR}"/>`; });
    let dessus = doigts.map((x) => `<circle cx="${x}" cy="-8" r="3.6" fill="${PEAU}"/>`).join("") + `<rect x="-8" y="-8" width="16" height="6" fill="${PEAU}"/>`;
    dessus += doigts.map((x) => `<path d="M${x - 2.2} -6.5 q2.2 -1.8 4.4 0" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.4" stroke-linecap="round"/>`).join("");
    if (pouce) dessus += `<path d="${pouce}" fill="${PEAU}"/>`; else dessus += `<path d="M${-7 * m} 2 q${r1(5 * m)} 3 ${r1(10 * m)} 1" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.8" stroke-linecap="round"/>`;
    return `${contours}${forme(paumePoing, 5.6)}<path d="${paumePoing}" fill="${PEAU}"/>${dessus}`;
  }
  const MAINS = { droit: [0, 1, 2, 3].map((p) => main(p, false)), miroir: [0, 1, 2, 3].map((p) => main(p, true)) };

  // ---------- Le personnage : rond et potelé, toujours de face ou de trois-quarts ----------
  const brasHTML = (c) => `<g id="bras-${c}">${ligne("contour", CONTOUR, 21)}${ligne("rempli", FOURRURE, 15)}${ligne("ombre", OMBRE, 5)}${ligne("lumiere", LUMIERE, 3)}<g id="main-${c}"><g class="pose-main"></g></g></g>`;
  const oeilHTML = (c) => `<g id="oeil-${c}"><ellipse rx="9" ry="11" fill="#FFFFFF" stroke="${PEAU_OMBRE}" stroke-width="1"/>
      <g id="regard-${c}"><circle cx=".5" cy="3" r="5.4" fill="#3E2A1A"/><circle cx=".5" cy="3" r="4.4" fill="#6B4226"/><circle cx=".5" cy="3" r="2.6" fill="#1B1530"/><circle cx="-1.6" cy=".4" r="2" fill="#FFFFFF"/><circle cx="2.8" cy="5" r="1" fill="#FFFFFF"/></g>
      <g id="spirale-${c}" opacity="0"><path d="M0 3 m-5 0 a5 5 0 1 1 10 0 a3.6 3.6 0 1 1 -7.2 0 a2.2 2.2 0 1 1 4.4 0 a1 1 0 1 1 -2 0" fill="none" stroke="#3E2A1A" stroke-width="2" stroke-linecap="round"/></g>
      <g clip-path="url(#clip-oeil)"><ellipse id="paupiere-${c}" rx="11" ry="12" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="2.6"/></g>
      <path d="M-8.5 0 A9 11 0 0 1 8.5 0" fill="none" stroke="${CONTOUR}" stroke-width="3" stroke-linecap="round"/>
      <path d="M-5 10.2 Q0 12 5 10.2" fill="none" stroke="${CONTOUR}" stroke-width="1" stroke-linecap="round" opacity=".4"/>
      <path d="M${c === "g" ? "-7 -8 l-2.6 -2.4" : "7 -8 l2.6 -2.4"}" fill="none" stroke="${CONTOUR}" stroke-width="2.2" stroke-linecap="round"/></g>`;
  $("leo").innerHTML = `
    <g id="queue"><path class="queue" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="3.4" stroke-linejoin="round"/><path class="queue-ventre" fill="${VENTRE}"/><path class="queue-ombre" fill="none" stroke="${OMBRE}" stroke-width="4" stroke-linecap="round" opacity=".8"/><path class="queue-lumiere" fill="none" stroke="${LUMIERE}" stroke-width="3" stroke-linecap="round"/><path class="queue-meches" fill="none" stroke="${OMBRE}" stroke-width="1.4" stroke-linecap="round" opacity=".55"/></g>
    <g id="bras-arriere"></g>
    <g id="pied-g"><ellipse cx="-17" cy="-5" rx="16" ry="9" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="3"/><path d="M-26 -1 q4 3 7 0 M-19 1 q4 3 7 0 M-12 -1 q3 2 6 0" fill="none" stroke="${CONTOUR}" stroke-width="1.5" opacity=".7"/></g>
    <g id="pied-d"><ellipse cx="17" cy="-5" rx="16" ry="9" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="3"/><path d="M8 -1 q4 3 7 0 M15 1 q4 3 7 0 M22 -1 q3 2 6 0" fill="none" stroke="${CONTOUR}" stroke-width="1.5" opacity=".7"/></g>
    <g id="corps">
      <path id="jambe-g" d="M-20 -30 Q-26 -14 -20 -6 Q-12 -2 -8 -8 Q-6 -20 -10 -30 Z" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="3" stroke-linejoin="round"/>
      <path id="jambe-d" d="M20 -30 Q26 -14 20 -6 Q12 -2 8 -8 Q6 -20 10 -30 Z" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-50" rx="36" ry="40" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="3.6"/>
      <path d="M10 -14 A36 40 0 0 0 34 -62 A30 34 0 0 1 10 -14 Z" fill="${OMBRE}"/>
      <ellipse id="ventre" cx="-1" cy="-42" rx="24" ry="29" fill="${VENTRE}"/>
      <ellipse cx="-9" cy="-54" rx="8" ry="11" fill="${VENTRE_LUM}" opacity=".6"/>
      <ellipse cx="-20" cy="-78" rx="9" ry="5" fill="${LUMIERE}" opacity=".8"/>
    </g>
    <g id="tete">
      <g id="oreille-g"><ellipse rx="13" ry="15" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="3"/><ellipse cy="1" rx="7" ry="9" fill="${OREILLE}"/></g>
      <g id="oreille-d"><ellipse rx="13" ry="15" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="3"/><ellipse cy="1" rx="7" ry="9" fill="${OREILLE}"/></g>
      <circle r="44" fill="${FOURRURE}" stroke="${CONTOUR}" stroke-width="3.8"/>
      <path d="M12 42 A44 44 0 0 0 42 -12 A36 36 0 0 1 12 42 Z" fill="${OMBRE}"/>
      <path id="bande" d="M-16 -42 Q0 -50 16 -42 Q10 -30 0 -32 Q-10 -30 -16 -42 Z" fill="${BANDE}"/>
      <ellipse cx="-18" cy="-24" rx="11" ry="6" fill="${LUMIERE}" opacity=".85"/>

  }
  const tConfettis = () => anim.tPetales;
  function boucle(maintenant) {
    const t = Math.min(anim.fin, (maintenant - depart) / 1000);
    if (t >= tConfettis()) avanceConfettis(Math.min(.05, t - Math.max(tPrecedent, tConfettis())));
    tPrecedent = t; rend(t);
    if (t >= anim.fin) { termine(); return; }
    image = requestAnimationFrame(boucle);
  }
  function termine() { enCours = false; cancelAnimationFrame(image); N.annonce.textContent = ""; requestAnimationFrame(() => { N.annonce.textContent = anim.genre === "but" ? "Hourra ! " + anim.titre : anim.titre; }); }
  function etatFinal() { for (let i = 0; i < 700; i++) avanceConfettis(1 / 60); tPrecedent = anim.fin; rend(anim.fin); termine(); }
  function prepare(nouvelle) {
    anim = nouvelle; semeConfettis(anim.genre === "but"); QUEUE.tPrec = null; vxPrec = 0;
    document.querySelectorAll(".petit").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.celebration === anim.celebration)));
    N.scene.setAttribute("aria-label", anim.genre === "but" ? "Noisette attrape la noisette dorée et fête le chapitre réussi. Touche la scène pour passer la fête." : "La noisette tombe doucement sur la tête de Noisette, qui rit et lève le pouce : on réessaie. Touche la scène pour passer l'animation.");
  }
  function lance(nouvelle) { cancelAnimationFrame(image); prepare(nouvelle); if (mouvementsReduits) { etatFinal(); return; } enCours = true; depart = performance.now(); tPrecedent = 0; rend(0); image = requestAnimationFrame(boucle); }
  const auHasard = () => ["jongle", "mange", "joues"][Math.floor(Math.random() * 3)];
  $("marquer").addEventListener("click", () => lance(construitBut(auHasard())));
  $("rater").addEventListener("click", () => lance(construitEchec()));
  document.querySelectorAll(".petit").forEach((b) => b.addEventListener("click", () => lance(construitBut(b.dataset.celebration))));
  const passe = () => { if (enCours) etatFinal(); };
  N.scene.addEventListener("pointerdown", passe);
  N.scene.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); passe(); } });

  // Mise au point : « ?anim=jongle|mange|joues|echec&t=1.2 » rend l'image fixe ; « ?planche=mains » ou « ?planche=tetes » montre une planche.
  const params = new URLSearchParams(location.search);
  function rendStatique(nouvelle, t) { prepare(nouvelle); for (let s = tConfettis(); s < t; s += 1 / 60) avanceConfettis(1 / 60); for (let s = 0; s < t; s += 1 / 30) rend(s); rend(t); }
  function planche(quoi) {
    N.planche.innerHTML = `<rect width="360" height="450" fill="#FFF3DF"/>`;
    att(N.planche, "opacity", 1);
    if (quoi === "mains") {
      N.planche.innerHTML += [0, 1, 2, 3].map((p, i) => `<g transform="translate(${50 + i * 88} 120) scale(3)">${main(p, false)}</g><g transform="translate(${50 + i * 88} 320) scale(3)">${main(p, true)}</g>`).join("") + ["détendue", "poing", "pouce levé", "écartée"].map((l, i) => `<text x="${50 + i * 88}" y="210" text-anchor="middle" font-family="Andika" font-size="13" fill="#3A2A1A">${l}</text>`).join("");
      return;
    }
    const cas = [["face", 0, "sourire"], ["¾ gauche", -1, "sourire"], ["¾ droit", 1, "sourire"], ["joie", 0, "joie"], ["surprise", 0, "surprise"], ["concentration", 0, "concentration"], ["étourdi", 0, "etourdi"], ["clin d'œil", 0, "joie"], ["joues pleines", 0, "pleines"]];
    prepare(construitBut("jongle"));
    cas.forEach(([libelle, vue, emo], i) => {
      const p = { ...REPOS, vue, etourdi: emo === "etourdi" ? 1 : 0, clin: libelle === "clin d'œil" ? 1 : 0, joues: emo === "pleines" ? 1.3 : 0 };
      dessineTete(p, .3, { emo, prec: emo, u: 1 }, 0, EMOS[emo].pup);
      const c = N.tete.cloneNode(true); c.removeAttribute("id"); c.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));
      const x = 62 + (i % 3) * 118, y = 70 + Math.floor(i / 3) * 140;
      tr(c, `translate(${x} ${y}) scale(1.05)`); N.planche.append(c);
      const txt = document.createElementNS(NS, "text"); att(txt, "x", x); att(txt, "y", y + 64); att(txt, "text-anchor", "middle"); att(txt, "font-family", "Andika"); att(txt, "font-size", "12"); att(txt, "fill", "#3A2A1A"); txt.textContent = libelle; N.planche.append(txt);
    });
  }
  const polices = document.fonts && document.fonts.load ? document.fonts.load("800 56px 'Baloo 2'") : Promise.resolve();
  Promise.race([polices, new Promise((r) => setTimeout(r, 1500))]).finally(() => {
    const a = params.get("anim"), t = params.get("t"), pl = params.get("planche");
    if (pl) { planche(pl); return; }
    const nouvelle = a === "echec" ? construitEchec() : construitBut(CELEBRATIONS[a] ? a : auHasard());
    if (t !== null) rendStatique(nouvelle, Number(t)); else lance(nouvelle);
  });
})();
