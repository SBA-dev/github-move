<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #C2341B; --foncee: #931F0C; --or: #FFC93C; --encre: #4A2418; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #2a120a; }
  body { font-family: "Andika", system-ui, sans-serif; color: var(--encre); display: flex; justify-content: center; padding: 10px 0; }
  .telephone { width: 100%; max-width: 370px; height: 680px; border-radius: 28px; overflow: hidden; background: linear-gradient(#FFC9A8, #FFF0D9); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .scene { position: relative; width: 100%; aspect-ratio: 360 / 450; flex: none; touch-action: manipulation; cursor: pointer; outline: none; }
  .scene:focus-visible { box-shadow: inset 0 0 0 4px var(--or); }
  .scene svg, .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { pointer-events: none; }
  .bandeau { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 6px 14px 10px; text-align: center; }
  .titre { margin: 0; min-height: 36px; font-family: "Baloo 2", "Andika", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--foncee); opacity: 0; transform: translateY(12px); }
  .sous { margin: 0; min-height: 20px; font-size: 14px; line-height: 1.3; color: #6B4A3C; opacity: 0; transform: translateY(8px); }
  .boutons { display: flex; gap: 10px; margin-top: 6px; }
  .btn { min-height: 48px; padding: 8px 20px; border: 0; border-radius: 999px; font: 700 17px "Baloo 2", "Andika", sans-serif; cursor: pointer; transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .btn:active { transform: translateY(3px); }
  .btn:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  .principal { background: var(--principale); color: #fff; box-shadow: 0 4px 0 var(--foncee); }
  .principal:active { box-shadow: 0 1px 0 var(--foncee); }
  .secondaire { background: #fff; color: var(--foncee); box-shadow: 0 4px 0 #EACBB8; }
  .secondaire:active { box-shadow: 0 1px 0 #EACBB8; }
  .petits { display: flex; gap: 8px; margin-top: 6px; }
  .petit { min-height: 44px; min-width: 44px; padding: 6px 12px; border: 2px solid #EACBB8; border-radius: 12px; background: #fff; color: #6B4A3C; font: 700 13px "Andika", sans-serif; cursor: pointer; }
  .petit[aria-pressed="true"] { border-color: var(--principale); color: var(--principale); background: #FFE9DD; }
  .petit:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .nuage { animation: derive 90s linear infinite; }
  .nuage.lent { animation-duration: 130s; }
  @keyframes derive { from { transform: translateX(0); } to { transform: translateX(-440px); } }
  @media (prefers-reduced-motion: reduce) { .nuage { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const mouvementsReduits = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CONTOUR = "#33304A", PEAU = "#f3c9a5", PEAU_OMBRE = "#E3AC84", PEAU_LUMIERE = "#FFE9D2", ROUSSEUR = "#D9956A", CHEVEUX = "#a8461c", CHEVEUX_OMBRE = "#7E3212", CHEVEUX_LUMIERE = "#D0693A",
    VESTE = "#d23a2a", VESTE_OMBRE = "#A82A1C", VESTE_LUMIERE = "#F0675A", BANDE = "#FFD84A", PANTALON = "#C2341B", PANTALON_OMBRE = "#931F0C", PANTALON_LUMIERE = "#E25A42",
    CASQ = "#D23A2A", CASQ_OMBRE = "#A82A1C", CASQ_LUMIERE = "#F0675A", VISIERE = "#2B2B3A", CHAUSSURE = "#2B2B3A", CHAUSSURE_OMBRE = "#1B1B28", OR = "#FFC93C",
    GANT = "#FFF3C4", GANT_OMBRE = "#E5CB8A", EAU = "#4FB3FF", EAU_CLAIR = "#BFE6FF", OEIL = "#3E8E5C";
  const DEG = Math.PI / 180;

  // ---------- Courbes (moteur de Coach Léo) ----------
  const E = {
    lineaire: (u) => u,
    sortie: (u) => 1 - Math.pow(1 - u, 3),
    entree: (u) => u * u * u,
    douce: (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
    retour: (u) => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
    rebond: (u) => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  };
  const lerp = (a, b, u) => a + (b - a) * u, clamp01 = (u) => Math.max(0, Math.min(1, u));
  const fenetre = (t, debut, duree, e = E.sortie) => e(clamp01((t - debut) / duree));
  const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
  const tr = (el, v) => el.setAttribute("transform", v);
  const att = (el, a, v) => el.setAttribute(a, v);
  const BASE = 1.15, SOL = 382, Y_SOL = SOL - 58 * BASE;   // origine du personnage aux hanches, pieds 58 unités plus bas (comme Léo)

  // ---------- Géométrie des membres : une seule courbe souple par membre (Léo) ----------
  const quad = (S, C, W, t) => ({ x: (1 - t) ** 2 * S.x + 2 * t * (1 - t) * C.x + t * t * W.x, y: (1 - t) ** 2 * S.y + 2 * t * (1 - t) * C.y + t * t * W.y });
  function membre(S, a1, a2, L1, L2) {
    const E1 = { x: S.x - Math.sin(a1 * DEG) * L1, y: S.y + Math.cos(a1 * DEG) * L1 };
    const W = { x: E1.x - Math.sin((a1 + a2) * DEG) * L2, y: E1.y + Math.cos((a1 + a2) * DEG) * L2 };
    const C = { x: 2 * E1.x - (S.x + W.x) / 2, y: 2 * E1.y - (S.y + W.y) / 2 };
    const dir = Math.atan2(W.x - E1.x, -(W.y - E1.y)) / DEG;
    return { S, E: E1, W, C, dir };
  }
  function trace(m, t0, t1, pas = 8) { let d = ""; for (let i = 0; i <= pas; i++) { const p = quad(m.S, m.C, m.W, lerp(t0, t1, i / pas)); d += `${i ? "L" : "M"}${r1(p.x)} ${r1(p.y)}`; } return d; }
  const decale = (m, nx, ny) => ({ ...m, S: { x: m.S.x + nx, y: m.S.y + ny }, C: { x: m.C.x + nx, y: m.C.y + ny }, W: { x: m.W.x + nx, y: m.W.y + ny } });
  const ligne = (classe, couleur, largeur, extra = "") => `<path class="${classe}" fill="none" stroke="${couleur}" stroke-width="${largeur}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  // angles de Léo (a1, a2) qui amènent l'extrémité d'un membre à une cible : sert aux pédales, au guidon et à quelques gestes précis
  function anglesVers(S, T, L1, L2, cote) {
    const dx = T.x - S.x, dy = T.y - S.y, D = Math.hypot(dx, dy) || .001, Dc = Math.max(Math.abs(L1 - L2) + 1, Math.min((L1 + L2) * .985, D)), ux = dx / D, uy = dy / D;
    const a = (L1 * L1 - L2 * L2 + Dc * Dc) / (2 * Dc), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const Ex = S.x + ux * a + uy * h * cote, Ey = S.y + uy * a - ux * h * cote, Wx = S.x + ux * Dc, Wy = S.y + uy * Dc;
    const a1 = Math.atan2(-(Ex - S.x), Ey - S.y) / DEG; let a2 = Math.atan2(-(Wx - Ex), Wy - Ey) / DEG - a1;
    while (a2 > 180) a2 -= 360; while (a2 < -180) a2 += 360;
    return { a1, a2 };
  }
  const EPAULE = (c) => ({ x: c === "g" ? -18 : 18, y: -38 }), HANCHE = (c) => ({ x: c === "g" ? -10 : 10, y: 4 });
  // bras vers une cible (repère du buste) : coude vers l'extérieur et le bas
  function brasVers(c, T) {
    const S = EPAULE(c), side = c === "g" ? -1 : 1, dx = T.x - S.x, dy = T.y - S.y, D = Math.hypot(dx, dy) || 1, nx = dy / D, ny = -dx / D;
    const cote = Math.sign(nx * side + ny * .55) || side, r = anglesVers(S, T, 24, 22, cote);
    return c === "g" ? { aGu: r.a1, aGl: r.a2 } : { aDu: r.a1, aDl: r.a2 };
  }
  const mains = (g, d) => ({ ...(g ? brasVers("g", { x: g[0], y: g[1] }) : {}), ...(d ? brasVers("d", { x: d[0], y: d[1] }) : {}) });

  // ---------- Mains à cinq doigts (Léo), peau ou gant blanc ----------
  function doigtForme(x, y0, a, L, b = 2.7, tp = 1.9) {
    const dx = Math.sin(a * DEG), dy = -Math.cos(a * DEG), nx = -dy, ny = dx;
    const tx = x + dx * L, ty = y0 + dy * L, mx = (x + tx) / 2 + nx * .7, my = (y0 + ty) / 2 + ny * .7, mw = (b + tp) / 2;
    return `M${r1(x + nx * b)} ${r1(y0 + ny * b)} Q${r1(mx + nx * mw)} ${r1(my + ny * mw)} ${r1(tx + nx * tp)} ${r1(ty + ny * tp)} A${tp} ${tp} 0 0 0 ${r1(tx - nx * tp)} ${r1(ty - ny * tp)} Q${r1(mx - nx * mw)} ${r1(my - ny * mw)} ${r1(x - nx * b)} ${r1(y0 - ny * b)} Z`;
  }
  function main(pose, miroir, peau = PEAU, ombre = PEAU_OMBRE) {
    const m = miroir ? -1 : 1, doigts = [-6.3, -2.1, 2.1, 6.3], angles = pose === 3 ? [-26, -9, 9, 26] : [-9, -3, 3, 9];
    const paume = `M-8 9 V-3 Q-8 -8 -3 -8 H3 Q8 -8 8 -3 V9 Q0 12 -8 9 Z`, paumePoing = `M-8 8 V-2 Q-8 -9 0 -9 Q8 -9 8 -2 V8 Q0 12 -8 8 Z`;

    const b = anim.bulles.find((q) => t >= q.t && t < q.t + .75);
    if (!b) { att(N.bulle, "opacity", 0); return; }
    const u = fenetre(t, b.t, .22, E.rebond), f = 1 - fenetre(t, b.t + .55, .2, E.entree), txt = N.bulle.querySelector("text");
    if (txt.textContent !== b.texte) txt.textContent = b.texte;
    att(N.bulle, "opacity", r2(f)); tr(N.bulle, `translate(${r1(Math.max(52, Math.min(308, p.x + b.dx)))} ${r1(p.y + b.dy - 6 * u)}) scale(${r2(u)})`);
  }
  function dessineCri(anim, t) {
    if (anim.tCri === null) { att(N.cri, "opacity", 0); att(N.rayons, "opacity", 0); return; }
    const u = fenetre(t, anim.tCri, .5, E.rebond), repli = fenetre(t, anim.tTitre - .2, .5, E.douce);
    att(N.cri, "opacity", r2(fenetre(t, anim.tCri, .12)));
    tr(N.cri, `translate(0 ${r1(lerp(0, -14, repli))}) rotate(${r1(lerp(-8, 0, u))}) scale(${r2((0.2 + .8 * u) * lerp(1, .82, repli))})`);
    const r = fenetre(t, anim.tCri, .55);
    att(N.rayons, "opacity", r2((1 - fenetre(t, anim.tCri + .25, .35, E.entree)) * fenetre(t, anim.tCri, .08))); tr(N.rayons, `scale(${r2(.6 + r * .9)}) rotate(${r1(r * 25)})`);
  }
  function dessineEtoiles(anim, t, p) {
    const d = anim.tJoie;
    if (d === null || t < d || t > d + 1) { att(N.etoiles, "opacity", 0); return; }
    att(N.etoiles, "opacity", 1);
    const cx = p.x, cy = p.y - 100 * BASE;
    [...N.etoiles.children].forEach((e, i) => { const u = fenetre(t, d + i * .1, .7), k = Math.sin(Math.min(1, u) * Math.PI), a = -2.4 + i * 1.1; tr(e, `translate(${r1(cx + Math.cos(a) * (44 + u * 22))} ${r1(cy + Math.sin(a) * (28 + u * 14))}) rotate(${r1(u * 120)}) scale(${r2(k * 1.4)})`); });
  }
  function dessineEtincelles(anim, t, p) {
    const d = anim.tPouce;
    if (d === null || t < d || t > d + 1) { att(N.etincelles, "opacity", 0); return; }
    att(N.etincelles, "opacity", 1);
    const base = { x: p.x - 46 * BASE, y: p.y - 84 * BASE };
    [...N.etincelles.children].forEach((e, i) => { const u = fenetre(t, d + i * .08, .6), a = -1.2 + i * 1.3, k = Math.sin(Math.min(1, u) * Math.PI); tr(e, `translate(${r1(base.x + Math.cos(a) * (12 + u * 20))} ${r1(base.y + Math.sin(a) * (12 + u * 16) - u * 6)}) rotate(${r1(u * 90)}) scale(${r2(k * 2.6)})`); });
  }
  function dessineTextes(anim, t) {
    const u = fenetre(t, anim.tTitre, .45), v = fenetre(t, anim.tTitre + .2, .4);
    N.titre.textContent = anim.titre; N.sous.textContent = anim.sous;
    N.titre.style.opacity = u; N.titre.style.transform = `translateY(${r1(12 * (1 - u))}px) scale(${r2(.94 + .06 * u)})`;
    N.sous.style.opacity = v; N.sous.style.transform = `translateY(${r1(8 * (1 - v))}px)`;
  }

  // ---------- Confettis ----------
  const canvas = $("confettis"), ctx = canvas.getContext("2d");
  const COULEURS = ["#C2341B", "#FFC93C", "#FFFFFF", "#F0675A", "#4FB3FF"];
  let confettis = [];
  function semeConfettis(actifs) {
    confettis = [];
    if (!actifs) return;
    for (let i = 0; i < 70; i++) {
      const ang = -Math.PI / 2 + (Math.random() - .5) * 2.4, vv = 240 + Math.random() * 280, origine = i % 2 ? { x: 40, y: 300 } : { x: 320, y: 300 };
      confettis.push({ x: origine.x + (Math.random() - .5) * 10, y: origine.y, vx: Math.cos(ang) * vv * .9 + (i % 2 ? 60 : -60) + (Math.random() - .5) * 160, vy: Math.sin(ang) * vv,
        w: 5 + Math.random() * 4, h: 3 + Math.random() * 3, rot: Math.random() * Math.PI, vrot: (Math.random() - .5) * 10, phase: Math.random() * 6.3, sol: 330 + Math.random() * 115, couleur: COULEURS[i % COULEURS.length], pose: false });
    }
  }
  function avanceConfettis(dt) {
    for (const c of confettis) {
      if (c.pose) continue;
      c.vy += 760 * dt; c.vx *= 1 - 2.4 * dt; c.vy *= 1 - 1.6 * dt;
      c.x += c.vx * dt + Math.sin(c.phase + c.y * .05) * 22 * dt; c.y += c.vy * dt; c.rot += c.vrot * dt; c.phase += dt * 9;
      if (c.y >= c.sol) { c.y = c.sol; c.pose = true; }
    }
  }
  function dessineConfettis() {
    const largeur = canvas.clientWidth, dpr = Math.min(2, devicePixelRatio || 1);
    if (canvas.width !== Math.round(largeur * dpr)) { canvas.width = Math.round(largeur * dpr); canvas.height = Math.round(largeur * 450 / 360 * dpr); }
    ctx.setTransform(canvas.width / 360, 0, 0, canvas.width / 360, 0, 0); ctx.clearRect(0, 0, 360, 450);
    for (const c of confettis) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      const repli = c.pose ? .55 : Math.abs(Math.cos(c.phase));
      ctx.fillStyle = c.couleur; ctx.globalAlpha = c.pose ? .85 : 1; ctx.fillRect(-c.w / 2, -c.h * repli / 2, c.w, Math.max(1.2, c.h * repli)); ctx.restore();
    }
  }

  // ---------- Horloge et commandes ----------
  let anim = null, depart = 0, tPrecedent = 0, enCours = false, image = 0;
  function rend(t) {
    const p = dessineSam(anim, t);
    const haut = Math.min(150, Math.max(0, Y_SOL - p.y - 50)); att(N.leo.ownerSVGElement, "viewBox", `0 ${r1(-haut)} 360 450`);
    dessineTuyau(anim, t, p); dessineJet(anim, t, p); dessineCible(anim, t); dessinePluie(anim, t, p); dessineArcEnCiel(anim, t); dessineEchelle(anim, t); dessineCloche(anim, t, p); dessineBulle(anim, t, p);
    dessineCri(anim, t); dessineEtoiles(anim, t, p); dessineEtincelles(anim, t, p); dessineTextes(anim, t); dessineConfettis();
  }
  const tConfettis = () => (anim.tPetales === undefined ? Infinity : anim.tPetales);
  function boucle(maintenant) {
    const t = Math.min(anim.fin, (maintenant - depart) / 1000);
    if (t >= tConfettis()) avanceConfettis(Math.min(.05, t - Math.max(tPrecedent, tConfettis())));
    tPrecedent = t; rend(t);
    if (t >= anim.fin) { termine(); return; }
    image = requestAnimationFrame(boucle);
  }
  function termine() { enCours = false; cancelAnimationFrame(image); N.annonce.textContent = ""; requestAnimationFrame(() => { N.annonce.textContent = anim.genre === "but" ? "Mission réussie ! " + anim.titre : anim.titre; }); }
  function etatFinal() { for (let i = 0; i < 700; i++) avanceConfettis(1 / 60); tPrecedent = anim.fin; rend(anim.fin); termine(); }
  function prepare(nouvelle) {
    anim = nouvelle; semeConfettis(anim.genre === "but");
    document.querySelectorAll(".petit").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.celebration === anim.celebration)));
    N.scene.setAttribute("aria-label", anim.genre === "but" ? "Capitaine Sam vise la cible avec sa lance, le jet touche le centre et il fête le chapitre réussi. Touche la scène pour passer la fête." : "Le tuyau gigote et asperge Capitaine Sam. Il rit et lève le pouce : on réessaie. Touche la scène pour passer l'animation.");
  }
  function lance(nouvelle) { cancelAnimationFrame(image); prepare(nouvelle); if (mouvementsReduits) { etatFinal(); return; } enCours = true; depart = performance.now(); tPrecedent = 0; rend(0); image = requestAnimationFrame(boucle); }
  const auHasard = () => ["arc", "echelle", "cloche"][Math.floor(Math.random() * 3)];
  $("marquer").addEventListener("click", () => lance(construitBut(auHasard())));
  $("rater").addEventListener("click", () => lance(construitEchec()));
  document.querySelectorAll(".petit").forEach((b) => b.addEventListener("click", () => lance(construitBut(b.dataset.celebration))));
  const passe = () => { if (enCours) etatFinal(); };
  N.scene.addEventListener("pointerdown", passe);
  N.scene.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); passe(); } });

  // Mise au point : « ?anim=arc|echelle|cloche|echec&t=1.2 » rend l'image fixe ; « ?planche=mains » ou « ?planche=tetes » montre une planche.
  const params = new URLSearchParams(location.search);
  function rendStatique(nouvelle, t) { prepare(nouvelle); for (let s = tConfettis(); s < t; s += 1 / 60) avanceConfettis(1 / 60); rend(t); }
  function planche(quoi) {
    N.planche.innerHTML = `<rect width="360" height="450" fill="#FFF0D9"/>`;
    att(N.planche, "opacity", 1);
    if (quoi === "mains") {
      N.planche.innerHTML += [0, 1, 2, 3].map((p, i) => `<g transform="translate(${50 + i * 88} 110) scale(3)">${main(p, false)}</g><g transform="translate(${50 + i * 88} 290) scale(3)">${main(p, true)}</g><g transform="translate(${50 + i * 88} 410) scale(2)">${main(p, false, GANT, GANT_OMBRE)}</g>`).join("") + ["détendue", "poing", "pouce levé", "écartée"].map((l, i) => `<text x="${50 + i * 88}" y="200" text-anchor="middle" font-family="Andika" font-size="13" fill="#4A2418">${l}</text>`).join("");
      return;
    }
    const cas = [["face", 0, "sourire", 1], ["¾ gauche", -VUE, "sourire", 1], ["¾ droit", VUE, "sourire", 1], ["joie", 0, "joie", 1], ["surprise", 0, "surprise", 1], ["concentration", 0, "concentration", 1], ["clin d'œil", 0, "joie", 1, 1], ["hum ?", 0, "hum", 1], ["sans casque", 0, "sourire", 0]];
    prepare(construitBut("cloche"));
    cas.forEach(([libelle, vue, emo, casq, clin = 0], i) => {
      const p = { ...REPOS, vue, casq, clin };
      dessineTete(p, 0, { emo, prec: emo, u: 1 }, 0, 1);
      const c = N["tete-forme"].cloneNode(true); c.removeAttribute("id"); c.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));
      const x = 60 + (i % 3) * 120, y = 66 + Math.floor(i / 3) * 145;
      tr(c, `translate(${x} ${y}) scale(1.3) scale(.7)`); N.planche.append(c);
      const txt = document.createElementNS(NS, "text"); att(txt, "x", x); att(txt, "y", y + 56); att(txt, "text-anchor", "middle"); att(txt, "font-family", "Andika"); att(txt, "font-size", "12"); att(txt, "fill", "#4A2418"); txt.textContent = libelle; N.planche.append(txt);
    });
  }
  const polices = document.fonts && document.fonts.load ? document.fonts.load("800 40px 'Baloo 2'") : Promise.resolve();
  Promise.race([polices, new Promise((r) => setTimeout(r, 1500))]).finally(() => {
    const a = params.get("anim"), t = params.get("t"), pl = params.get("planche");
    if (pl) { planche(pl); return; }
    const nouvelle = a === "echec" ? construitEchec() : construitBut(CELEBRATIONS[a] ? a : auHasard());
    if (t !== null) rendStatique(nouvelle, Number(t)); else lance(nouvelle);
  });
})();
</script>
