<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savanturier : Capitaine Sam, dessin animé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #C2341B; --foncee: #931F0C; --or: #FFC93C; --encre: #3A2219; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #2A1A16; }
  body { font-family: "Andika", system-ui, sans-serif; color: var(--encre); display: flex; justify-content: center; padding: 10px 0; }
  .telephone { width: 100%; max-width: 370px; height: 680px; border-radius: 28px; overflow: hidden; background: linear-gradient(#FFC9A8, #FFF0D9); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .scene { position: relative; width: 100%; aspect-ratio: 360 / 450; flex: none; touch-action: manipulation; cursor: pointer; outline: none; }
  .scene:focus-visible { box-shadow: inset 0 0 0 4px var(--or); }
  .scene svg, .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { pointer-events: none; }
  .bandeau { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 6px 14px 10px; text-align: center; }
  .titre { margin: 0; min-height: 36px; font-family: "Baloo 2", "Andika", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--foncee); opacity: 0; transform: translateY(12px); }
  .sous { margin: 0; min-height: 20px; font-size: 14px; line-height: 1.3; color: #6B3B28; opacity: 0; transform: translateY(8px); }
  .boutons { display: flex; gap: 10px; margin-top: 6px; }
  .btn { min-height: 48px; padding: 8px 20px; border: 0; border-radius: 999px; font: 700 17px "Baloo 2", "Andika", sans-serif; cursor: pointer; transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .btn:active { transform: translateY(3px); }
  .btn:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  .principal { background: var(--principale); color: #fff; box-shadow: 0 4px 0 var(--foncee); }
  .principal:active { box-shadow: 0 1px 0 var(--foncee); }
  .petits { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .petit { min-height: 44px; min-width: 44px; padding: 6px 12px; border: 2px solid #EBC3AE; border-radius: 12px; background: #fff; color: #6B3B28; font: 700 13px "Andika", sans-serif; cursor: pointer; }
  .petit[aria-pressed="true"] { border-color: var(--principale); color: var(--principale); background: #FFEDE4; }
  .petit:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .nuage { animation: derive 90s linear infinite; }
  .nuage.lent { animation-duration: 130s; }
  @keyframes derive { from { transform: translateX(0); } to { transform: translateX(-440px); } }
  @media (prefers-reduced-motion: reduce) { .nuage { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<div class="telephone">
  <div class="scene" id="scene" tabindex="0" role="img" aria-label="Capitaine Sam arrose le jardin de la caserne. Touche la scène pour passer l'animation.">
    <svg viewBox="0 0 360 450" aria-hidden="true" id="svg">
      <defs>
        <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC9A8"/><stop offset="1" stop-color="#FFF0D9"/></linearGradient>
        <linearGradient id="cour" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7E4C6"/><stop offset="1" stop-color="#EED3AE"/></linearGradient>
        <linearGradient id="herbe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9AD48A"/><stop offset="1" stop-color="#74BC6C"/></linearGradient>

        <clipPath id="clip-bouche"><path d="M-11 11 Q0 27 11 11 Z"/></clipPath>

        <path class="nuage lent" d="M430 150 q-4 -12 10 -12 q5 -9 15 -5 q11 -4 14 7 q9 2 5 10 Z" opacity=".9"/>
      </g>

      <!-- collines douces -->

      <path d="M0 268 C70 250 150 258 220 254 C290 250 330 244 360 254 V450 H0 Z" fill="#F2C08F"/>
      <!-- arbre -->
      <g stroke="#33304A" stroke-width="2.5" stroke-linejoin="round">
        <rect x="318" y="262" width="9" height="40" rx="3" fill="#8A5A34"/>
        <g fill="#6FBF6A"><circle cx="322" cy="246" r="26"/><circle cx="304" cy="262" r="15"/><circle cx="340" cy="262" r="15"/></g>
      </g>

      <!-- la Caserne des Savanturiers : bâtiment rouge et crème, sans texte -->
      <g id="caserne" stroke="#33304A" stroke-width="2.6" stroke-linejoin="round">

        <path d="M136 152 V124 Q136 106 152 106 Q168 106 168 124 V152 Z" fill="#FFF0D9"/>
        <rect x="56" y="166" width="192" height="134" fill="#C2341B"/>
        <path d="M200 172 H246 V298 H226 Q232 230 200 172 Z" fill="#A82A16" stroke="none"/>
        <rect x="50" y="160" width="204" height="12" rx="4" fill="#FFF0D9"/>
        <g fill="#CFEBFF"><rect x="66" y="192" width="28" height="32" rx="4" stroke-width="3" stroke="#33304A"/><rect x="210" y="192" width="28" height="32" rx="4" stroke-width="3"/></g>
        <g fill="none" stroke="#FFF0D9" stroke-width="2.4"><path d="M80 194 V222 M68 208 H92 M224 194 V222 M212 208 H236"/></g>
        <path d="M64 230 H96 M208 230 H240" stroke="#FFF0D9" stroke-width="4" stroke-linecap="round"/>
        <rect x="98" y="198" width="108" height="102" rx="6" fill="#931F0C"/>
        <rect x="104" y="204" width="96" height="96" rx="4" fill="#FFF0D9"/>
        <g fill="none" stroke="#E2C9A6" stroke-width="2"><path d="M106 244 H198 M106 262 H198 M106 280 H198"/></g>
        <g fill="#CFEBFF" stroke-width="2.4"><circle cx="128" cy="224" r="8"/><circle cx="152" cy="224" r="8"/><circle cx="176" cy="224" r="8"/></g>
        <g fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".9"><path d="M124 221 Q126 218 129 218 M148 221 Q150 218 153 218 M172 221 Q174 218 177 218"/></g>
      </g>
      <!-- la cloche dorée et sa corde -->
      <path id="corde" fill="none" stroke="#33304A" stroke-width="5" stroke-linecap="round"/>
      <path id="corde-in" fill="none" stroke="#E7C58C" stroke-width="2.6" stroke-linecap="round"/>
      <g id="pompon"><circle r="5" fill="#FFC93C" stroke="#33304A" stroke-width="2.2"/><path d="M-3 4 L-4 11 M0 5 V12 M3 4 L4 11" stroke="#33304A" stroke-width="2.6" stroke-linecap="round"/><path d="M-3 4 L-4 11 M0 5 V12 M3 4 L4 11" stroke="#FFC93C" stroke-width="1.2" stroke-linecap="round"/></g>
      <g id="cloche"></g>
      <!-- cour, herbe, jardin -->
      <path d="M0 298 H360 V450 H0 Z" fill="url(#cour)"/>
      <path d="M0 298 H360" stroke="#E2C29A" stroke-width="2.4"/>
      <g stroke="#E8CFAA" stroke-width="1.4" opacity=".8"><path d="M0 330 H360 M0 362 H230 M40 298 V330 M120 298 V330 M200 298 V330 M280 298 V330 M80 330 V362 M160 330 V362"/></g>
      <path d="M0 412 C70 404 150 408 220 404 C290 400 330 404 360 402 V450 H0 Z" fill="url(#herbe)" stroke="#5E9F58" stroke-width="2"/>
      <g fill="none" stroke="#5E9F58" stroke-width="2" stroke-linecap="round"><path d="M30 430 l3 -7 l3 7 M110 438 l3 -7 l3 7 M200 432 l3 -7 l3 7 M290 440 l3 -7 l3 7"/></g>
      <g id="parterre" stroke="#33304A" stroke-linejoin="round">
        <path d="M232 380 Q232 364 250 364 H340 Q356 364 356 380 Q356 396 340 396 H250 Q232 396 232 380 Z" fill="#9A6440" stroke-width="2.6"/>
        <path d="M240 372 Q248 368 260 368 H332 Q346 368 350 374" fill="none" stroke="#B9835A" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g id="fleurs"></g>
      <!-- dévidoir, tuyau, lance au sol, jet -->
      <g id="devidoir"></g>
      <path id="tuyau-contour" fill="none" stroke="#33304A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="tuyau" fill="none" stroke="#EFE3C6" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="tuyau-ombre" fill="none" stroke="#D2C29C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse id="ombre-sol" cx="132" cy="384" rx="34" ry="8" fill="#8A5A3A" opacity=".22"/>
      <g id="lance-sol" opacity="0"></g>
      <g id="jet">
        <path class="jet-contour" fill="none" stroke="#3C8DDA" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="jet-eau" fill="none" stroke="#BDE8FF" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>

        <g class="gouttes" fill="#E6F7FF" stroke="#3C8DDA" stroke-width="1.2"></g>

      <g id="leo"></g>

      <g id="bulle-1" opacity="0"><rect x="-32" y="-16" width="64" height="30" rx="14" fill="#FFFFFF" stroke="#33304A" stroke-width="2.6"/><text y="6" text-anchor="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="17" fill="#931F0C"></text></g>
      <g id="etoiles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.8" stroke-linejoin="round"></g>
      <g id="etincelles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.5" stroke-linejoin="round"></g>
      <g transform="translate(180 60)">
        <g id="rayons" opacity="0"></g>
        <g id="cri" opacity="0">
          <text x="3" y="4" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="36" fill="#FFC93C" stroke="#33304A" stroke-width="10" stroke-linejoin="round" paint-order="stroke">Mission accomplie !</text>
          <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="36" fill="#C2341B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mission accomplie !</text>
        </g>

    <canvas id="petales" aria-hidden="true"></canvas>
  </div>
  <div class="bandeau">
    <p class="titre" id="titre"></p>
    <p class="sous" id="sous"></p>
    <div class="boutons">
      <button class="btn principal" id="reussir" type="button">Réussir</button>
    </div>
    <div class="petits" role="group" aria-label="Choisir la variante">
      <button class="petit" type="button" data-variante="cloche" aria-pressed="false">A · Cloche</button>
      <button class="petit" type="button" data-variante="arc" aria-pressed="false">B · Arc-en-ciel</button>
      <button class="petit" type="button" data-variante="pluie" aria-pressed="false">C · Pluie</button>
    </div>
  </div>
  <p class="sr-only" id="annonce" aria-live="polite"></p>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const mouvementsReduits = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CONTOUR = "#33304A", PEAU = "#f3c9a5", PEAU_OMBRE = "#E2AE84", PEAU_LUMIERE = "#FFE6CF", CHEVEUX = "#a8461c", CHEVEUX_OMBRE = "#7E3212", CHEVEUX_LUMIERE = "#CC6A3C",
    VESTE = "#d23a2a", VESTE_OMBRE = "#A82818", VESTE_LUMIERE = "#EE6A58", PANTALON = "#26335F", PANTALON_OMBRE = "#192448", PANTALON_LUMIERE = "#3D4E85",
    BANDE = "#F5D33A", ARGENT = "#E9EEF3", CASQ = "#F2C230", CASQ_OMBRE = "#D49E17", CASQ_LUMIERE = "#FFE27A", ECUSSON = "#C2341B",
    BOTTE = "#2B2B3A", CHAUSSURE = "#2B2B3A", CHAUSSURE_OMBRE = "#1B1B28", OR = "#FFC93C", METAL = "#C8D2E6", METAL_OMBRE = "#8E9BBE",
    EAU = "#BDE8FF", EAU_CONTOUR = "#3C8DDA", TUYAU = "#EFE3C6";
  const DEG = Math.PI / 180;

  // ---------- Courbes (moteur de Coach Léo) ----------
  const E = {
    lineaire: (u) => u,
    sortie: (u) => 1 - Math.pow(1 - u, 3),
    entree: (u) => u * u * u,
    douce: (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
    retour: (u) => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
    rebond: (u) => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  };
  const lerp = (a, b, u) => a + (b - a) * u, clamp01 = (u) => Math.max(0, Math.min(1, u));
  const fenetre = (t, debut, duree, e = E.sortie) => e(clamp01((t - debut) / duree));
  const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
  const tr = (el, v) => el.setAttribute("transform", v);
  const att = (el, a, v) => el.setAttribute(a, v);
  const BASE = 1.15, SOL = 382, Y_SOL = SOL - 58 * BASE;   // origine du personnage aux hanches, pieds 58 unités plus bas (comme Léo)
  const alea = (i) => { const s = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return s - Math.floor(s); };   // hasard fixe : même image à chaque rendu

  // ---------- Géométrie des membres : une seule courbe souple par membre (Léo) ----------
  const quad = (S, C, W, t) => ({ x: (1 - t) ** 2 * S.x + 2 * t * (1 - t) * C.x + t * t * W.x, y: (1 - t) ** 2 * S.y + 2 * t * (1 - t) * C.y + t * t * W.y });
  function membre(S, a1, a2, L1, L2) {
    const E1 = { x: S.x - Math.sin(a1 * DEG) * L1, y: S.y + Math.cos(a1 * DEG) * L1 };
    const W = { x: E1.x - Math.sin((a1 + a2) * DEG) * L2, y: E1.y + Math.cos((a1 + a2) * DEG) * L2 };
    const C = { x: 2 * E1.x - (S.x + W.x) / 2, y: 2 * E1.y - (S.y + W.y) / 2 };
    const dir = Math.atan2(W.x - E1.x, -(W.y - E1.y)) / DEG;
    return { S, E: E1, W, C, dir };
  }
  function trace(m, t0, t1, pas = 8) { let d = ""; for (let i = 0; i <= pas; i++) { const p = quad(m.S, m.C, m.W, lerp(t0, t1, i / pas)); d += `${i ? "L" : "M"}${r1(p.x)} ${r1(p.y)}`; } return d; }
  const decale = (m, nx, ny) => ({ ...m, S: { x: m.S.x + nx, y: m.S.y + ny }, C: { x: m.C.x + nx, y: m.C.y + ny }, W: { x: m.W.x + nx, y: m.W.y + ny } });
  const ligne = (classe, couleur, largeur, extra = "") => `<path class="${classe}" fill="none" stroke="${couleur}" stroke-width="${largeur}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  // angles de Léo (a1, a2) qui amènent l'extrémité d'un membre à une cible
  function anglesVers(S, T, L1, L2, cote) {
    const dx = T.x - S.x, dy = T.y - S.y, D = Math.hypot(dx, dy) || .001, Dc = Math.max(Math.abs(L1 - L2) + 1, Math.min((L1 + L2) * .985, D)), ux = dx / D, uy = dy / D;
    const a = (L1 * L1 - L2 * L2 + Dc * Dc) / (2 * Dc), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const Ex = S.x + ux * a + uy * h * cote, Ey = S.y + uy * a - ux * h * cote, Wx = S.x + ux * Dc, Wy = S.y + uy * Dc;
    const a1 = Math.atan2(-(Ex - S.x), Ey - S.y) / DEG; let a2 = Math.atan2(-(Wx - Ex), Wy - Ey) / DEG - a1;
    while (a2 > 180) a2 -= 360; while (a2 < -180) a2 += 360;
    return { a1, a2 };
  }
  const EPAULE = (c) => ({ x: c === "g" ? -18 : 18, y: -38 });
  // bras vers une cible (repère du buste) : coude vers l'extérieur et le bas ; S = épaule réelle si on la connaît
  function brasVers(c, T, S = EPAULE(c)) {
    const side = c === "g" ? -1 : 1, dx = T.x - S.x, dy = T.y - S.y, D = Math.hypot(dx, dy) || 1, nx = dy / D, ny = -dx / D;
    const cote = Math.sign(nx * side + ny * .55) || side, r = anglesVers(S, T, 24, 22, cote);
    return c === "g" ? { aGu: r.a1, aGl: r.a2 } : { aDu: r.a1, aDl: r.a2 };
  }
  // la main saisit un objet : le poignet s'arrête un peu avant le point saisi (le poing est au bout de l'avant-bras)
  function brasSaisit(c, T, S) {
    const dx = T.x - S.x, dy = T.y - S.y, D = Math.hypot(dx, dy) || 1, k = Math.max(0, D - 4) / D;
    return brasVers(c, { x: S.x + dx * k, y: S.y + dy * k }, S);
  }

  // ---------- Mains à cinq doigts (Léo), mains nues ----------
  function doigtForme(x, y0, a, L, b = 2.7, tp = 1.9) {
    const dx = Math.sin(a * DEG), dy = -Math.cos(a * DEG), nx = -dy, ny = dx;
    const tx = x + dx * L, ty = y0 + dy * L, mx = (x + tx) / 2 + nx * .7, my = (y0 + ty) / 2 + ny * .7, mw = (b + tp) / 2;
    return `M${r1(x + nx * b)} ${r1(y0 + ny * b)} Q${r1(mx + nx * mw)} ${r1(my + ny * mw)} ${r1(tx + nx * tp)} ${r1(ty + ny * tp)} A${tp} ${tp} 0 0 0 ${r1(tx - nx * tp)} ${r1(ty - ny * tp)} Q${r1(mx - nx * mw)} ${r1(my - ny * mw)} ${r1(x - nx * b)} ${r1(y0 - ny * b)} Z`;
  }
  function main(pose, miroir, peau = PEAU, ombre = PEAU_OMBRE) {
    const m = miroir ? -1 : 1, doigts = [-6.3, -2.1, 2.1, 6.3], angles = pose === 3 ? [-26, -9, 9, 26] : [-9, -3, 3, 9];
    const paume = `M-8 9 V-3 Q-8 -8 -3 -8 H3 Q8 -8 8 -3 V9 Q0 12 -8 9 Z`, paumePoing = `M-8 8 V-2 Q-8 -9 0 -9 Q8 -9 8 -2 V8 Q0 12 -8 8 Z`;
    const forme = (d, w) => `<path d="${d}" fill="none" stroke="${CONTOUR}" stroke-width="${w}" stroke-linejoin="round"/>`;
    let contours = "", remplissages = "";
    if (pose === 0 || pose === 3) {
      const formes = doigts.map((x, i) => doigtForme(x, -6, angles[i] * m, 10.5 - Math.abs(i - 1.5) * .8)), pouce = doigtForme(-7 * m, 0, -52 * m, 9, 2.6, 1.9);
      formes.concat(pouce).forEach((d) => (contours += forme(d, 5.2)));
      remplissages += formes.concat(pouce).map((d) => `<path d="${d}" fill="${peau}"/>`).join("");
      remplissages += doigts.map((x, i) => { const a = angles[i] * m * DEG; return `<path d="M${r1(x + Math.sin(a) * 3)} ${r1(-6 - Math.cos(a) * 3)} l${r1(Math.sin(a) * 4)} ${r1(-Math.cos(a) * 4)}" fill="none" stroke="${ombre}" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>`; }).join("");
      return `${contours}${forme(paume, 5.6)}<path d="${paume}" fill="${peau}"/>${remplissages}<path d="M3 8 Q7 4 7 -1" fill="none" stroke="${ombre}" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    const pouce = pose === 2 ? doigtForme(-5 * m, -4, -10 * m, 13, 2.8, 2.1) : null;

    att(N.rayons, "opacity", r2((1 - fenetre(t, anim.tCri + .25, .35, E.entree)) * fenetre(t, anim.tCri, .08))); tr(N.rayons, `scale(${r2(.6 + r * .9)})`);
  }
  function dessineEtoiles(anim, t, p) {
    const d = anim.tJoie;
    if (d === null || t < d || t > d + 1) { att(N.etoiles, "opacity", 0); return; }
    att(N.etoiles, "opacity", 1);
    const cx = p.x, cy = p.yEff - 100 * BASE;
    [...N.etoiles.children].forEach((e, i) => { const u = fenetre(t, d + i * .1, .7), k = Math.sin(Math.min(1, u) * Math.PI), a = -2.4 + i * 1.1; tr(e, `translate(${r1(cx + Math.cos(a) * (44 + u * 22))} ${r1(cy + Math.sin(a) * (28 + u * 14))}) rotate(${r1(u * 120)}) scale(${r2(k * 1.4)})`); });
  }
  function dessineEtincelles(anim, t) {
    const d = anim.tPouce;
    if (d === null || t < d || t > d + 1) { att(N.etincelles, "opacity", 0); return; }
    att(N.etincelles, "opacity", 1);
    const base = monde(BRAS.d.querySelector("#main-d"), 0, -12);
    [...N.etincelles.children].forEach((e, i) => { const u = fenetre(t, d + i * .08, .6), a = -2.4 + i * 1.1, k = Math.sin(Math.min(1, u) * Math.PI); tr(e, `translate(${r1(base.x + Math.cos(a) * (12 + u * 20))} ${r1(base.y + Math.sin(a) * (12 + u * 16) - u * 6)}) rotate(${r1(u * 90)}) scale(${r2(k * 2.6)})`); });
  }
  function dessineTextes(anim, t) {
    const u = fenetre(t, anim.tTitre, .45), v = fenetre(t, anim.tTitre + .2, .4);
    N.titre.textContent = anim.titre; N.sous.textContent = anim.sous;
    N.titre.style.opacity = u; N.titre.style.transform = `translateY(${r1(12 * (1 - u))}px) scale(${r2(.94 + .06 * u)})`;
    N.sous.style.opacity = v; N.sous.style.transform = `translateY(${r1(8 * (1 - v))}px)`;
  }

  // ---------- Les pétales de la caserne (canvas) : pétales, gouttelettes et étincelles à quatre branches ----------
  const canvas = $("petales"), ctx = canvas.getContext("2d");
  const COULEURS_PETALES = ["#FF7FB0", "#A47BFF", "#FFD23F", "#FFFFFF", "#5FA8FF", "#FF9ED0"];
  let petales = [];
  function semePetales(actifs) {
    petales = [];
    if (!actifs) return;
    for (let i = 0; i < 64; i++) {
      const origine = i % 2 ? { x: 296, y: 356 } : { x: 60, y: 330 }, ang = -Math.PI / 2 + (Math.random() - .5) * 2.2, vv = 240 + Math.random() * 260;
      const genre = i % 8 === 3 ? "etincelle" : i % 4 === 1 ? "goutte" : "petale";
      petales.push({ x: origine.x + (Math.random() - .5) * 40, y: origine.y, vx: Math.cos(ang) * vv * .8 + (i % 2 ? -50 : 60) + (Math.random() - .5) * 120, vy: Math.sin(ang) * vv,
        taille: 4 + Math.random() * 2.5, rot: Math.random() * Math.PI, vrot: (Math.random() - .5) * 6, phase: Math.random() * 6.3, sol: 330 + Math.random() * 115, genre, couleur: COULEURS_PETALES[i % COULEURS_PETALES.length], pose: false });
    }
  }
  function avancePetales(dt) {
    for (const c of petales) {
      if (c.pose) continue;
      c.vy += 700 * dt; c.vx *= 1 - 2.4 * dt; c.vy *= 1 - (c.genre === "petale" ? 2.2 : 1.4) * dt;
      c.x += c.vx * dt + Math.sin(c.phase + c.y * .05) * 26 * dt; c.y += c.vy * dt; c.rot += c.vrot * dt; c.phase += dt * 7;
      if (c.y >= c.sol) { c.y = c.sol; c.pose = true; }
    }
  }
  const petalesPoses = () => petales.every((c) => c.pose);
  function dessinePetales(t) {
    if (t < anim.tPetales) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
    const largeur = canvas.clientWidth, dpr = Math.min(2, devicePixelRatio || 1);
    if (canvas.width !== Math.round(largeur * dpr)) { canvas.width = Math.round(largeur * dpr); canvas.height = Math.round(largeur * 450 / 360 * dpr); }
    ctx.setTransform(canvas.width / 360, 0, 0, canvas.width / 360, 0, 0); ctx.clearRect(0, 0, 360, 450);
    ctx.lineJoin = "round";
    for (const c of petales) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.globalAlpha = c.pose ? .9 : 1;
      const s = c.taille, repli = c.pose ? .7 : .45 + .55 * Math.abs(Math.cos(c.phase));
      ctx.strokeStyle = CONTOUR; ctx.lineWidth = 1.2;
      if (c.genre === "petale") { ctx.fillStyle = c.couleur; ctx.beginPath(); ctx.ellipse(0, 0, s, s * .62 * repli, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      else if (c.genre === "goutte") { ctx.fillStyle = EAU; ctx.strokeStyle = EAU_CONTOUR; ctx.rotate(-c.rot); ctx.beginPath(); ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * .75, -s * .1, s * .7, s * .45); ctx.arc(0, s * .45, s * .7, 0, Math.PI); ctx.quadraticCurveTo(-s * .75, -s * .1, 0, -s); ctx.fill(); ctx.stroke(); }
      else { ctx.fillStyle = OR; ctx.beginPath(); const b = s * 1.2, m = s * .35; ctx.moveTo(0, -b); ctx.lineTo(m, -m); ctx.lineTo(b, 0); ctx.lineTo(m, m); ctx.lineTo(0, b); ctx.lineTo(-m, m); ctx.lineTo(-b, 0); ctx.lineTo(-m, -m); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      ctx.restore();
    }
  }

  // ---------- Horloge et commandes ----------
  let anim = null, depart = 0, tPrecedent = 0, enCours = false, image = 0, annonceFaite = false;
  function rend(t) {
    const p = dessineSam(anim, t);
    dessineLanceSol(p); dessineTuyau(p); dessineJet(p, t); dessineFleurs(anim, t); dessineCloche(anim, t, p); dessineArcEnCiel(p); dessinePluie(anim, t, p); dessineEbroue(anim, t, p);
    dessineBulles(anim, t); dessineCri(anim, t); dessineEtoiles(anim, t, p); dessineEtincelles(anim, t); dessineTextes(anim, t); dessinePetales(t);
  }
  function boucle(maintenant) {
    const brut = (maintenant - depart) / 1000, t = Math.min(anim.fin, brut);
    if (brut >= anim.tPetales) avancePetales(Math.min(.05, brut - Math.max(tPrecedent, anim.tPetales)));
    tPrecedent = brut; rend(t);
    if (t >= anim.fin && !annonceFaite) annonce();
    // la scène s'arrête à anim.fin ; les pétales finissent seulement de retomber (une demi-seconde au plus)
    if (t >= anim.fin && (petalesPoses() || brut > anim.fin + 1.2)) { termine(); return; }
    image = requestAnimationFrame(boucle);
  }
  function annonce() { annonceFaite = true; N.annonce.textContent = ""; requestAnimationFrame(() => { N.annonce.textContent = "Défi relevé !"; }); }
  function termine() { enCours = false; cancelAnimationFrame(image); if (!annonceFaite) annonce(); }
  function etatFinal() { for (let i = 0; i < 700; i++) avancePetales(1 / 60); tPrecedent = anim.fin; rend(anim.fin); termine(); }
  const DESCRIPTIONS = {
    cloche: "Capitaine Sam arrose le jardin de la caserne et les fleurs s'ouvrent. Puis il sonne la cloche de la caserne pour faire la fête et saute de joie. Touche la scène pour passer l'animation.",
    arc: "Capitaine Sam arrose le jardin de la caserne et les fleurs s'ouvrent. Puis il dessine un arc-en-ciel avec l'eau et lève le pouce. Touche la scène pour passer l'animation.",
    pluie: "Capitaine Sam arrose le jardin de la caserne et les fleurs s'ouvrent. Puis il fait tomber une petite pluie joyeuse, rit et lève le pouce. Touche la scène pour passer l'animation.",
  };
  function prepare(nouvelle) {
    anim = nouvelle; arrose(anim); annonceFaite = false; semePetales(!mouvementsReduits);
    document.querySelectorAll(".petit").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.variante === anim.variante)));
    N.scene.setAttribute("aria-label", DESCRIPTIONS[anim.variante]);
  }
  function lance(nouvelle) { cancelAnimationFrame(image); prepare(nouvelle); if (mouvementsReduits) { etatFinal(); return; } enCours = true; depart = performance.now(); tPrecedent = 0; rend(0); image = requestAnimationFrame(boucle); }
  const auHasard = () => ["cloche", "arc", "pluie"][Math.floor(Math.random() * 3)];
  $("reussir").addEventListener("click", () => lance(construit(auHasard())));
  document.querySelectorAll(".petit").forEach((b) => b.addEventListener("click", () => lance(construit(b.dataset.variante))));
  const passe = () => { if (enCours) etatFinal(); };
  N.scene.addEventListener("pointerdown", passe);
  N.scene.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); passe(); } });

  // Mise au point : « ?anim=cloche|arc|pluie&t=1.2 » rend l'image fixe ; « ?planche=mains » ou « ?planche=tetes » montre une planche.
  const params = new URLSearchParams(location.search);
  function rendStatique(nouvelle, t) { prepare(nouvelle); for (let s = anim.tPetales; s < t; s += 1 / 60) avancePetales(1 / 60); rend(Math.min(t, anim.fin)); }
  function planche(quoi) {
    N.planche.innerHTML = `<rect width="360" height="450" fill="#FFF0D9"/>`;
    att(N.planche, "opacity", 1);
    if (quoi === "mains") {
      N.planche.innerHTML += [0, 1, 2, 3].map((p, i) => `<g transform="translate(${50 + i * 88} 110) scale(3)">${main(p, false)}</g><g transform="translate(${50 + i * 88} 290) scale(3)">${main(p, true)}</g>`).join("") + ["détendue", "poing", "pouce levé", "écartée"].map((l, i) => `<text x="${50 + i * 88}" y="200" text-anchor="middle" font-family="Andika" font-size="13" fill="#3A2219">${l}</text>`).join("");
      return;
    }
    const cas = [["face", 0, "sourire", 1], ["¾ gauche", -VUE, "sourire", 1], ["¾ droit", VUE, "sourire", 1], ["joie", 0, "joie", 1], ["surprise", 0, "surprise", 1], ["concentration", 0, "concentration", 1], ["clin d'œil", 0, "joie", 1, 1], ["hum ?", 0, "hum", 1], ["sans casque", 0, "sourire", 0]];
    prepare(construit("arc"));
    cas.forEach(([libelle, vue, emo, casq, clin = 0], i) => {
      const p = { ...REPOS, vue, casq, clin };
      dessineTete(p, 0, { emo, prec: emo, u: 1 }, 0, 1);
      const c = N["tete-forme"].cloneNode(true); c.removeAttribute("id"); c.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));
      const x = 60 + (i % 3) * 120, y = 72 + Math.floor(i / 3) * 145;
      tr(c, `translate(${x} ${y}) scale(1.3) scale(.7)`); N.planche.append(c);
      const txt = document.createElementNS(NS, "text"); att(txt, "x", x); att(txt, "y", y + 56); att(txt, "text-anchor", "middle"); att(txt, "font-family", "Andika"); att(txt, "font-size", "12"); att(txt, "fill", "#3A2219"); txt.textContent = libelle; N.planche.append(txt);
    });
  }
  const polices = document.fonts && document.fonts.load ? document.fonts.load("800 40px 'Baloo 2'") : Promise.resolve();
  Promise.race([polices, new Promise((r) => setTimeout(r, 1500))]).finally(() => {
    const a = params.get("anim"), t = params.get("t"), pl = params.get("planche");
    if (pl) { planche(pl); return; }
    const nouvelle = construit(VARIANTES[a] ? a : auHasard());
    if (t !== null) rendStatique(nouvelle, Number(t)); else lance(nouvelle);
  });
})();
</script>
