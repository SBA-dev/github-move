<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savanturier : Coach Léo, dessin animé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #1F63D8; --foncee: #164BA8; --or: #FFC93C; --encre: #1B2A4A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0f1b2d; }
  body { font-family: "Andika", system-ui, sans-serif; color: var(--encre); display: flex; justify-content: center; padding: 10px 0; }
  .telephone { width: 100%; max-width: 370px; height: 680px; border-radius: 28px; overflow: hidden; background: linear-gradient(#BDE3FF, #F0FAFF); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .scene { position: relative; width: 100%; aspect-ratio: 360 / 450; flex: none; touch-action: manipulation; cursor: pointer; outline: none; }
  .scene:focus-visible { box-shadow: inset 0 0 0 4px var(--or); }
  .scene svg, .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { pointer-events: none; }
  .bandeau { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 6px 14px 10px; text-align: center; }
  .titre { margin: 0; min-height: 36px; font-family: "Baloo 2", "Andika", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--foncee); opacity: 0; transform: translateY(12px); }
  .sous { margin: 0; min-height: 20px; font-size: 14px; line-height: 1.3; color: #3C4C6B; opacity: 0; transform: translateY(8px); }
  .boutons { display: flex; gap: 10px; margin-top: 6px; }
  .btn { min-height: 48px; padding: 8px 20px; border: 0; border-radius: 999px; font: 700 17px "Baloo 2", "Andika", sans-serif; cursor: pointer; transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .btn:active { transform: translateY(3px); }
  .btn:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  .principal { background: var(--principale); color: #fff; box-shadow: 0 4px 0 var(--foncee); }
  .principal:active { box-shadow: 0 1px 0 var(--foncee); }
  .secondaire { background: #fff; color: var(--foncee); box-shadow: 0 4px 0 #BFD0EA; }
  .secondaire:active { box-shadow: 0 1px 0 #BFD0EA; }
  .petits { display: flex; gap: 8px; margin-top: 6px; }
  .petit { min-height: 44px; min-width: 44px; padding: 6px 12px; border: 2px solid #BFD0EA; border-radius: 12px; background: #fff; color: #3C4C6B; font: 700 13px "Andika", sans-serif; cursor: pointer; }
  .petit[aria-pressed="true"] { border-color: var(--principale); color: var(--principale); background: #E7F0FF; }
  .petit:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .nuage { animation: derive 80s linear infinite; }
  .nuage.lent { animation-duration: 120s; }
  @keyframes derive { from { transform: translateX(0); } to { transform: translateX(-420px); } }
  @media (prefers-reduced-motion: reduce) { .nuage { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<div class="telephone">
  <div class="scene" id="scene" tabindex="0" role="img" aria-label="Coach Léo tire vers le but. Touche la scène pour passer l'animation.">
    <svg viewBox="0 0 360 450" aria-hidden="true" id="svg">
      <defs>
        <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FCBFF"/><stop offset=".6" stop-color="#BDE3FF"/><stop offset="1" stop-color="#E8F6FF"/></linearGradient>
        <radialGradient id="soleil" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFBE6"/><stop offset=".45" stop-color="#FFF0A0"/><stop offset="1" stop-color="#FFF0A0" stop-opacity="0"/></radialGradient>
        <linearGradient id="pelouse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FD170"/><stop offset="1" stop-color="#2F9A4C"/></linearGradient>
        <clipPath id="clip-oeil"><ellipse rx="7.4" ry="9.6"/></clipPath>
        <clipPath id="clip-bouche"><path d="M-11 11 Q0 27 11 11 Z"/></clipPath>
      </defs>

      <!-- Ciel, soleil, nuages, collines -->
      <rect width="360" height="450" fill="url(#ciel)"/>
      <circle cx="62" cy="64" r="64" fill="url(#soleil)"/><circle cx="62" cy="64" r="22" fill="#FFF7C2" stroke="#F7D86A" stroke-width="3"/>
      <g fill="#FFFFFF" stroke="#D4E8F7" stroke-width="2.5" stroke-linejoin="round">
        <g class="nuage"><path d="M232 78 q-6 -18 14 -18 q6 -14 22 -8 q16 -6 20 10 q14 2 8 16 Z"/></g>
        <g class="nuage lent" opacity=".85"><path d="M420 50 q-4 -14 12 -14 q6 -10 18 -6 q12 -4 16 8 q10 2 6 12 Z"/></g>
      </g>
      <path d="M0 200 C60 178 120 186 180 192 C240 198 300 176 360 190 V222 H0 Z" fill="#BFD7EE"/>
      <path d="M0 212 C70 194 140 206 200 202 C260 198 320 188 360 206 V224 H0 Z" fill="#A5DE8F" stroke="#7CC46E" stroke-width="2"/>
      <g stroke="#33304A" stroke-width="2" stroke-linejoin="round">
        <rect x="26" y="196" width="5" height="18" rx="2" fill="#8E5A2B"/><circle cx="28.5" cy="190" r="13" fill="#2E9F4E"/>
        <rect x="318" y="192" width="5" height="22" rx="2" fill="#8E5A2B"/><circle cx="320.5" cy="186" r="15" fill="#2E9F4E"/>
        <rect x="96" y="204" width="4" height="12" rx="2" fill="#8E5A2B"/><circle cx="98" cy="199" r="9" fill="#2E9F4E"/>
        <rect x="258" y="206" width="4" height="12" rx="2" fill="#8E5A2B"/><circle cx="260" cy="200" r="9" fill="#2E9F4E"/>
      </g>
      <rect x="0" y="216" width="360" height="234" fill="url(#pelouse)"/>
      <g fill="#FFFFFF" opacity=".12"><rect x="0" y="228" width="360" height="12"/><rect x="0" y="256" width="360" height="18"/><rect x="0" y="300" width="360" height="28"/><rect x="0" y="366" width="360" height="44"/></g>
      <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
        <path d="M60 312 H300"/><path d="M84 312 L56 352 H304 L276 312"/><path d="M0 436 Q180 452 360 436" opacity=".6"/>
      </g>

      <!-- Le but, de face -->
      <g id="but">
        <path d="M117.8 305.7 V239 H242.2 V305.7" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".95"/>
        <g id="filet-fond" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity=".8"></g>
        <g id="ballon-couche"></g>
        <g id="filet-cotes" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity=".55"></g>
        <path d="M105 232 L117.8 239 M255 232 L242.2 239 M105 312 L117.8 305.7 M255 312 L242.2 305.7" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".95"/>
        <g fill="none" stroke="#33304A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M105 312 V232 H255"/></g>
        <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M105 312 V232 H255"/></g>
        <g id="poteau-droit"><path d="M255 232 V312" fill="none" stroke="#33304A" stroke-width="12" stroke-linecap="round"/><path d="M255 232 V312" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/></g>
      </g>
      <g id="impact" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0"></g>
      <g id="ballon-devant"></g>

      <ellipse id="ombre-leo" cx="70" cy="420" rx="34" ry="8" fill="#15502B" opacity=".25"/>
      <g id="poussiere" fill="#EAF6D2" stroke="#BFE39C" stroke-width="1.5"></g>
      <g id="vitesse" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0"></g>
      <g id="leo"></g>
      <g id="surprise" opacity="0"><circle r="11" fill="#FFF7C2" stroke="#33304A" stroke-width="3"/><path d="M0 -5 V2 M0 5.5 V6" stroke="#33304A" stroke-width="3.2" stroke-linecap="round"/></g>
      <g id="etoiles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.8" stroke-linejoin="round"></g>
      <g id="gouttes" opacity="0" fill="#9FD3FF" stroke="#33304A" stroke-width="1.5"></g>
      <g id="etincelles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.5" stroke-linejoin="round"></g>

      <g transform="translate(180 112)">
        <g id="rayons" opacity="0"></g>
        <g id="cri" opacity="0">
          <text x="3" y="4" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="70" fill="#FFC93C" stroke="#33304A" stroke-width="12" stroke-linejoin="round" paint-order="stroke">BUT !</text>
          <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="70" fill="#1F63D8" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">BUT !</text>
        </g>
      </g>
      <g id="planche" opacity="0"></g>
    </svg>
    <canvas id="confettis" aria-hidden="true"></canvas>
  </div>
  <div class="bandeau">
    <p class="titre" id="titre"></p>
    <p class="sous" id="sous"></p>
    <div class="boutons">
      <button class="btn principal" id="marquer" type="button">Marquer un but</button>
      <button class="btn secondaire" id="rater" type="button">Rater</button>
    </div>
    <div class="petits" role="group" aria-label="Choisir la célébration">
      <button class="petit" type="button" data-celebration="glissade" aria-pressed="false">A · Glissade</button>
      <button class="petit" type="button" data-celebration="avion" aria-pressed="false">B · Avion</button>
      <button class="petit" type="button" data-celebration="danse" aria-pressed="false">C · Danse</button>
    </div>
  </div>
  <p class="sr-only" id="annonce" aria-live="polite"></p>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const mouvementsReduits = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CONTOUR = "#33304A", PEAU = "#f1c39a", PEAU_OMBRE = "#D9A67A", PEAU_LUMIERE = "#FFE3C8", CHEVEUX = "#5a3a22", CHEVEUX_OMBRE = "#43291A", CHEVEUX_LUMIERE = "#8A5E3B",
    TENUE = "#2a63d4", TENUE_OMBRE = "#1F4CB0", TENUE_LUMIERE = "#5A8BE8", SHORT = "#FFFFFF", SHORT_OMBRE = "#D9E3F2", CHAUSSURE = "#E8604C", CHAUSSURE_OMBRE = "#C24432";
  const DEG = Math.PI / 180;

  // ---------- Courbes ----------
  const E = {
    lineaire: (u) => u,
    sortie: (u) => 1 - Math.pow(1 - u, 3),
    entree: (u) => u * u * u,
    douce: (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
    retour: (u) => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
    rebond: (u) => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  };
  const lerp = (a, b, u) => a + (b - a) * u, clamp01 = (u) => Math.max(0, Math.min(1, u));
  const fenetre = (t, debut, duree, e = E.sortie) => e(clamp01((t - debut) / duree));
  const r1 = (v) => Math.round(v * 10) / 10;
  const BASE = .8, SOL_LEO = 418;
  const profondeur = (ySol) => lerp(1, .45, clamp01((SOL_LEO - ySol) / (SOL_LEO - 312)));
  const tr = (el, v) => el.setAttribute("transform", v);
  const att = (el, a, v) => el.setAttribute(a, v);

  // ---------- Géométrie des membres : une seule courbe souple par membre ----------
  const quad = (S, C, W, t) => ({ x: (1 - t) ** 2 * S.x + 2 * t * (1 - t) * C.x + t * t * W.x, y: (1 - t) ** 2 * S.y + 2 * t * (1 - t) * C.y + t * t * W.y });
  function membre(S, a1, a2, L1, L2) {
    const E1 = { x: S.x - Math.sin(a1 * DEG) * L1, y: S.y + Math.cos(a1 * DEG) * L1 };
    const W = { x: E1.x - Math.sin((a1 + a2) * DEG) * L2, y: E1.y + Math.cos((a1 + a2) * DEG) * L2 };
    const C = { x: 2 * E1.x - (S.x + W.x) / 2, y: 2 * E1.y - (S.y + W.y) / 2 };
    const dir = Math.atan2(W.x - E1.x, -(W.y - E1.y)) / DEG; // rotation qui envoie « vers le haut » le long de l'avant-bras
    return { S, E: E1, W, C, dir };
  }
  function trace(m, t0, t1, pas = 8) {
    let d = "";
    for (let i = 0; i <= pas; i++) { const p = quad(m.S, m.C, m.W, lerp(t0, t1, i / pas)); d += `${i ? "L" : "M"}${r1(p.x)} ${r1(p.y)}`; }
    return d;
  }
  const ligne = (classe, couleur, largeur, extra = "") => `<path class="${classe}" fill="none" stroke="${couleur}" stroke-width="${largeur}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;

  // ---------- Mains à cinq doigts ----------
  // Un doigt effilé et légèrement courbe, de la base (x, y0) dans la direction a (0 = vers le haut), longueur L.
  function doigtForme(x, y0, a, L, b = 2.7, tp = 1.9) {
    const dx = Math.sin(a * DEG), dy = -Math.cos(a * DEG), nx = -dy, ny = dx;
    const tx = x + dx * L, ty = y0 + dy * L, mx = (x + tx) / 2 + nx * .7, my = (y0 + ty) / 2 + ny * .7, mw = (b + tp) / 2;
    return `M${r1(x + nx * b)} ${r1(y0 + ny * b)} Q${r1(mx + nx * mw)} ${r1(my + ny * mw)} ${r1(tx + nx * tp)} ${r1(ty + ny * tp)} A${tp} ${tp} 0 0 0 ${r1(tx - nx * tp)} ${r1(ty - ny * tp)} Q${r1(mx - nx * mw)} ${r1(my - ny * mw)} ${r1(x - nx * b)} ${r1(y0 - ny * b)} Z`;
  }
  function main(pose, miroir) {
    const m = miroir ? -1 : 1, doigts = [-6.3, -2.1, 2.1, 6.3], angles = pose === 3 ? [-26, -9, 9, 26] : [-9, -3, 3, 9];
    const paume = `M-8 9 V-3 Q-8 -8 -3 -8 H3 Q8 -8 8 -3 V9 Q0 12 -8 9 Z`;
    const paumePoing = `M-8 8 V-2 Q-8 -9 0 -9 Q8 -9 8 -2 V8 Q0 12 -8 8 Z`;
    const forme = (d, w) => `<path d="${d}" fill="none" stroke="${CONTOUR}" stroke-width="${w}" stroke-linejoin="round"/>`;
    let contours = "", remplissages = "";
    if (pose === 0 || pose === 3) { // ouverte : détendue (0) ou doigts écartés (3)
      const formes = doigts.map((x, i) => doigtForme(x, -6, angles[i] * m, 10.5 - Math.abs(i - 1.5) * .8));
      const pouce = doigtForme(-7 * m, 0, -52 * m, 9, 2.6, 1.9);
      formes.concat(pouce).forEach((d) => (contours += forme(d, 5.2)));
      remplissages += formes.concat(pouce).map((d) => `<path d="${d}" fill="${PEAU}"/>`).join("");
      remplissages += doigts.map((x, i) => { const a = angles[i] * m * DEG; return `<path d="M${r1(x + Math.sin(a) * 3)} ${r1(-6 - Math.cos(a) * 3)} l${r1(Math.sin(a) * 4)} ${r1(-Math.cos(a) * 4)}" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>`; }).join("");
      return `${contours}${forme(paume, 5.6)}<path d="${paume}" fill="${PEAU}"/>${remplissages}<path d="M3 8 Q7 4 7 -1" fill="none" stroke="${PEAU_OMBRE}" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    // poing (1) ou pouce levé (2) : quatre doigts repliés visibles, pouce rangé ou dressé dans le prolongement de l'avant-bras
    const pouce = pose === 2 ? doigtForme(-5 * m, -4, -10 * m, 13, 2.8, 2.1) : null;
    if (pouce) contours += forme(pouce, 5.4);
    doigts.forEach((x) => { contours += `<circle cx="${x}" cy="-8" r="5.4" fill="${CONTOUR}"/>`; });
    let dessus = doigts.map((x) => `<circle cx="${x}" cy="-8" r="3.6" fill="${PEAU}"/>`).join("") + `<rect x="-8" y="-8" width="16" height="6" fill="${PEAU}"/>`;
    dessus += doigts.map((x) => `<path d="M${x - 2.2} -6.5 q2.2 -1.8 4.4 0" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.4" stroke-linecap="round"/>`).join("");
    if (pouce) dessus += `<path d="${pouce}" fill="${PEAU}"/><path d="M${r1(-6 * m)} -3 l${r1(-1.5 * m)} -6" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.6" stroke-linecap="round"/>`;
    else dessus += `<path d="M${-7 * m} 2 q${r1(5 * m)} 3 ${r1(10 * m)} 1" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.8" stroke-linecap="round"/>`;
    return `${contours}${forme(paumePoing, 5.6)}<path d="${paumePoing}" fill="${PEAU}"/>${dessus}<path d="M3 7 Q7 3 7 -2" fill="none" stroke="${PEAU_OMBRE}" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  const MAINS = { droit: [0, 1, 2, 3].map((p) => main(p, false)), miroir: [0, 1, 2, 3].map((p) => main(p, true)) };

  // ---------- Structure du personnage ----------
  const brasHTML = (c) => `<g id="bras-${c}">
      ${ligne("manche-contour", CONTOUR, 26)}${ligne("contour", CONTOUR, 20)}${ligne("rempli", PEAU, 13)}${ligne("ombre", PEAU_OMBRE, 5.5)}${ligne("lumiere", PEAU_LUMIERE, 3.2)}
      ${ligne("manche", TENUE, 20)}${ligne("manche-ombre", TENUE_OMBRE, 7)}${ligne("manche-bord", TENUE_OMBRE, 2.2)}
      <g id="main-${c}"><g class="pose-main"></g></g></g>`;
  const jambeHTML = (c) => `<g id="jambe-${c}">
      ${ligne("contour", CONTOUR, 21)}${ligne("rempli", PEAU, 14)}${ligne("ombre", PEAU_OMBRE, 6)}${ligne("lumiere", PEAU_LUMIERE, 3.4)}
      ${ligne("chaussette", "#FFFFFF", 14.5)}<path class="chaussette-bord" fill="none" stroke="${TENUE}" stroke-width="14.6" stroke-linecap="butt"/><path class="chaussette-bord2" fill="none" stroke="${TENUE}" stroke-width="14.6" stroke-linecap="butt"/>${ligne("chaussette-ombre", SHORT_OMBRE, 4)}
      <g id="chaussure-${c}">
        <ellipse class="contact" rx="13" ry="3.5" fill="#15502B" opacity=".25"/>
        <g class="vue-face">
          <path fill="${CHAUSSURE}" stroke="${CONTOUR}" stroke-width="3" stroke-linejoin="round" d="M-7 -10 Q-9 -3 -10 4 Q-11 12 -4 15 Q0 16 4 15 Q11 12 10 4 Q9 -3 7 -10 Q0 -12 -7 -10 Z"/>
          <path fill="${CHAUSSURE_OMBRE}" d="M3 -8 Q8 0 9 6 Q9 12 4 15 Q7 10 6 4 Q5 -2 3 -8 Z"/>
          <g class="devant">
            <path fill="#FF8A74" d="M-9 6 Q-9 13 -4 15 Q0 16 4 15 Q9 13 9 6 Q0 9 -9 6 Z"/>
            <ellipse cx="-2.5" cy="10" rx="3" ry="1.4" fill="#FFFFFF" opacity=".9"/>
            <path fill="${CHAUSSURE_OMBRE}" stroke="${CONTOUR}" stroke-width="1.8" stroke-linejoin="round" d="M-5 -10 Q0 -13 5 -10 L4 -4 Q0 -3 -4 -4 Z"/>
            <g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"><path d="M-3.2 -5 L3.2 -5 M-3.5 -2 L3.5 -2 M-3.8 1 L3.8 1 M-4 4 L4 4"/></g>
            <g fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"><path d="M-9.5 -1 L-7.5 0 M-9.8 2 L-7.8 3 M-10 5 L-8 6 M9.5 -1 L7.5 0 M9.8 2 L7.8 3 M10 5 L8 6"/></g>
          </g>
          <g class="talon"><path fill="none" stroke="${CONTOUR}" stroke-width="1.3" stroke-linecap="round" opacity=".6" d="M-7 -4 Q0 -2 7 -4"/><path fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" d="M-9 2 L-7 3 M-9.5 5 L-7.5 6 M9 2 L7 3 M9.5 5 L7.5 6"/></g>
          <path fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".9" d="M-9 11 Q0 15.5 9 11"/>
        </g>
        <g class="vue-profil">
          <path fill="${CHAUSSURE}" stroke="${CONTOUR}" stroke-width="3" stroke-linejoin="round" d="M-13 -8 Q-16 0 -14 7 L-10 9 L18 9 Q25 8 24 3 Q22 -3 12 -6 Q4 -8 -2 -7 Q-8 -10 -13 -8 Z"/>
          <path fill="${CHAUSSURE_OMBRE}" d="M-8 3 Q6 6 24 3 Q25 8 18 9 L-10 9 L-14 7 Z"/>
          <path fill="#E6EAF0" stroke="${CONTOUR}" stroke-width="1.3" d="M-14 7 L-10 9 L18 9 Q25 8 24 3.5 Q10 8 -14 7 Z"/>
          <path fill="#FFFFFF" opacity=".75" d="M13 -5 Q20 -3 23 2 Q18 0 12 -2 Z"/>
          <g fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"><path d="M-4 -5 L-6 5 M1 -4.5 L-1 5 M6 -4 L4 5"/></g>
          <path fill="none" stroke="${CONTOUR}" stroke-width="1.2" stroke-linecap="round" d="M-13 -7 Q-7 -4 -1 -6" opacity=".6"/>
        </g>

    tr(N.leo, `translate(${r1(p.x)} ${r1(y)}) rotate(${r1(p.rot)}) scale(${r1(p.s * BASE * p.sx * 100) / 100} ${r1(p.s * BASE * p.sy * 100) / 100})`);
    // torse en poire, short, col, badge (devant seulement)
    const sh = 18 * wf, hp = 22 * wf;
    att(q1(N.torse, "forme"), "d", `M${r1(-sh)} -40 Q${r1(-sh - 6)} -12 ${r1(-hp)} 6 Q0 14 ${r1(hp)} 6 Q${r1(sh + 6)} -12 ${r1(sh)} -40 Q0 -47 ${r1(-sh)} -40 Z`);
    att(q1(N.torse, "ombre"), "d", `M${r1(sh * .3)} -42 Q${r1(sh + 3)} -30 ${r1(hp)} 4 Q${r1(hp * .6)} 10 ${r1(hp * .35)} 9 Q${r1(sh + 1)} -20 ${r1(sh * .3)} -42 Z`);
    att(q1(N.torse, "lumiere"), "d", `M${r1(-sh * .9)} -36 Q${r1(-sh * .4)} -42 ${r1(sh * .1)} -40 Q${r1(-sh * .4)} -37 ${r1(-sh * .8)} -30 Z`);
    att(q1(N.torse, "col"), "d", cw > .2 ? `M-7 -44 L0 -35 L7 -44` : `M-8 -43 Q0 -39 8 -43`);
    const badge = q1(N.torse, "badge"); att(badge, "opacity", cw > .3 ? 1 : 0); tr(badge, `translate(${r1(-9 * cw + 4 * sw)} -24)`);
    att(q1(N.short, "forme"), "d", `M${r1(-hp - 1)} -4 Q0 2 ${r1(hp + 1)} -4 L${r1(hp + 4)} 16 Q${r1(hp * .5)} 20 ${r1(hp * .1)} 18 Q0 14 ${r1(-hp * .1)} 18 Q${r1(-hp * .5)} 20 ${r1(-hp - 4)} 16 Z`);
    att(q1(N.short, "ombre"), "d", `M${r1(hp * .2)} 8 Q${r1(hp + 1)} 0 ${r1(hp + 2)} 14 Q${r1(hp * .6)} 18 ${r1(hp * .15)} 17 Z`);
    att(q1(N.short, "bande"), "d", `M${r1(-hp - 2)} 0 L${r1(-hp - 3)} 14 M${r1(hp + 2)} 0 L${r1(hp + 3)} 14`);
    tr(N.haut, `rotate(${r1(p.torse)})`);
    // jambes (attachées aux hanches), raccourcies selon la vue et la course
    dessineJambe(N["jambe-g"], "g", { x: -10 * wf, y: 4 }, lGt, lGs, fG, sw, p.tG);
    dessineJambe(N["jambe-d"], "d", { x: 10 * wf, y: 4 }, lDt, lDs, fD, sw, p.tD);
    // bras : le bras loin derrière le torse, le bras proche devant ; les deux devant la tête si « devant »
    const proche = sw > .05 ? "d" : "g";
    const slotArriere = N["bras-arriere"], slotAvant = N["bras-avant"], slotTete = N.arriere;
    for (const c of ["g", "d"]) {
      const cible = p.devant > .5 ? slotAvant : (c === proche || Math.abs(sw) <= .05 ? slotAvant : slotArriere);
      if (BRAS[c].parentNode !== cible) cible.append(BRAS[c]);
      const S = { x: (c === "g" ? -1 : 1) * 18 * wf + 4 * sw, y: -38 };
      dessineBras(BRAS[c], c, S, c === "g" ? p.aGu : p.aDu, c === "g" ? p.aGl : p.aDl, Math.round(c === "g" ? p.mG : p.mD));
    }
    if (p.devant > .5 && slotAvant.firstElementChild !== BRAS.g) slotAvant.prepend(BRAS.g);
    void slotTete;
    // tête
    tr(N.tete, `translate(0 -48) rotate(${r1(p.tete)})`); tr(N["tete-forme"], `translate(0 -26)`);
    const ex = expressionA(anim, t), A = EMOS[ex.prec], B = EMOS[ex.emo], u = ex.u;
    const lidBase = Math.max(lerp(A.lid, B.lid, u), p.lid, clignement(t));
    dessineTete(p, t, ex, lidBase, lerp(A.pup, B.pup, u));
    // ombre au sol
    const S = p.s * BASE, sol = p.y + 58 * S, haut = Math.max(0, sol - (y + 58 * S));
    att(N["ombre-leo"], "cx", r1(p.x)); att(N["ombre-leo"], "cy", r1(sol + 2));
    att(N["ombre-leo"], "rx", r1(34 * S + haut * .2)); att(N["ombre-leo"], "ry", r1(8 * S));
    att(N["ombre-leo"], "opacity", r1(Math.max(.07, .25 - haut * .003) * 100) / 100);
    return p;
  }

  // ---------- Effets : cri, rayons, poussière, surprise, étoiles, gouttes, étincelles, impact, vitesse, textes ----------
  function dessineCri(anim, t) {
    if (anim.tCri === null) { att(N.cri, "opacity", 0); att(N.rayons, "opacity", 0); return; }
    const u = fenetre(t, anim.tCri, .5, E.rebond), repli = fenetre(t, anim.tTitre - .2, .5, E.douce);
    att(N.cri, "opacity", r1(fenetre(t, anim.tCri, .12) * 100) / 100);
    tr(N.cri, `translate(0 ${r1(lerp(0, -22, repli))}) rotate(${r1(lerp(-8, 0, u))}) scale(${r1((0.2 + .8 * u) * lerp(1, .82, repli) * 100) / 100})`);
    const r = fenetre(t, anim.tCri, .55);
    att(N.rayons, "opacity", r1((1 - fenetre(t, anim.tCri + .25, .35, E.entree)) * fenetre(t, anim.tCri, .08) * 100) / 100);
    tr(N.rayons, `scale(${r1((.6 + r * .9) * 100) / 100}) rotate(${r1(r * 25)})`);
  }
  function dessinePoussiere(anim, t) {
    const actif = anim.genre === "but" && anim.celebration === "glissade";
    [...N.poussiere.children].forEach((c, i) => {
      const n = 1.54 + .8 + i * .07, u = actif ? clamp01((t - n) / .5) : 0;
      if (u <= 0 || u >= 1) { att(c, "opacity", 0); return; }
      const pn = poseA(anim.poses, n), x = pn.x - 18 * pn.s * BASE - u * (14 + (i % 3) * 10) * (i % 2 ? -1 : 1) * .5 - u * 10, yy = pn.y + 30 * pn.s * BASE - u * (10 + (i % 3) * 6);
      tr(c, `translate(${r1(x)} ${r1(yy)}) scale(${r1((.5 + u * 1.8) * 100) / 100})`); att(c, "opacity", r1((1 - u) * .8 * 100) / 100);
    });
  }
  function dessineSurprise(anim, t, p) {
    const d = anim.genre === "echec" ? T_IMPACT - .04 : null;
    if (d === null || t < d || t > d + .8) { att(N.surprise, "opacity", 0); return; }
    const u = fenetre(t, d, .25, E.rebond), f = 1 - fenetre(t, d + .6, .2, E.entree);
    att(N.surprise, "opacity", r1(f * 100) / 100);
    tr(N.surprise, `translate(${r1(p.x + 34 * p.s * BASE)} ${r1(p.y - 128 * p.s * BASE - 8 * u)}) scale(${r1(u * 100) / 100})`);
  }
  function dessineEtoiles(anim, t, p) {
    const d = anim.tJoie;
    if (d === null || t < d || t > d + 1) { att(N.etoiles, "opacity", 0); att(N.gouttes, "opacity", 0); return; }
    att(N.etoiles, "opacity", 1); att(N.gouttes, "opacity", 1);
    const cx = p.x, cy = p.y - 100 * p.s * BASE;
    [...N.etoiles.children].forEach((e, i) => { const u = fenetre(t, d + i * .1, .7, E.sortie), k = Math.sin(Math.min(1, u) * Math.PI), a = -2.4 + i * 1.1; tr(e, `translate(${r1(cx + Math.cos(a) * (34 + u * 22) * p.s)} ${r1(cy + Math.sin(a) * (26 + u * 14) * p.s)}) rotate(${r1(u * 120)}) scale(${r1(k * 1.3 * 100) / 100})`); });
    [...N.gouttes.children].forEach((g, i) => { const u = fenetre(t, d + .05 + i * .08, .5, E.sortie), s = i ? 1 : -1; tr(g, `translate(${r1(cx + s * (22 + u * 16) * p.s)} ${r1(cy + 6 - u * 10 + u * u * 16)}) rotate(${s * 30}) scale(${r1((1 - u) * 1.4 * 100) / 100})`); });
  }
  function dessineEtincelles(anim, t, p) {
    const d = anim.tPouce === undefined ? null : anim.tPouce;
    if (d === null || t < d) { att(N.etincelles, "opacity", 0); return; }
    att(N.etincelles, "opacity", 1);
    const base = { x: p.x + 50 * p.s * BASE, y: p.y - 80 * p.s * BASE };
    [...N.etincelles.children].forEach((e, i) => { const u = fenetre(t, d + i * .08, .6, E.sortie), a = -1.2 + i * 1.1, k = Math.sin(Math.min(1, u) * Math.PI); tr(e, `translate(${r1(base.x + Math.cos(a) * (10 + u * 16))} ${r1(base.y + Math.sin(a) * (10 + u * 16) - u * 6)}) rotate(${r1(u * 90)}) scale(${r1(k * 3 * 100) / 100})`); });
  }
  function dessineImpact(anim, t) {
    const s = t - T_IMPACT, pt = anim.genre === "but" ? POINT_FILET : POINT_POTEAU;
    if (s < 0 || s > .22) { att(N.impact, "opacity", 0); return; }
    const u = s / .22; att(N.impact, "opacity", r1((1 - u) * 100) / 100); tr(N.impact, `translate(${pt.x} ${pt.y}) scale(${r1((.5 + u) * .55 * 100) / 100})`);
  }
  function dessineVitesse(anim, t, p) {
    const s = t - anim.tTour;
    if (s < .06 || s > .46) { att(N.vitesse, "opacity", 0); return; }
    const u = (s - .06) / .4; att(N.vitesse, "opacity", r1(Math.sin(u * Math.PI) * .9 * 100) / 100);
    tr(N.vitesse, `translate(${r1(p.x - 30 * p.s * BASE)} ${r1(p.y - 44 * p.s * BASE)}) scale(${r1((.8 + u * .5) * 100) / 100} 1)`);
  }
  function dessineTextes(anim, t) {
    const u = fenetre(t, anim.tTitre, .45), v = fenetre(t, anim.tTitre + .2, .4);
    N.titre.textContent = anim.titre; N.sous.textContent = anim.sous;
    N.titre.style.opacity = u; N.titre.style.transform = `translateY(${r1(12 * (1 - u))}px) scale(${r1((.94 + .06 * u) * 100) / 100})`;
    N.sous.style.opacity = v; N.sous.style.transform = `translateY(${r1(8 * (1 - v))}px)`;
  }
  function dessinePoteau(anim, t) {
    const s = t - T_IMPACT;
    const amp = anim.genre === "echec" && s > 0 && s < .7 ? Math.sin(s * 42) * Math.exp(-6 * s) * 3 : 0;
    tr(N["poteau-droit"], `translate(${r1(amp)} 0)`);
  }

  // ---------- Confettis ----------
  const canvas = $("confettis"), ctx = canvas.getContext("2d");
  const COULEURS = ["#1F63D8", "#FFC93C", "#FFFFFF", "#4C8FF5", "#E8604C"];
  let confettis = [];
  function semeConfettis(actifs) {
    confettis = [];
    if (!actifs) return;
    for (let i = 0; i < 70; i++) {
      const ang = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 240 + Math.random() * 280, origine = i % 2 ? { x: 105, y: 236 } : { x: 255, y: 236 };
      confettis.push({ x: origine.x + (Math.random() - .5) * 10, y: origine.y, vx: Math.cos(ang) * v * .9 + (i % 2 ? -50 : 50) + (Math.random() - .5) * 160, vy: Math.sin(ang) * v,
        w: 5 + Math.random() * 4, h: 3 + Math.random() * 3, rot: Math.random() * Math.PI, vrot: (Math.random() - .5) * 10, phase: Math.random() * 6.3, sol: 330 + Math.random() * 115, couleur: COULEURS[i % COULEURS.length], pose: false });
    }
  }
  function avanceConfettis(dt) {
    for (const c of confettis) {
      if (c.pose) continue;
      c.vy += 760 * dt; c.vx *= 1 - 2.4 * dt; c.vy *= 1 - 1.6 * dt;
      c.x += c.vx * dt + Math.sin(c.phase + c.y * .05) * 22 * dt; c.y += c.vy * dt; c.rot += c.vrot * dt; c.phase += dt * 9;
      if (c.y >= c.sol) { c.y = c.sol; c.pose = true; }
    }
  }
  function dessineConfettis() {
    const largeur = canvas.clientWidth, dpr = Math.min(2, devicePixelRatio || 1);
    if (canvas.width !== Math.round(largeur * dpr)) { canvas.width = Math.round(largeur * dpr); canvas.height = Math.round(largeur * 450 / 360 * dpr); }
    ctx.setTransform(canvas.width / 360, 0, 0, canvas.width / 360, 0, 0); ctx.clearRect(0, 0, 360, 450);
    for (const c of confettis) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      const repli = c.pose ? .55 : Math.abs(Math.cos(c.phase));
      ctx.fillStyle = c.couleur; ctx.globalAlpha = c.pose ? .85 : 1; ctx.fillRect(-c.w / 2, -c.h * repli / 2, c.w, Math.max(1.2, c.h * repli)); ctx.restore();
    }
  }

  // ---------- Horloge et commandes ----------
  let anim = null, depart = 0, tPrecedent = 0, enCours = false, image = 0;
  function rend(t) {
    const p = dessineLeo(anim, t);
    dessineBallon(anim, t);
    dessineFilet(t, anim.genre === "but" ? T_IMPACT : null, POINT_FILET);
    dessinePoteau(anim, t); dessineImpact(anim, t); dessineCri(anim, t); dessinePoussiere(anim, t); dessineSurprise(anim, t, p); dessineEtoiles(anim, t, p); dessineEtincelles(anim, t, p); dessineVitesse(anim, t, p); dessineTextes(anim, t); dessineConfettis();
  }
  const tConfettis = () => (anim.tCri === null ? Infinity : anim.tCri);
  function boucle(maintenant) {
    const t = Math.min(anim.fin, (maintenant - depart) / 1000);
    if (t >= tConfettis()) avanceConfettis(Math.min(.05, t - Math.max(tPrecedent, tConfettis())));
    tPrecedent = t; rend(t);
    if (t >= anim.fin) { termine(); return; }
    image = requestAnimationFrame(boucle);
  }
  function termine() {
    enCours = false; cancelAnimationFrame(image);
    N.annonce.textContent = "";
    requestAnimationFrame(() => { N.annonce.textContent = anim.genre === "but" ? "But ! " + anim.titre : anim.titre; });
  }
  function etatFinal() {
    for (let i = 0; i < 200; i++) avanceConfettis(1 / 60);
    tPrecedent = anim.fin; rend(anim.fin); termine();
  }
  function prepare(nouvelle) {
    anim = nouvelle; placeBallon(anim); semeConfettis(anim.genre === "but"); dernierGonflement = -1;
    document.querySelectorAll(".petit").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.celebration === anim.celebration)));
    N.scene.setAttribute("aria-label", anim.genre === "but" ? "Coach Léo marque un but et fête le chapitre réussi. Touche la scène pour passer la fête." : "Le ballon tape le poteau. Coach Léo sourit et lève le pouce : on réessaie. Touche la scène pour passer l'animation.");
  }
  function lance(nouvelle) {
    cancelAnimationFrame(image); prepare(nouvelle);
    if (mouvementsReduits) { etatFinal(); return; }
    enCours = true; depart = performance.now(); tPrecedent = 0; rend(0);
    image = requestAnimationFrame(boucle);
  }
  const auHasard = () => ["glissade", "avion", "danse"][Math.floor(Math.random() * 3)];
  $("marquer").addEventListener("click", () => lance(construitBut(auHasard())));
  $("rater").addEventListener("click", () => lance(construitEchec()));
  document.querySelectorAll(".petit").forEach((b) => b.addEventListener("click", () => lance(construitBut(b.dataset.celebration))));
  const passe = () => { if (enCours) etatFinal(); };
  N.scene.addEventListener("pointerdown", passe);
  N.scene.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); passe(); } });

  // Mise au point : « ?anim=glissade|avion|danse|echec&t=1.2 » rend l'image fixe ; « ?planche=mains » ou « ?planche=tetes » montre une planche.
  const params = new URLSearchParams(location.search);
  function rendStatique(nouvelle, t) {
    prepare(nouvelle);
    for (let s = tConfettis(); s < t; s += 1 / 60) avanceConfettis(1 / 60);
    rend(t);
  }
  function planche(quoi) {
    N.planche.innerHTML = `<rect width="360" height="450" fill="#F0FAFF"/>`;
    if (quoi === "chaussures") {
      const cas = [["face au sol", "echec", 2.6], ["profil", "glissade", 1.24], ["trois-quarts", "glissade", 1.40], ["de dos au sol", "danse", 0], ["semelle (à genoux)", "glissade", 2.9]];
      att(N.planche, "opacity", 1);
      cas.forEach(([libelle, a, t], i) => {
        prepare(a === "echec" ? construitEchec() : construitBut(a)); rend(t);
        const src = N["chaussure-g"], g = src.cloneNode(true); g.removeAttribute("id");
        const total = N.leo.getCTM().inverse().multiply(src.getCTM()); const k = Math.hypot(total.a, total.b) / BASE;
        const x = 50 + (i % 3) * 120, y = i < 3 ? 120 : 300;
        tr(g, `translate(${x} ${y}) scale(${r1(3 / k * 100) / 100}) matrix(${total.a / Math.hypot(total.a, total.b) * k} ${total.b / Math.hypot(total.a, total.b) * k} ${total.c / Math.hypot(total.c, total.d) * k} ${total.d / Math.hypot(total.c, total.d) * k} 0 0)`);
        N.planche.append(g);
        const txt = document.createElementNS(NS, "text"); txt.setAttribute("x", x); txt.setAttribute("y", y + 70); txt.setAttribute("text-anchor", "middle"); txt.setAttribute("font-family", "Andika"); txt.setAttribute("font-size", "13"); txt.setAttribute("fill", "#1B2A4A"); txt.textContent = libelle; N.planche.append(txt);
      });
      return;
    }
    if (quoi === "mains") {
      N.planche.innerHTML += [0, 1, 2, 3].map((p, i) => `<g transform="translate(${48 + i * 88} 110) scale(3.2)">${main(p, false)}</g><g transform="translate(${48 + i * 88} 320) scale(3.2)">${main(p, true)}</g>`).join("")
        + ["détendue", "poing", "pouce levé", "écartée"].map((l, i) => `<text x="${48 + i * 88}" y="200" text-anchor="middle" font-family="Andika" font-size="13" fill="#1B2A4A">${l}</text>`).join("");
      att(N.planche, "opacity", 1); return;
    }
    att(N.planche, "opacity", 1);
    const positions = [180, 135, 90, 45, 0];
    positions.forEach((vue, i) => {
      const clone = N.tete.cloneNode(true); clone.removeAttribute("id");
      prepare(construitBut("danse")); const p = { ...poseA(anim.poses, 0), vue, meche: 0 };
      dessineTete(p, 0, { emo: "joie", prec: "joie", u: 1 }, 0, 1);
      const c2 = N["tete-forme"].cloneNode(true); c2.removeAttribute("id"); c2.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));
      const g = document.createElementNS(NS, "g"); tr(g, `translate(${50 + (i % 3) * 130} ${i < 3 ? 110 : 300}) scale(2.2)`); g.append(c2); N.planche.append(g);
      void clone;
    });
  }
  const polices = document.fonts && document.fonts.load ? document.fonts.load("800 70px 'Baloo 2'") : Promise.resolve();
  Promise.race([polices, new Promise((r) => setTimeout(r, 1500))]).finally(() => {
    const a = params.get("anim"), t = params.get("t"), pl = params.get("planche");
    if (pl) { planche(pl); return; }
    const nouvelle = a === "echec" ? construitEchec() : construitBut(CELEBRATIONS[a] ? a : auHasard());
    if (t !== null) rendStatique(nouvelle, Number(t)); else lance(nouvelle);
  });
})();
</script>
