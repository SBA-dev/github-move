<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savanturier : Lumi, fée des nombres et des mots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #A23BB8; --foncee: #7C2690; --or: #FFC93C; --encre: #3A2250; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0f1b2d; }
  body { font-family: "Andika", system-ui, sans-serif; color: var(--encre); display: flex; justify-content: center; padding: 10px 0; }
  .telephone { width: 100%; max-width: 370px; height: 680px; border-radius: 28px; overflow: hidden; background: linear-gradient(#E7D9FF, #FFE6F1); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .scene { position: relative; width: 100%; aspect-ratio: 360 / 450; flex: none; touch-action: manipulation; cursor: pointer; outline: none; }
  .scene:focus-visible { box-shadow: inset 0 0 0 4px var(--or); }
  .scene svg, .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { pointer-events: none; }
  .bandeau { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 6px 14px 10px; text-align: center; }
  .titre { margin: 0; min-height: 36px; font-family: "Baloo 2", "Andika", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--foncee); opacity: 0; transform: translateY(12px); }
  .sous { margin: 0; min-height: 20px; font-size: 14px; line-height: 1.3; color: #5A3E6E; opacity: 0; transform: translateY(8px); }
  .boutons { display: flex; gap: 10px; margin-top: 6px; }
  .btn { min-height: 48px; padding: 8px 20px; border: 0; border-radius: 999px; font: 700 17px "Baloo 2", "Andika", sans-serif; cursor: pointer; transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .btn:active { transform: translateY(3px); }
  .btn:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  .principal { background: var(--principale); color: #fff; box-shadow: 0 4px 0 var(--foncee); }
  .principal:active { box-shadow: 0 1px 0 var(--foncee); }
  .secondaire { background: #fff; color: var(--foncee); box-shadow: 0 4px 0 #E3CCEF; }
  .secondaire:active { box-shadow: 0 1px 0 #E3CCEF; }
  .petits { display: flex; gap: 8px; margin-top: 6px; }
  .petit { min-height: 44px; min-width: 44px; padding: 6px 12px; border: 2px solid #E3CCEF; border-radius: 12px; background: #fff; color: #5A3E6E; font: 700 13px "Andika", sans-serif; cursor: pointer; }
  .petit[aria-pressed="true"] { border-color: var(--principale); color: var(--principale); background: #F8EAFF; }
  .petit:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .luciole { animation: flotte 5s ease-in-out infinite; }
  .luciole:nth-child(2n) { animation-delay: -1.7s; animation-duration: 6s; } .luciole:nth-child(3n) { animation-delay: -3.2s; animation-duration: 4.4s; }
  @keyframes flotte { 0%, 100% { transform: translate(0, 0); opacity: .35; } 50% { transform: translate(6px, -14px); opacity: 1; } }
  .nuage { animation: derive 110s linear infinite; } .nuage.lent { animation-duration: 150s; }
  @keyframes derive { from { transform: translateX(0); } to { transform: translateX(-440px); } }
  @media (prefers-reduced-motion: reduce) { .luciole, .nuage { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<div class="telephone">
  <div class="scene" id="scene" tabindex="0" role="img" aria-label="Lumi lance un sort avec sa baguette et fait éclore une fleur magique, dans le Royaume des Savanturiers. Touche la scène pour passer l'animation.">
    <svg viewBox="0 0 360 450" aria-hidden="true" id="svg">
      <defs>
        <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9C6FF"/><stop offset=".55" stop-color="#E7D9FF"/><stop offset="1" stop-color="#FFE6F1"/></linearGradient>
        <linearGradient id="prairie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C9E4"/><stop offset="1" stop-color="#D8A6E3"/></linearGradient>
        <radialGradient id="lueur" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF1A8" stop-opacity=".8"/><stop offset="1" stop-color="#FFF1A8" stop-opacity="0"/></radialGradient>
        <radialGradient id="lueur-rose" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD6EA" stop-opacity=".9"/><stop offset="1" stop-color="#FFD6EA" stop-opacity="0"/></radialGradient>
        <linearGradient id="aile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#9CCFFF" stop-opacity=".6"/></linearGradient>
        <clipPath id="clip-oeil"><ellipse rx="9" ry="11"/></clipPath>
        <clipPath id="clip-bouche"><path d="M-11 0 Q0 20 11 0 Z"/></clipPath>
      </defs>
      <!-- Jardin féerique : ciel rose-mauve, étoiles pâles, nuages, château sur la colline, prairie fleurie -->
      <rect width="360" height="450" fill="url(#ciel)"/>
      <g fill="#FFFFFF" opacity=".55"><circle cx="40" cy="40" r="1.8"/><circle cx="120" cy="24" r="1.4"/><circle cx="210" cy="50" r="2"/><circle cx="300" cy="30" r="1.5"/><circle cx="340" cy="90" r="1.3"/><circle cx="70" cy="110" r="1.2"/><circle cx="260" cy="110" r="1.6"/></g>
      <g fill="#FFFFFF" stroke="#E6D4F5" stroke-width="2.5" stroke-linejoin="round">
        <path class="nuage" d="M70 92 q-6 -18 14 -18 q6 -14 22 -8 q16 -6 20 10 q14 2 8 16 Z"/>
        <path class="nuage lent" d="M430 60 q-4 -12 10 -12 q5 -9 15 -5 q11 -4 14 7 q9 2 5 10 Z" opacity=".85"/>
      </g>
      <path d="M0 300 C60 262 140 272 200 268 C260 262 310 250 360 266 V450 H0 Z" fill="#D8A6E3"/>
      <!-- petit château rose et violet au loin -->
      <g id="chateau" transform="translate(262 196)" stroke="#33304A" stroke-width="2.4" stroke-linejoin="round">
        <rect x="-30" y="26" width="60" height="50" fill="#F2C9E4"/><rect x="-42" y="10" width="20" height="66" fill="#E8B5DC"/><rect x="22" y="10" width="20" height="66" fill="#E8B5DC"/><rect x="-9" y="-6" width="18" height="34" fill="#F2C9E4"/>
        <path d="M-44 10 L-32 -14 L-20 10 Z M20 10 L32 -14 L44 10 Z M-11 -6 L0 -28 L11 -6 Z" fill="#A97FD6"/>
        <path d="M0 -28 V-40" stroke="#33304A" stroke-width="2"/><path d="M0 -40 l10 4 l-10 4 Z" fill="#FFC93C"/>
        <path d="M-6 76 V58 Q0 50 6 58 V76 Z" fill="#A23BB8"/><g fill="#FFF3B0"><rect x="-36" y="26" width="7" height="10" rx="2"/><rect x="29" y="26" width="7" height="10" rx="2"/><rect x="-18" y="38" width="8" height="10" rx="2"/><rect x="10" y="38" width="8" height="10" rx="2"/><rect x="-3" y="4" width="6" height="8" rx="2"/></g>
      </g>
      <g stroke="#33304A" stroke-width="2.5" stroke-linejoin="round" fill="#7E56BC"><circle cx="40" cy="292" r="24"/><circle cx="22" cy="306" r="16"/><circle cx="332" cy="300" r="20"/><circle cx="350" cy="312" r="14"/></g>
      <path d="M0 322 C70 304 140 318 200 310 C270 300 320 310 360 304 V450 H0 Z" fill="#F2C9E4"/>
      <path d="M0 384 Q180 370 360 384 V450 H0 Z" fill="url(#prairie)"/>
      <path d="M0 386 Q90 376 180 382 Q270 388 360 380" fill="none" stroke="#A97FD6" stroke-width="3" opacity=".6"/>
      <g id="fleurs-prairie" stroke="#33304A" stroke-width="1.3"></g>
      <g id="lucioles" fill="#FFF3B0"></g>
      <ellipse id="ombre-sol" cx="150" cy="398" rx="40" ry="8" fill="#7C2690" opacity=".2"/>
      <!-- la fleur magique -->
      <g id="fleur" opacity="0"></g>
      <g id="bulles"></g>
      <g id="pschitt" opacity="0"><text text-anchor="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="24" fill="#9FD3FF" stroke="#33304A" stroke-width="5" stroke-linejoin="round" paint-order="stroke">pschitt !</text></g>
      <g id="souffle" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0"></g>
      <g id="leo"></g>
      <g id="baguette"></g>
      <g id="trainee" fill="#FFC93C" stroke="#33304A" stroke-width="1"></g>
      <g id="sort" opacity="0"></g>
      <g id="arc-en-ciel" fill="none" stroke-linecap="round" opacity="0"></g>
      <g id="couronne" opacity="0"></g>
      <g id="etoiles-vol" fill="#FFC93C" stroke="#33304A" stroke-width="1.2"></g>
      <g id="signes" opacity="0"></g>
      <g id="surprise" opacity="0"><circle r="11" fill="#FFF7C2" stroke="#33304A" stroke-width="3"/><path d="M0 -5 V2 M0 5.5 V6" stroke="#33304A" stroke-width="3.2" stroke-linecap="round"/></g>
      <g id="etoiles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.8" stroke-linejoin="round"></g>
      <g id="etincelles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.5" stroke-linejoin="round"></g>
      <g id="cri-ancre" transform="translate(180 36)">
        <g id="rayons" opacity="0"></g>
        <g id="cri" opacity="0">
          <text x="3" y="4" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="54" fill="#FFC93C" stroke="#33304A" stroke-width="12" stroke-linejoin="round" paint-order="stroke">Magique !</text>
          <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="54" fill="#A23BB8" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Magique !</text>
        </g>
      </g>
      <g id="planche" opacity="0"></g>
    </svg>
    <canvas id="confettis" aria-hidden="true"></canvas>
  </div>
  <div class="bandeau">
    <p class="titre" id="titre"></p>
    <p class="sous" id="sous"></p>
    <div class="boutons">
      <button class="btn principal" id="marquer" type="button">Réussir</button>
      <button class="btn secondaire" id="rater" type="button">Rater</button>
    </div>
    <div class="petits" role="group" aria-label="Choisir la célébration">
      <button class="petit" type="button" data-celebration="arc" aria-pressed="false">A · Arc-en-ciel</button>
      <button class="petit" type="button" data-celebration="envol" aria-pressed="false">B · Envol</button>
      <button class="petit" type="button" data-celebration="signes" aria-pressed="false">C · Chiffres</button>
    </div>
  </div>
  <p class="sr-only" id="annonce" aria-live="polite"></p>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const mouvementsReduits = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CONTOUR = "#33304A", PEAU = "#ffd9b8", PEAU_OMBRE = "#E8B48C", PEAU_LUMIERE = "#FFF0E0", CHEVEUX = "#f7cc4f", CHEVEUX_OMBRE = "#D9A92C", CHEVEUX_LUMIERE = "#FFE992",
    ROBE = "#ff9cbc", ROBE_OMBRE = "#E07AA0", ROBE_LUMIERE = "#FFC4D6", LEGGING = "#EBD9F7", LEGGING_OMBRE = "#CDB3E3", BALLERINE = "#C86BD6", BALLERINE_OMBRE = "#9C44B0", OR = "#FFC93C", OR_OMBRE = "#D99A12";
  const DEG = Math.PI / 180;
  // ---------- Courbes ----------
  const E = {
    lineaire: (u) => u, sortie: (u) => 1 - Math.pow(1 - u, 3), entree: (u) => u * u * u,
    douce: (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
    retour: (u) => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
    rebond: (u) => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  };
  const lerp = (a, b, u) => a + (b - a) * u, clamp01 = (u) => Math.max(0, Math.min(1, u));
  const fenetre = (t, debut, duree, e = E.sortie) => e(clamp01((t - debut) / duree));
  const r1 = (v) => Math.round(v * 10) / 10;
  const tr = (el, v) => el.setAttribute("transform", v), att = (el, a, v) => el.setAttribute(a, v);
  const BASE = 1.3;

  // ---------- Membres : une courbe souple ----------
  const quad = (S, C, W, t) => ({ x: (1 - t) ** 2 * S.x + 2 * t * (1 - t) * C.x + t * t * W.x, y: (1 - t) ** 2 * S.y + 2 * t * (1 - t) * C.y + t * t * W.y });
  function membre(S, a1, a2, L1, L2) {
    const E1 = { x: S.x - Math.sin(a1 * DEG) * L1, y: S.y + Math.cos(a1 * DEG) * L1 };
    const W = { x: E1.x - Math.sin((a1 + a2) * DEG) * L2, y: E1.y + Math.cos((a1 + a2) * DEG) * L2 };
    const C = { x: 2 * E1.x - (S.x + W.x) / 2, y: 2 * E1.y - (S.y + W.y) / 2 };
    return { S, E: E1, W, C, dir: Math.atan2(W.x - E1.x, -(W.y - E1.y)) / DEG };
  }
  function trace(m, t0, t1, pas = 8) { let d = ""; for (let i = 0; i <= pas; i++) { const p = quad(m.S, m.C, m.W, lerp(t0, t1, i / pas)); d += `${i ? "L" : "M"}${r1(p.x)} ${r1(p.y)}`; } return d; }
  const ligne = (classe, couleur, largeur) => `<path class="${classe}" fill="none" stroke="${couleur}" stroke-width="${largeur}" stroke-linecap="round" stroke-linejoin="round"/>`;

  // ---------- Petites mains à cinq doigts ----------
  function doigtForme(x, y0, a, L, b = 2.7, tp = 1.9) {
    const dx = Math.sin(a * DEG), dy = -Math.cos(a * DEG), nx = -dy, ny = dx;
    const tx = x + dx * L, ty = y0 + dy * L, mx = (x + tx) / 2 + nx * .7, my = (y0 + ty) / 2 + ny * .7, mw = (b + tp) / 2;
    return `M${r1(x + nx * b)} ${r1(y0 + ny * b)} Q${r1(mx + nx * mw)} ${r1(my + ny * mw)} ${r1(tx + nx * tp)} ${r1(ty + ny * tp)} A${tp} ${tp} 0 0 0 ${r1(tx - nx * tp)} ${r1(ty - ny * tp)} Q${r1(mx - nx * mw)} ${r1(my - ny * mw)} ${r1(x - nx * b)} ${r1(y0 - ny * b)} Z`;
  }
  function main(pose, miroir) {
    const m = miroir ? -1 : 1, doigts = [-6.3, -2.1, 2.1, 6.3], angles = pose === 3 ? [-26, -9, 9, 26] : [-9, -3, 3, 9];
    const paume = `M-8 9 V-3 Q-8 -8 -3 -8 H3 Q8 -8 8 -3 V9 Q0 12 -8 9 Z`, paumePoing = `M-8 8 V-2 Q-8 -9 0 -9 Q8 -9 8 -2 V8 Q0 12 -8 8 Z`;
    const forme = (d, w) => `<path d="${d}" fill="none" stroke="${CONTOUR}" stroke-width="${w}" stroke-linejoin="round"/>`;
    let contours = "", remplissages = "";
    if (pose === 0 || pose === 3) {
      const formes = doigts.map((x, i) => doigtForme(x, -6, angles[i] * m, 9.5 - Math.abs(i - 1.5) * .7)), pouce = doigtForme(-7 * m, 0, -52 * m, 8, 2.6, 1.9);
      formes.concat(pouce).forEach((d) => (contours += forme(d, 5.2)));
      remplissages += formes.concat(pouce).map((d) => `<path d="${d}" fill="${PEAU}"/>`).join("");
      return `${contours}${forme(paume, 5.6)}<path d="${paume}" fill="${PEAU}"/>${remplissages}<path d="M3 8 Q7 4 7 -1" fill="none" stroke="${PEAU_OMBRE}" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    const pouce = pose === 2 ? doigtForme(-5 * m, -4, -10 * m, 12, 2.8, 2.1) : null;
    if (pouce) contours += forme(pouce, 5.4);
    doigts.forEach((x) => { contours += `<circle cx="${x}" cy="-8" r="5.4" fill="${CONTOUR}"/>`; });
    let dessus = doigts.map((x) => `<circle cx="${x}" cy="-8" r="3.6" fill="${PEAU}"/>`).join("") + `<rect x="-8" y="-8" width="16" height="6" fill="${PEAU}"/>`;
    dessus += doigts.map((x) => `<path d="M${x - 2.2} -6.5 q2.2 -1.8 4.4 0" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.4" stroke-linecap="round"/>`).join("");
    if (pouce) dessus += `<path d="${pouce}" fill="${PEAU}"/>`; else dessus += `<path d="M${-7 * m} 2 q${r1(5 * m)} 3 ${r1(10 * m)} 1" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.8" stroke-linecap="round"/>`;
    return `${contours}${forme(paumePoing, 5.6)}<path d="${paumePoing}" fill="${PEAU}"/>${dessus}`;
  }
  const MAINS = { droit: [0, 1, 2, 3].map((p) => main(p, false)), miroir: [0, 1, 2, 3].map((p) => main(p, true)) };


  // ---------- Le personnage : fée cartoon, de face ou de trois-quarts ----------
  const brasHTML = (c) => `<g id="bras-${c}">${ligne("contour", CONTOUR, 19)}${ligne("rempli", PEAU, 13)}${ligne("ombre", PEAU_OMBRE, 4.5)}${ligne("lumiere", PEAU_LUMIERE, 3)}<g class="manche"><ellipse rx="13" ry="10" fill="${ROBE}" stroke="${CONTOUR}" stroke-width="2.8"/><path d="M-9 4 Q0 10 9 4" fill="none" stroke="${ROBE_OMBRE}" stroke-width="3" stroke-linecap="round"/><ellipse cx="-4" cy="-4" rx="4" ry="2.4" fill="${ROBE_LUMIERE}" opacity=".9"/></g><g id="main-${c}"><g class="pose-main"></g></g></g>`;
  const jambeHTML = (c) => `<g id="jambe-${c}">${ligne("contour", CONTOUR, 18)}${ligne("rempli", LEGGING, 12)}${ligne("ombre", LEGGING_OMBRE, 4)}<g id="pied-${c}"><path d="M-10 -4 Q-12 6 -2 8 H6 Q14 8 12 1 Q10 -6 2 -7 Q-6 -8 -10 -4 Z" fill="${BALLERINE}" stroke="${CONTOUR}" stroke-width="2.6" stroke-linejoin="round"/><path d="M-6 -4 Q0 -1 6 -4" fill="none" stroke="${CONTOUR}" stroke-width="1.2" opacity=".6"/><path d="M0 -6 l-3 -3 l3 1 l3 -1 Z" fill="${OR}" stroke="${CONTOUR}" stroke-width="1"/></g></g>`;
  const oeilHTML = (c) => `<g id="oeil-${c}"><ellipse rx="9" ry="11" fill="#FFFFFF" stroke="${PEAU_OMBRE}" stroke-width="1"/>
      <g id="regard-${c}"><circle cx=".5" cy="3" r="5.4" fill="#2F5F8A"/><circle cx=".5" cy="3" r="4.4" fill="#4C8FF5"/><circle cx=".5" cy="3" r="2.6" fill="#1B1530"/><circle cx="-1.6" cy=".4" r="2" fill="#FFFFFF"/><circle cx="2.8" cy="5" r="1" fill="#FFFFFF"/></g>
      <g clip-path="url(#clip-oeil)"><ellipse id="paupiere-${c}" rx="11" ry="12" fill="${PEAU}" stroke="${CONTOUR}" stroke-width="2.6"/></g>
      <path d="M-8.5 0 A9 11 0 0 1 8.5 0" fill="none" stroke="${CONTOUR}" stroke-width="3" stroke-linecap="round"/>
      <path d="M-5 10.2 Q0 12 5 10.2" fill="none" stroke="${CONTOUR}" stroke-width="1" stroke-linecap="round" opacity=".4"/>
      <path d="M${c === "g" ? "-7 -8 l-2.6 -2.4 M-8.6 -4 l-3 -1.2" : "7 -8 l2.6 -2.4 M8.6 -4 l3 -1.2"}" fill="none" stroke="${CONTOUR}" stroke-width="2.2" stroke-linecap="round"/></g>`;
  const AILE = (m) => `<path d="M0 0 Q${18 * m} -34 ${44 * m} -40 Q${58 * m} -36 ${50 * m} -18 Q${42 * m} -4 ${12 * m} 2 Q${44 * m} 6 ${48 * m} 22 Q${44 * m} 36 ${26 * m} 32 Q${8 * m} 26 0 8 Z" fill="url(#aile)" stroke="#9CCFFF" stroke-width="2.4" stroke-linejoin="round"/><path d="M${6 * m} -2 Q${26 * m} -22 ${42 * m} -30 M${8 * m} 6 Q${26 * m} 14 ${38 * m} 22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".8"/>`;
  const MECHE = `<path class="meche" fill="${CHEVEUX}" stroke="${CONTOUR}" stroke-width="2.8" stroke-linejoin="round"/><path class="meche-ombre" fill="none" stroke="${CHEVEUX_OMBRE}" stroke-width="2.6" stroke-linecap="round"/><path class="meche-lumiere" fill="none" stroke="${CHEVEUX_LUMIERE}" stroke-width="2.2" stroke-linecap="round"/>`;
  $("leo").innerHTML = `
    <g id="ailes"><g id="aile-g">${AILE(-1)}</g><g id="aile-d">${AILE(1)}</g></g>
    <g id="cheveux-arriere"><path id="chevelure-dos" fill="${CHEVEUX}" stroke="${CONTOUR}" stroke-width="3" stroke-linejoin="round"/><g id="brin-0">${MECHE}</g><g id="brin-1">${MECHE}</g><g id="brin-2">${MECHE}</g><g id="brin-3">${MECHE}</g><g id="brin-4">${MECHE}</g></g>
    <g id="bras-arriere"></g>
    ${jambeHTML("g")}${jambeHTML("d")}
    <g id="robe">
      <path class="jupe-arriere" fill="${ROBE_OMBRE}" stroke="${CONTOUR}" stroke-width="3" stroke-linejoin="round"/>
      <path class="jupe" fill="${ROBE}" stroke="${CONTOUR}" stroke-width="3" stroke-linejoin="round"/>

  function dessineSurprise(anim, t, p) {

  }
  function dessineCri(anim, t) {

    att(N.cri, "opacity", r1(fenetre(t, anim.tCri, .12) * 100) / 100);
    tr(N.cri, `translate(0 ${r1(lerp(0, -14, repli))}) rotate(${r1(lerp(-8, 0, u))}) scale(${r1((0.2 + .8 * u) * lerp(1, .82, repli) * 100) / 100})`);
    const r = fenetre(t, anim.tCri, .55);

  }
  function dessineEtoiles(anim, t, p) {
    const d = anim.tJoie;
    if (d === null || t < d || t > d + 1) { att(N.etoiles, "opacity", 0); return; }
    att(N.etoiles, "opacity", 1);
    const cx = p.x, cy = p.y - 240;
    [...N.etoiles.children].forEach((e, i) => { const u = fenetre(t, d + i * .1, .7), k = Math.sin(Math.min(1, u) * Math.PI), a = -2.4 + i * 1.1; tr(e, `translate(${r1(cx + Math.cos(a) * (56 + u * 26))} ${r1(cy + Math.sin(a) * (30 + u * 16))}) rotate(${r1(u * 120)}) scale(${r1(k * 1.4 * 100) / 100})`); });
  }
  function dessineEtincelles(anim, t) {
    const d = anim.tPouce === undefined ? null : anim.tPouce;

    const el = document.getElementById("main-g"), mm = el.getCTM(), inv = N.leo.ownerSVGElement.getScreenCTM().inverse(), ptm = new DOMPoint(0, 0).matrixTransform(inv.multiply(mm)), m = { x: ptm.x, y: ptm.y };
    [...N.etincelles.children].forEach((e, i) => { const u = fenetre(t, d + i * .08, .6), a = -1.2 + i * 1.1, k = Math.sin(Math.min(1, u) * Math.PI); tr(e, `translate(${r1(m.x + Math.cos(a) * (14 + u * 18))} ${r1(m.y - 10 + Math.sin(a) * (14 + u * 18) - u * 6)}) rotate(${r1(u * 90)}) scale(${r1(k * 3 * 100) / 100})`); });
  }
  function dessineTextes(anim, t) {
    const u = fenetre(t, anim.tTitre, .45), v = fenetre(t, anim.tTitre + .2, .4);

  }


  // ---------- Étincelles et pétales qui tombent (canvas) ----------
  const canvas = $("confettis"), ctx = canvas.getContext("2d");
  const COULEURS = ["#FFC93C", "#FF8FB8", "#FFFFFF", "#B07CF0", "#9FD3FF"];
  let confettis = [];
  function semeConfettis(actifs) {
    confettis = [];
    if (!actifs) return;
    for (let i = 0; i < 56; i++) { const etoile = i % 3 === 0; confettis.push({ x: 20 + Math.random() * 320, y: -20 - Math.random() * 240, vx: (Math.random() - .5) * 30, vy: 30 + Math.random() * 30, etoile, w: 8 + Math.random() * 4, h: 4.5 + Math.random() * 2.5, rot: Math.random() * Math.PI, vrot: (Math.random() - .5) * 4, phase: Math.random() * 6.3, sol: 300 + Math.random() * 150, couleur: COULEURS[i % COULEURS.length], pose: false, retard: Math.random() * 1.2 }); }
  }
  function avanceConfettis(dt) {
    for (const c of confettis) { if (c.pose) continue; if (c.retard > 0) { c.retard -= dt; continue; } c.vy = Math.min(c.etoile ? 100 : 80, c.vy + 70 * dt); c.phase += dt * 4; c.x += c.vx * dt + Math.sin(c.phase) * 30 * dt; c.y += c.vy * dt; c.rot += c.vrot * dt + Math.cos(c.phase) * .05; if (c.y >= c.sol) { c.y = c.sol; c.pose = true; } }

    ctx.setTransform(canvas.width / 360, 0, 0, canvas.width / 360, 0, 0); ctx.clearRect(0, 0, 360, 450);
    for (const c of confettis) {
      if (c.retard > 0 || c.y < -12) continue;
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.strokeStyle = "#33304A"; ctx.lineWidth = .8; ctx.globalAlpha = c.pose ? .85 : .95; ctx.fillStyle = c.couleur;
      if (c.etoile) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 2.4 : 5.5, a = k * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
      else { const repli = c.pose ? .7 : .5 + .5 * Math.abs(Math.cos(c.phase)); ctx.beginPath(); ctx.ellipse(0, 0, c.w / 2, Math.max(1, c.h * repli / 2), 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      ctx.restore();
    }
  }

  // ---------- Horloge et commandes ----------
  let anim = null, depart = 0, tPrecedent = 0, enCours = false, image = 0;
  function rend(t) {
    const p = dessineLeo(anim, t);
    if (t <= T_SORT + .02) DEPART_SORT = { ...BAGUETTE_TIP };
    dessineTrainee(t); dessineSort(anim, t); dessineArc(anim, t); dessineEnvol(anim, t, p); dessineSignes(anim, t, p); dessineBulles(anim, t, p); dessineSouffle(p); dessineSurprise(anim, t, p);
    dessineCri(anim, t); dessineEtoiles(anim, t, p); dessineEtincelles(anim, t); dessineTextes(anim, t); dessineConfettis();
  }
  const tConfettis = () => anim.tPetales;
  function boucle(maintenant) {
    const t = Math.min(anim.fin, (maintenant - depart) / 1000);
    if (t >= tConfettis()) avanceConfettis(Math.min(.05, t - Math.max(tPrecedent, tConfettis())));
    tPrecedent = t; rend(t);
    if (t >= anim.fin) { termine(); return; }
    image = requestAnimationFrame(boucle);
  }
  function termine() { enCours = false; cancelAnimationFrame(image); N.annonce.textContent = ""; requestAnimationFrame(() => { N.annonce.textContent = anim.genre === "but" ? "Magique ! " + anim.titre : anim.titre; }); }
  function etatFinal() { for (let i = 0; i < 700; i++) avanceConfettis(1 / 60); tPrecedent = anim.fin; rend(anim.fin); termine(); }
  function prepare(nouvelle) {
    anim = nouvelle; semeConfettis(anim.genre === "but"); CHEV.tPrec = null; TRACE.length = 0; ETOILES_VOL.length = 0; BULLES.length = 0;
    document.querySelectorAll(".petit").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.celebration === anim.celebration)));
    N.scene.setAttribute("aria-label", anim.genre === "but" ? "Lumi fait éclore une fleur magique et fête le chapitre réussi. Touche la scène pour passer la fête." : "Le sort fait pschitt et des bulles sortent de la baguette ; Lumi rit, souffle sur les bulles et lève le pouce : on réessaie. Touche la scène pour passer l'animation.");
  }
  function lance(nouvelle) { cancelAnimationFrame(image); prepare(nouvelle); if (mouvementsReduits) { etatFinal(); return; } enCours = true; depart = performance.now(); tPrecedent = 0; rend(0); image = requestAnimationFrame(boucle); }
  const auHasard = () => ["arc", "envol", "signes"][Math.floor(Math.random() * 3)];
  $("marquer").addEventListener("click", () => lance(construitBut(auHasard())));
  $("rater").addEventListener("click", () => lance(construitEchec()));
  document.querySelectorAll(".petit").forEach((b) => b.addEventListener("click", () => lance(construitBut(b.dataset.celebration))));
  const passe = () => { if (enCours) etatFinal(); };
  N.scene.addEventListener("pointerdown", passe);
  N.scene.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); passe(); } });

  // Mise au point : « ?anim=arc|envol|signes|echec&t=1.2 » rend l'image fixe ; « ?planche=mains » ou « ?planche=tetes » montre une planche.
  const params = new URLSearchParams(location.search);
  function rendStatique(nouvelle, t) { prepare(nouvelle); for (let s = tConfettis(); s < t; s += 1 / 60) avanceConfettis(1 / 60); for (let s = 0; s < t; s += 1 / 30) rend(s); rend(t); }
  function planche(quoi) {
    N.planche.innerHTML = `<rect width="360" height="450" fill="#FFE6F1"/>`;
    att(N.planche, "opacity", 1);
    if (quoi === "mains") {
      N.planche.innerHTML += [0, 1, 2, 3].map((p, i) => `<g transform="translate(${50 + i * 88} 120) scale(3)">${main(p, false)}</g><g transform="translate(${50 + i * 88} 320) scale(3)">${main(p, true)}</g>`).join("") + ["détendue", "poing", "pouce levé", "écartée"].map((l, i) => `<text x="${50 + i * 88}" y="210" text-anchor="middle" font-family="Andika" font-size="13" fill="#3A2250">${l}</text>`).join("");
      return;
    }
    const cas = [["face", 0, "sourire"], ["¾ gauche", -1, "sourire"], ["¾ droit", 1, "sourire"], ["joie", 0, "joie"], ["surprise", 0, "surprise"], ["concentration", 0, "concentration"], ["clin d'œil", 0, "joie"], ["souffle", 0, "souffle"], ["sourire en coin", 0, "coin"]];

      const p = { ...REPOS, vue, clin: libelle === "clin d'œil" ? 1 : 0 };
      dessineTete(p, .3, { emo, prec: emo, u: 1 }, 0, EMOS[emo].pup);
      const c = N.tete.cloneNode(true); c.removeAttribute("id"); c.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));

    });
  }
  const polices = document.fonts && document.fonts.load ? document.fonts.load("800 54px 'Baloo 2'") : Promise.resolve();
  Promise.race([polices, new Promise((r) => setTimeout(r, 1500))]).finally(() => {
