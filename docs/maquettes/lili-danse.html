<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savanturier : Lili, danseuse étoile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #7A35C8; --foncee: #5A1F9E; --or: #FFC93C; --encre: #2A1B4A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0f1b2d; }
  body { font-family: "Andika", system-ui, sans-serif; color: var(--encre); display: flex; justify-content: center; padding: 10px 0; }
  .telephone { width: 100%; max-width: 370px; height: 680px; border-radius: 28px; overflow: hidden; background: linear-gradient(#F3D2FF, #FFF0F7); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .scene { position: relative; width: 100%; aspect-ratio: 360 / 450; flex: none; touch-action: manipulation; cursor: pointer; outline: none; }
  .scene:focus-visible { box-shadow: inset 0 0 0 4px var(--or); }
  .scene svg, .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { pointer-events: none; }
  .bandeau { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 6px 14px 10px; text-align: center; }
  .titre { margin: 0; min-height: 36px; font-family: "Baloo 2", "Andika", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--foncee); opacity: 0; transform: translateY(12px); }
  .sous { margin: 0; min-height: 20px; font-size: 14px; line-height: 1.3; color: #3C4C6B; opacity: 0; transform: translateY(8px); }
  .boutons { display: flex; gap: 10px; margin-top: 6px; }
  .btn { min-height: 48px; padding: 8px 20px; border: 0; border-radius: 999px; font: 700 17px "Baloo 2", "Andika", sans-serif; cursor: pointer; transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .btn:active { transform: translateY(3px); }
  .btn:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  .principal { background: var(--principale); color: #fff; box-shadow: 0 4px 0 var(--foncee); }
  .principal:active { box-shadow: 0 1px 0 var(--foncee); }
  .secondaire { background: #fff; color: var(--foncee); box-shadow: 0 4px 0 #D9C3EC; }
  .secondaire:active { box-shadow: 0 1px 0 #D9C3EC; }
  .petits { display: flex; gap: 8px; margin-top: 6px; }
  .petit { min-height: 44px; min-width: 44px; padding: 6px 12px; border: 2px solid #D9C3EC; border-radius: 12px; background: #fff; color: #3C4C6B; font: 700 13px "Andika", sans-serif; cursor: pointer; }
  .petit[aria-pressed="true"] { border-color: var(--principale); color: var(--principale); background: #F6EAFF; }
  .petit:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .poussiere-lumineuse circle { animation: scintille 3s ease-in-out infinite; }
  .poussiere-lumineuse circle:nth-child(2n) { animation-delay: 1s; }
  .poussiere-lumineuse circle:nth-child(3n) { animation-delay: 2s; }
  @keyframes scintille { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .nuage { animation: derive 80s linear infinite; }
  .nuage.lent { animation-duration: 120s; }
  @keyframes derive { from { transform: translateX(0); } to { transform: translateX(-420px); } }
  @media (prefers-reduced-motion: reduce) { .nuage, .poussiere-lumineuse circle { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<div class="telephone">
  <div class="scene" id="scene" tabindex="0" role="img" aria-label="Lili s'élance pour une pirouette sur la scène de l'Opéra des Savanturiers. Touche la scène pour passer l'animation.">
    <svg viewBox="30 110 300 375" aria-hidden="true" id="svg">
      <defs>
        <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B2358"/><stop offset=".6" stop-color="#5A3A7A"/><stop offset="1" stop-color="#7A4F94"/></linearGradient>
        <linearGradient id="rideau" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A1686"/><stop offset=".5" stop-color="#8A47D6"/><stop offset="1" stop-color="#4A1686"/></linearGradient>
        <linearGradient id="plancher" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E2A20"/><stop offset="1" stop-color="#5A3C2C"/></linearGradient>
        <radialGradient id="projecteur" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6D8" stop-opacity=".55"/><stop offset=".6" stop-color="#FFE9C8" stop-opacity=".22"/><stop offset="1" stop-color="#FFE9C8" stop-opacity="0"/></radialGradient>
        <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3D6" stop-opacity=".42"/><stop offset="1" stop-color="#FFF3D6" stop-opacity="0"/></linearGradient>
        <radialGradient id="lampe" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
        <linearGradient id="salle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1A3E" stop-opacity="0"/><stop offset="1" stop-color="#1E1230"/></linearGradient>
        <clipPath id="clip-oeil"><ellipse rx="7.4" ry="9.6"/></clipPath>
        <clipPath id="clip-bouche"><path d="M-11 11 Q0 27 11 11 Z"/></clipPath>
      </defs>

      <!-- Scène de théâtre : salle en pénombre, coulisses, faisceaux, plancher, nez de scène, rampe, rideaux, public -->
      <rect width="360" height="500" fill="url(#fond)"/>
      <g fill="#2E1A48" opacity=".9"><rect x="60" y="110" width="30" height="190"/><rect x="270" y="110" width="30" height="190"/><rect x="96" y="150" width="14" height="150" opacity=".6"/><rect x="250" y="150" width="14" height="150" opacity=".6"/></g>
      <g id="faisceaux" opacity=".85">
        <path d="M128 96 L152 96 L250 310 L120 310 Z" fill="url(#cone)"/>
        <path d="M232 96 L208 96 L110 310 L240 310 Z" fill="url(#cone)"/>
        <path d="M168 96 L192 96 L230 310 L130 310 Z" fill="url(#cone)" opacity=".7"/>
        <g class="poussiere-lumineuse" fill="#FFF7E0"><circle cx="150" cy="150" r="1.4"/><circle cx="190" cy="190" r="1.1"/><circle cx="214" cy="140" r="1.5"/><circle cx="168" cy="236" r="1.2"/><circle cx="232" cy="262" r="1"/><circle cx="136" cy="268" r="1.3"/><circle cx="204" cy="118" r="1"/><circle cx="178" cy="286" r="1.1"/></g>
      </g>
      <!-- plancher de scène : planches sombres et larges, reflets, marques au sol -->
      <rect x="0" y="296" width="360" height="190" fill="url(#plancher)"/>
      <g fill="none" stroke="#2A1A12" stroke-width="2.4" opacity=".8"><path d="M0 296 H360 M0 332 H360 M0 374 H360 M0 420 H360"/></g>
      <g fill="none" stroke="#2A1A12" stroke-width="2" opacity=".6"><path d="M84 296 V332 M232 296 V332 M150 332 V374 M300 332 V374 M60 374 V420 M212 374 V420 M120 420 V458 M280 420 V458"/></g>
      <g fill="none" stroke="#8A6248" stroke-width="1.2" opacity=".35"><path d="M0 299 H360 M0 335 H360 M0 377 H360 M0 423 H360"/></g>
      <ellipse cx="180" cy="430" rx="170" ry="46" fill="url(#projecteur)"/>
      <ellipse id="cercle-lumiere" cx="180" cy="440" rx="62" ry="15" fill="url(#projecteur)" opacity=".9"/>
      <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".32"><path d="M112 404 L124 412 M124 404 L112 412 M248 386 L258 393 M258 386 L248 393 M184 452 L192 457 M192 452 L184 457"/></g>
      <!-- nez de scène : bord avant arrondi, moulure dorée, rampe de lampes, puis la salle -->
      <path d="M-10 452 Q180 468 370 452 V500 H-10 Z" fill="#2B1A12"/>
      <path d="M-10 452 Q180 468 370 452" fill="none" stroke="#FFC93C" stroke-width="4"/>
      <path d="M-10 458 Q180 474 370 458" fill="none" stroke="#C98A12" stroke-width="2" opacity=".8"/>
      <g id="rampe"></g>
      <rect x="0" y="470" width="360" height="40" fill="url(#salle)"/>
      <g id="public" fill="#1E1230" opacity=".92"><ellipse cx="40" cy="496" rx="18" ry="16"/><ellipse cx="96" cy="500" rx="17" ry="15"/><ellipse cx="150" cy="494" rx="19" ry="17"/><ellipse cx="210" cy="499" rx="17" ry="15"/><ellipse cx="266" cy="495" rx="18" ry="16"/><ellipse cx="322" cy="500" rx="17" ry="15"/><rect x="0" y="498" width="360" height="20"/></g>
      <!-- rideaux de velours drapés et lambrequin doré -->
      <g id="rideaux">
        <path d="M0 96 H96 Q100 190 72 250 Q92 290 60 304 Q30 318 0 304 Z" fill="url(#rideau)" stroke="#33304A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M16 96 Q28 190 14 250 Q20 280 8 304 M40 96 Q56 190 36 250 Q46 280 30 304 M66 96 Q84 190 58 250 Q70 280 50 304" fill="none" stroke="#3A0F6E" stroke-width="7" opacity=".6"/>
        <path d="M16 96 Q28 190 14 250 M40 96 Q56 190 36 250 M66 96 Q84 190 58 250" fill="none" stroke="#B88BF0" stroke-width="2" opacity=".45" transform="translate(6 0)"/>
        <path d="M360 96 H264 Q260 190 288 250 Q268 290 300 304 Q330 318 360 304 Z" fill="url(#rideau)" stroke="#33304A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M344 96 Q332 190 346 250 Q340 280 352 304 M320 96 Q304 190 324 250 Q314 280 330 304 M294 96 Q276 190 302 250 Q290 280 310 304" fill="none" stroke="#3A0F6E" stroke-width="7" opacity=".6"/>
        <path d="M344 96 Q332 190 346 250 M320 96 Q304 190 324 250 M294 96 Q276 190 302 250" fill="none" stroke="#B88BF0" stroke-width="2" opacity=".45" transform="translate(-6 0)"/>
        <path d="M46 238 Q72 228 90 252 Q72 266 52 258 Z M314 238 Q288 228 270 252 Q288 266 308 258 Z" fill="#FFC93C" stroke="#33304A" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M0 96 H360 V122 Q330 148 300 124 Q270 150 240 124 Q210 150 180 124 Q150 150 120 124 Q90 150 60 124 Q30 148 0 122 Z" fill="#6C2AB8" stroke="#33304A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M0 122 Q30 148 60 124 Q90 150 120 124 Q150 150 180 124 Q210 150 240 124 Q270 150 300 124 Q330 148 360 122" fill="none" stroke="#FFC93C" stroke-width="4"/>
      </g>
      <g id="but" opacity="0"><g id="filet-fond"></g><g id="ballon-couche"></g><g id="filet-cotes"></g><g id="poteau-droit"></g></g>
      <g id="impact" opacity="0"></g><g id="ballon-devant"></g>
      <g id="ruban" fill="none" stroke="#FF8FB8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><path class="trace"/><path class="eclat" stroke="#FFFFFF" stroke-width="1.6" opacity=".7"/></g>
      <g id="etoile-ruban" opacity="0"><path fill="#FFC93C" stroke="#33304A" stroke-width="3" stroke-linejoin="round" d="M0 -46 L13 -14 L47 -14 L20 7 L30 40 L0 20 L-30 40 L-20 7 L-47 -14 L-13 -14 Z"/><path fill="#FFE27A" d="M0 -30 L8 -10 L30 -10 L13 3 L19 24 L0 12 L-19 24 L-13 3 L-30 -10 L-8 -10 Z"/></g>
      <ellipse id="ombre-leo" cx="70" cy="420" rx="34" ry="8" fill="#1E1230" opacity=".3"/>
      <g id="poussiere" fill="#EAF6D2" stroke="#BFE39C" stroke-width="1.5"></g>
      <g id="vitesse" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0"></g>
      <g id="leo"></g>
      <g id="surprise" opacity="0"><circle r="11" fill="#FFF7C2" stroke="#33304A" stroke-width="3"/><path d="M0 -5 V2 M0 5.5 V6" stroke="#33304A" stroke-width="3.2" stroke-linecap="round"/></g>
      <g id="etoiles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.8" stroke-linejoin="round"></g>
      <g id="gouttes" opacity="0" fill="#9FD3FF" stroke="#33304A" stroke-width="1.5"></g>
      <g id="etincelles" opacity="0" fill="#FFC93C" stroke="#33304A" stroke-width="1.5" stroke-linejoin="round"></g>

      <g transform="translate(180 160)">
        <g id="rayons" opacity="0"></g>
        <g id="cri" opacity="0">
          <text x="3" y="4" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="56" fill="#FFC93C" stroke="#33304A" stroke-width="12" stroke-linejoin="round" paint-order="stroke">Bravo !</text>
          <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', 'Andika', sans-serif" font-weight="800" font-size="56" fill="#7A35C8" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Bravo !</text>
        </g>
      </g>
      <g id="planche" opacity="0"></g>
    </svg>
    <canvas id="confettis" aria-hidden="true"></canvas>
  </div>
  <div class="bandeau">
    <p class="titre" id="titre"></p>
    <p class="sous" id="sous"></p>
    <div class="boutons">
      <button class="btn principal" id="marquer" type="button">Réussir</button>
      <button class="btn secondaire" id="rater" type="button">Rater</button>
    </div>
    <div class="petits" role="group" aria-label="Choisir la célébration">
      <button class="petit" type="button" data-celebration="jete" aria-pressed="false">A · Grand jeté</button>
      <button class="petit" type="button" data-celebration="ruban" aria-pressed="false">B · Ruban</button>
      <button class="petit" type="button" data-celebration="sauts" aria-pressed="false">C · Petits sauts</button>
    </div>
  </div>
  <p class="sr-only" id="annonce" aria-live="polite"></p>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const mouvementsReduits = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CONTOUR = "#33304A", PEAU = "#e8b58c", PEAU_OMBRE = "#C9956E", PEAU_LUMIERE = "#F7D4B8", CHEVEUX = "#B8873E", CHEVEUX_OMBRE = "#8F6528", CHEVEUX_LUMIERE = "#DDB46A",
    TENUE = "#b55bd6", TENUE_OMBRE = "#8E3FB0", TENUE_LUMIERE = "#D08AE8", TUTU = "#F3C9F2", TUTU_OMBRE = "#D9A6DE", TUTU_ARRIERE = "#E6B5E8", COLLANT = "#FBEFF9", COLLANT_OMBRE = "#E2CCE0", CHAUSSON = "#F6B4CF", CHAUSSON_OMBRE = "#E08FB4", RUBAN = "#FF8FB8";
  const SHORT = TUTU, SHORT_OMBRE = TUTU_OMBRE, CHAUSSURE = CHAUSSON, CHAUSSURE_OMBRE = CHAUSSON_OMBRE;
  const DEG = Math.PI / 180;

  // ---------- Courbes ----------
  const E = {
    lineaire: (u) => u,
    sortie: (u) => 1 - Math.pow(1 - u, 3),
    entree: (u) => u * u * u,
    douce: (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
    retour: (u) => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
    rebond: (u) => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  };
  const lerp = (a, b, u) => a + (b - a) * u, clamp01 = (u) => Math.max(0, Math.min(1, u));
  const fenetre = (t, debut, duree, e = E.sortie) => e(clamp01((t - debut) / duree));
  const r1 = (v) => Math.round(v * 10) / 10;
  const BASE = 1.25, SOL_LEO = 418;
  const profondeur = (ySol) => lerp(1, .45, clamp01((SOL_LEO - ySol) / (SOL_LEO - 312)));
  const tr = (el, v) => el.setAttribute("transform", v);
  const att = (el, a, v) => el.setAttribute(a, v);

  // ---------- Géométrie des membres : une seule courbe souple par membre ----------
  const quad = (S, C, W, t) => ({ x: (1 - t) ** 2 * S.x + 2 * t * (1 - t) * C.x + t * t * W.x, y: (1 - t) ** 2 * S.y + 2 * t * (1 - t) * C.y + t * t * W.y });
  function membre(S, a1, a2, L1, L2) {
    const E1 = { x: S.x - Math.sin(a1 * DEG) * L1, y: S.y + Math.cos(a1 * DEG) * L1 };
    const W = { x: E1.x - Math.sin((a1 + a2) * DEG) * L2, y: E1.y + Math.cos((a1 + a2) * DEG) * L2 };
    const C = { x: 2 * E1.x - (S.x + W.x) / 2, y: 2 * E1.y - (S.y + W.y) / 2 };
    const dir = Math.atan2(W.x - E1.x, -(W.y - E1.y)) / DEG; // rotation qui envoie « vers le haut » le long de l'avant-bras
    return { S, E: E1, W, C, dir };
  }
  function trace(m, t0, t1, pas = 8) {
    let d = "";
    for (let i = 0; i <= pas; i++) { const p = quad(m.S, m.C, m.W, lerp(t0, t1, i / pas)); d += `${i ? "L" : "M"}${r1(p.x)} ${r1(p.y)}`; }
    return d;
  }
  const ligne = (classe, couleur, largeur, extra = "") => `<path class="${classe}" fill="none" stroke="${couleur}" stroke-width="${largeur}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;

  // ---------- Mains à cinq doigts ----------
  // Un doigt effilé et légèrement courbe, de la base (x, y0) dans la direction a (0 = vers le haut), longueur L.
  function doigtForme(x, y0, a, L, b = 2.7, tp = 1.9) {
    const dx = Math.sin(a * DEG), dy = -Math.cos(a * DEG), nx = -dy, ny = dx;
    const tx = x + dx * L, ty = y0 + dy * L, mx = (x + tx) / 2 + nx * .7, my = (y0 + ty) / 2 + ny * .7, mw = (b + tp) / 2;
    return `M${r1(x + nx * b)} ${r1(y0 + ny * b)} Q${r1(mx + nx * mw)} ${r1(my + ny * mw)} ${r1(tx + nx * tp)} ${r1(ty + ny * tp)} A${tp} ${tp} 0 0 0 ${r1(tx - nx * tp)} ${r1(ty - ny * tp)} Q${r1(mx - nx * mw)} ${r1(my - ny * mw)} ${r1(x - nx * b)} ${r1(y0 - ny * b)} Z`;
  }
  function main(pose, miroir) {
    const m = miroir ? -1 : 1, doigts = [-6.3, -2.1, 2.1, 6.3], angles = pose === 3 ? [-26, -9, 9, 26] : [-9, -3, 3, 9];
    const paume = `M-8 9 V-3 Q-8 -8 -3 -8 H3 Q8 -8 8 -3 V9 Q0 12 -8 9 Z`;
    const paumePoing = `M-8 8 V-2 Q-8 -9 0 -9 Q8 -9 8 -2 V8 Q0 12 -8 8 Z`;
    const forme = (d, w) => `<path d="${d}" fill="none" stroke="${CONTOUR}" stroke-width="${w}" stroke-linejoin="round"/>`;
    let contours = "", remplissages = "";
    if (pose === 0 || pose === 3) { // ouverte : détendue (0) ou doigts écartés (3)
      const formes = doigts.map((x, i) => doigtForme(x, -6, angles[i] * m, 10.5 - Math.abs(i - 1.5) * .8));
      const pouce = doigtForme(-7 * m, 0, -52 * m, 9, 2.6, 1.9);
      formes.concat(pouce).forEach((d) => (contours += forme(d, 5.2)));
      remplissages += formes.concat(pouce).map((d) => `<path d="${d}" fill="${PEAU}"/>`).join("");
      remplissages += doigts.map((x, i) => { const a = angles[i] * m * DEG; return `<path d="M${r1(x + Math.sin(a) * 3)} ${r1(-6 - Math.cos(a) * 3)} l${r1(Math.sin(a) * 4)} ${r1(-Math.cos(a) * 4)}" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>`; }).join("");
      return `${contours}${forme(paume, 5.6)}<path d="${paume}" fill="${PEAU}"/>${remplissages}<path d="M3 8 Q7 4 7 -1" fill="none" stroke="${PEAU_OMBRE}" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    // poing (1) ou pouce levé (2) : quatre doigts repliés visibles, pouce rangé ou dressé dans le prolongement de l'avant-bras
    const pouce = pose === 2 ? doigtForme(-5 * m, -4, -10 * m, 13, 2.8, 2.1) : null;
    if (pouce) contours += forme(pouce, 5.4);
    doigts.forEach((x) => { contours += `<circle cx="${x}" cy="-8" r="5.4" fill="${CONTOUR}"/>`; });
    let dessus = doigts.map((x) => `<circle cx="${x}" cy="-8" r="3.6" fill="${PEAU}"/>`).join("") + `<rect x="-8" y="-8" width="16" height="6" fill="${PEAU}"/>`;
    dessus += doigts.map((x) => `<path d="M${x - 2.2} -6.5 q2.2 -1.8 4.4 0" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.4" stroke-linecap="round"/>`).join("");
    if (pouce) dessus += `<path d="${pouce}" fill="${PEAU}"/><path d="M${r1(-6 * m)} -3 l${r1(-1.5 * m)} -6" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.6" stroke-linecap="round"/>`;
    else dessus += `<path d="M${-7 * m} 2 q${r1(5 * m)} 3 ${r1(10 * m)} 1" fill="none" stroke="${PEAU_OMBRE}" stroke-width="1.8" stroke-linecap="round"/>`;
    return `${contours}${forme(paumePoing, 5.6)}<path d="${paumePoing}" fill="${PEAU}"/>${dessus}<path d="M3 7 Q7 3 7 -2" fill="none" stroke="${PEAU_OMBRE}" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  const MAINS = { droit: [0, 1, 2, 3].map((p) => main(p, false)), miroir: [0, 1, 2, 3].map((p) => main(p, true)) };

  // ---------- Structure du personnage ----------
  const brasHTML = (c) => `<g id="bras-${c}">
