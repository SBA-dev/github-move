<svg xmlns="http://www.w3.org/2000/svg" width="120" height="110" viewBox="0 0 120 110">
<defs><linearGradient id="w-pompier" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0523A"/><stop offset="1" stop-color="#C2341B"/></linearGradient></defs>
<!-- roues (dans les coins du bas) -->
<circle cx="20" cy="98" r="11" fill="#3A2F45" stroke="#F4EFE6" stroke-width="2.5"/><circle cx="20" cy="98" r="4.4" fill="#FFC93C"/><circle cx="100" cy="98" r="11" fill="#3A2F45" stroke="#F4EFE6" stroke-width="2.5"/><circle cx="100" cy="98" r="4.4" fill="#FFC93C"/>
<!-- corps : dégradé vertical, identique sur toute la largeur -->
<rect x="4" y="20" width="112" height="66" rx="8" fill="url(#w-pompier)" stroke="#6E1708" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<!-- châssis et attelages -->
<rect x="4" y="86" width="112" height="6" fill="#FFC93C" stroke="#6E1708" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="0" y="87.5" width="6" height="4" rx="2" fill="#6E1708"/><rect x="114" y="87.5" width="6" height="4" rx="2" fill="#6E1708"/>
<!-- toit -->
<rect x="2" y="12" width="116" height="10" rx="5" fill="#A8281A" stroke="#6E1708" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<!-- petite échelle dorée posée sur le toit, à gauche -->
<path d="M5 3.5 H32 M5 10.5 H32" fill="none" stroke="#A56F00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M11 3.5 V10.5 M18.5 3.5 V10.5 M26 3.5 V10.5" fill="none" stroke="#A56F00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<!-- plaque claire : le texte de l'étiquette (HTML) se pose dessus ; elle déborde de 4 px sur les bords de la case centrale -->
<rect x="30" y="24" width="60" height="60" rx="4" fill="#FFF1E6" stroke="#6E1708" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
