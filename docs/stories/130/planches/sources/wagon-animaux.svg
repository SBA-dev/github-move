<svg xmlns="http://www.w3.org/2000/svg" width="120" height="110" viewBox="0 0 120 110">
<defs><linearGradient id="w-animaux" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9A55B"/><stop offset="1" stop-color="#B97F3E"/></linearGradient></defs>
<!-- roues (dans les coins du bas) -->
<circle cx="20" cy="98" r="11" fill="#3A2F45" stroke="#F4EFE6" stroke-width="2.5"/><circle cx="20" cy="98" r="4.4" fill="#7A4B1F"/><circle cx="100" cy="98" r="11" fill="#3A2F45" stroke="#F4EFE6" stroke-width="2.5"/><circle cx="100" cy="98" r="4.4" fill="#7A4B1F"/>
<!-- corps : dégradé vertical, identique sur toute la largeur -->
<rect x="4" y="20" width="112" height="66" rx="8" fill="url(#w-animaux)" stroke="#6B4423" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<!-- châssis et attelages -->
<rect x="4" y="86" width="112" height="6" fill="#7A4B1F" stroke="#6B4423" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="0" y="87.5" width="6" height="4" rx="2" fill="#6B4423"/><rect x="114" y="87.5" width="6" height="4" rx="2" fill="#6B4423"/>
<!-- toit -->
<rect x="2" y="12" width="116" height="10" rx="5" fill="#4FB37A" stroke="#6B4423" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<!-- gland posé sur le toit, à gauche ; feuilles à droite -->
<path d="M11 6 Q11 0 18 0 Q25 0 25 6 Z" fill="#8A5A2B" stroke="#5B3A1E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M12.5 6 Q12.5 15 18 17 Q23.5 15 23.5 6 Z" fill="#F0CF8A" stroke="#8A5A2B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="96" cy="8" rx="10" ry="4.5" transform="rotate(-25 96 8)" fill="#6CBF84" stroke="#2E7E52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="108" cy="9" rx="9" ry="4" transform="rotate(20 108 9)" fill="#4FB37A" stroke="#2E7E52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<!-- plaque claire : le texte de l'étiquette (HTML) se pose dessus ; elle déborde de 4 px sur les bords de la case centrale -->
<rect x="30" y="24" width="60" height="60" rx="4" fill="#FFF3DF" stroke="#6B4423" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
