<svg xmlns="http://www.w3.org/2000/svg" width="120" height="110" viewBox="0 0 120 110">
<defs><linearGradient id="w-danse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBA6DA"/><stop offset="1" stop-color="#D68BC8"/></linearGradient></defs>
<!-- roues (dans les coins du bas) -->
<circle cx="20" cy="98" r="11" fill="#3A2F45" stroke="#F4EFE6" stroke-width="2.5"/><circle cx="20" cy="98" r="4.4" fill="#D9DDEA"/><circle cx="100" cy="98" r="11" fill="#3A2F45" stroke="#F4EFE6" stroke-width="2.5"/><circle cx="100" cy="98" r="4.4" fill="#D9DDEA"/>
<!-- corps : dégradé vertical, identique sur toute la largeur -->
<rect x="4" y="20" width="112" height="66" rx="8" fill="url(#w-danse)" stroke="#7A35C8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<!-- châssis et attelages -->
<rect x="4" y="86" width="112" height="6" fill="#FFFFFF" stroke="#7A35C8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="0" y="87.5" width="6" height="4" rx="2" fill="#7A35C8"/><rect x="114" y="87.5" width="6" height="4" rx="2" fill="#7A35C8"/>
<!-- toit -->
<rect x="2" y="12" width="116" height="10" rx="5" fill="#B96FCB" stroke="#7A35C8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<!-- nœud de ruban à gauche, note de musique à droite -->
<ellipse cx="12" cy="7" rx="8" ry="4.5" transform="rotate(-20 12 7)" fill="#FFFFFF" stroke="#7A35C8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="28" cy="7" rx="8" ry="4.5" transform="rotate(20 28 7)" fill="#FFFFFF" stroke="#7A35C8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="20" cy="8" r="4" fill="#F6A5C8" stroke="#7A35C8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="97" cy="14" rx="5.5" ry="4" transform="rotate(-20 97 14)" fill="#7A35C8"/>
<path d="M102 13 V0 Q108 3 109 8" fill="none" stroke="#7A35C8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<!-- plaque claire : le texte de l'étiquette (HTML) se pose dessus ; elle déborde de 4 px sur les bords de la case centrale -->
<rect x="30" y="24" width="60" height="60" rx="4" fill="#FFF0F8" stroke="#7A35C8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
